<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Back Forty | Studio LaDuke</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#06100e;color:#fff7df}
    body{font-family:Georgia,"Times New Roman",serif;min-height:100svh}
    button,a{font:inherit}

    .scene-shell{position:fixed;inset:0;overflow:hidden;background:#06100e;touch-action:none}
    .scene-shell.pannable{cursor:grab}
    .scene-shell.dragging{cursor:grabbing}
    .scene{
      position:absolute;left:50%;top:50%;width:max(100vw,calc(100svh * 1.7779));height:max(100svh,calc(100vw / 1.7779));
      transform:translate(calc(-50% + var(--pan-x,0px)),-50%);overflow:hidden;isolation:isolate;will-change:transform
    }
    .scene-image{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none}
    .vignette{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 53% 46%,transparent 42%,rgba(0,8,7,.14) 74%,rgba(0,5,4,.48) 100%)}
    .rain-sheen{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.26;background:linear-gradient(110deg,transparent 0 44%,rgba(193,228,230,.1) 45%,transparent 47% 100%);animation:sheen 8s ease-in-out infinite alternate}
    @keyframes sheen{to{transform:translateX(7%);opacity:.38}}

    .title-plaque{position:absolute;z-index:20;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);min-width:min(430px,70vw);padding:10px 24px 9px;border:1px solid rgba(255,224,164,.42);border-radius:999px;text-align:center;background:rgba(5,17,15,.72);box-shadow:0 8px 28px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(8px)}
    .title-plaque strong{display:block;font-size:clamp(18px,2.3vw,30px);letter-spacing:.12em;text-transform:uppercase}
    .title-plaque span{display:block;margin-top:2px;color:#d8c49b;font:700 clamp(10px,1vw,12px)/1.2 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase}

    .hotspot{position:absolute;z-index:10;display:block;padding:0;border:1px solid transparent;border-radius:18px;background:transparent;color:transparent;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .hotspot::after{content:attr(data-tip);position:absolute;left:50%;bottom:8%;transform:translate(-50%,8px);width:max-content;max-width:230px;padding:8px 11px;border:1px solid rgba(255,224,164,.5);border-radius:999px;color:#fff6dc;background:rgba(4,15,13,.86);font:800 12px/1.1 system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;opacity:0;transition:.18s ease;pointer-events:none;box-shadow:0 5px 20px rgba(0,0,0,.42)}
    .hotspot:hover,.hotspot:focus-visible{outline:2px solid rgba(255,214,129,.72);outline-offset:-2px;background:rgba(255,205,108,.055)}
    .hotspot:hover::after,.hotspot:focus-visible::after{opacity:1;transform:translate(-50%,0)}
    .workshop-door{left:0;top:0;width:12.5%;height:100%;border-radius:0}
    .firepit{left:8%;top:22%;width:32%;height:47%}
    .raven{left:13.2%;top:41.5%;width:8.5%;height:17%;z-index:13}
    .fort-trail{left:43.5%;top:11%;width:20%;height:54%}
    .greenhouse{left:66.5%;top:4%;width:33.5%;height:62%}
    .token{left:71.5%;top:69%;width:18%;height:20%;z-index:14;border-radius:50%}

    .fire-glow{position:absolute;z-index:4;left:19.5%;top:43%;width:11%;height:18%;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,218,129,.44),rgba(255,106,31,.18) 38%,transparent 72%);filter:blur(8px);animation:fireGlow 1.4s ease-in-out infinite alternate;transition:.3s ease}
    .scene.fire-high .fire-glow{transform:scale(1.5);filter:blur(10px);background:radial-gradient(circle,rgba(255,239,166,.68),rgba(255,91,20,.32) 42%,transparent 74%)}
    @keyframes fireGlow{from{opacity:.58;transform:scale(.92)}to{opacity:1;transform:scale(1.08)}}
    .scene.fire-high .fire-glow{animation-name:fireHigh}
    @keyframes fireHigh{from{opacity:.75;transform:scale(1.28)}to{opacity:1;transform:scale(1.5)}}

    .firefly{position:absolute;z-index:5;width:4px;height:4px;border-radius:50%;pointer-events:none;background:#ffe99a;box-shadow:0 0 5px #ffe99a,0 0 12px #ffc95d;animation:drift var(--speed) ease-in-out infinite alternate;animation-delay:var(--delay)}
    @keyframes drift{to{transform:translate(var(--dx),var(--dy));opacity:.2}}

    .audio-toggle{position:fixed;z-index:30;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));min-height:44px;padding:9px 13px;border:1px solid rgba(255,225,168,.45);border-radius:999px;color:#fff3d6;background:rgba(4,16,14,.76);cursor:pointer;backdrop-filter:blur(8px);font:800 12px/1 system-ui,sans-serif;letter-spacing:.04em}
    .wayfinder{position:fixed;z-index:28;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;padding:7px;border:1px solid rgba(255,225,168,.27);border-radius:999px;background:rgba(3,14,12,.77);backdrop-filter:blur(9px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
    .wayfinder a,.wayfinder button{min-height:42px;padding:8px 15px;border:1px solid rgba(255,225,168,.28);border-radius:999px;color:#fff0cf;background:rgba(43,66,47,.62);text-decoration:none;cursor:pointer;font:800 12px/1 system-ui,sans-serif;white-space:nowrap}
    .wayfinder a:hover,.wayfinder a:focus-visible,.wayfinder button:hover,.wayfinder button:focus-visible{outline:2px solid #f0c56f;outline-offset:2px;background:rgba(91,112,70,.82)}
    .toast{position:fixed;z-index:40;left:50%;bottom:82px;transform:translate(-50%,14px);max-width:min(620px,calc(100vw - 28px));padding:12px 17px;border:1px solid rgba(255,224,164,.5);border-radius:16px;color:#fff6df;background:rgba(3,15,13,.9);box-shadow:0 10px 35px rgba(0,0,0,.48);backdrop-filter:blur(9px);font:700 14px/1.35 system-ui,sans-serif;text-align:center;opacity:0;pointer-events:none;transition:.22s ease}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .token-found{animation:tokenFound .75s ease both}
    @keyframes tokenFound{35%{filter:brightness(1.6);box-shadow:0 0 34px rgba(255,210,93,.65)}100%{opacity:.12;transform:scale(.72)}}

    @media(max-width:720px){
      .title-plaque{top:max(7px,env(safe-area-inset-top));min-width:0;width:min(62vw,430px);padding:7px 12px}.title-plaque strong{font-size:15px}.title-plaque span{font-size:9px}
      .audio-toggle{top:max(7px,env(safe-area-inset-top));right:max(7px,env(safe-area-inset-right));min-height:36px;padding:7px 9px;font-size:10px}
      .wayfinder{bottom:max(7px,env(safe-area-inset-bottom));max-width:calc(100vw - 14px);gap:5px;padding:5px}.wayfinder a,.wayfinder button{min-height:38px;padding:7px 10px;font-size:10px}
      .toast{bottom:64px;font-size:13px}
    }
    @media(orientation:portrait) and (max-width:720px){
      .scene{width:calc(100svh * 1.7779);height:100svh}
      .wayfinder a,.wayfinder button{padding:7px 8px;font-size:9px}
    }
    @media(hover:none),(pointer:coarse){.hotspot::after{display:none}.hotspot:hover,.hotspot:focus,.hotspot:active{outline:0;background:transparent}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>

  <script>
    "use strict";
    const sceneShell=document.getElementById("sceneShell");
    const scene=document.getElementById("scene");
    const toast=document.getElementById("toast");
    const audioToggle=document.getElementById("audioToggle");
    let toastTimer=null,audioContext=null,rainSource=null,rainGain=null,crackleTimer=null,audioOn=false,fireHigh=false;
    let panX=0,maxPan=0,dragging=false,dragPointer=null,dragStartX=0,panStartX=0;

    function showToast(message,duration=2600){clearTimeout(toastTimer);toast.textContent=message;toast.classList.add("show");toastTimer=setTimeout(()=>toast.classList.remove("show"),duration)}
    function getAudio(){if(!audioContext)audioContext=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==="suspended")audioContext.resume();return audioContext}
    function tone(freq=440,duration=.1,type="sine",volume=.025){const a=getAudio(),o=a.createOscillator(),g=a.createGain(),now=a.currentTime;o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(volume,now);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(g);g.connect(a.destination);o.start(now);o.stop(now+duration)}

    function startRain(){if(rainSource)return;const a=getAudio(),length=a.sampleRate*2,buffer=a.createBuffer(1,length,a.sampleRate),data=buffer.getChannelData(0);let wash=0;for(let i=0;i<length;i++){const white=Math.random()*2-1;wash=wash*.986+white*.014;data[i]=white*.12+wash*2.8}rainSource=a.createBufferSource();rainGain=a.createGain();const low=a.createBiquadFilter(),high=a.createBiquadFilter();rainSource.buffer=buffer;rainSource.loop=true;low.type="lowpass";low.frequency.value=4300;high.type="highpass";high.frequency.value=140;rainGain.gain.value=.045;rainSource.connect(high);high.connect(low);low.connect(rainGain);rainGain.connect(a.destination);rainSource.start();crackleTimer=setInterval(()=>{if(audioOn&&Math.random()>.35){tone(80+Math.random()*120,.025+Math.random()*.035,"square",fireHigh?.014:.007)}},260)}
    function stopRain(){if(rainSource){try{rainSource.stop()}catch(error){}rainSource=null}if(crackleTimer){clearInterval(crackleTimer);crackleTimer=null}}
    function toggleAudio(){audioOn=!audioOn;audioToggle.setAttribute("aria-pressed",String(audioOn));audioToggle.textContent=audioOn?"☂ QUIET":"☂ LISTEN";if(audioOn){startRain();showToast("Rain on cedar, a small fire, and one raven withholding crucial information.")}else{stopRain();showToast("The clearing goes suspiciously quiet.")}}
    function tendFire(){fireHigh=!fireHigh;scene.classList.toggle("fire-high",fireHigh);if(audioOn)tone(fireHigh?190:120,.09,"triangle",.02);showToast(fireHigh?"The fire accepts your offering and becomes 14% more heroic.":"The fire settles back down. It was getting ideas.")}

    document.getElementById("firepit").addEventListener("click",tendFire);
    document.getElementById("fireButton").addEventListener("click",tendFire);
    audioToggle.addEventListener("click",toggleAudio);
    document.getElementById("raven").addEventListener("click",()=>{tone(180,.08,"sawtooth",.024);setTimeout(()=>tone(115,.15,"sawtooth",.02),80);try{const line=new SpeechSynthesisUtterance("goat");line.rate=.76;line.pitch=.58;line.volume=.9;speechSynthesis.cancel();speechSynthesis.speak(line)}catch(error){}showToast("The raven considers your question carefully and says: GOAT.")});
    document.getElementById("token").addEventListener("click",event=>{event.currentTarget.classList.add("token-found");try{localStorage.setItem("studioLadukeAdventureToken","found")}catch(error){}tone(523,.08,"triangle",.025);setTimeout(()=>tone(784,.12,"triangle",.025),90);showToast("ADVENTURE TOKEN FOUND: GOOD FOR ONE QUESTIONABLE DECISION.",3400)});

    function updatePanBounds(){maxPan=Math.max(0,(scene.offsetWidth-window.innerWidth)/2);panX=Math.max(-maxPan,Math.min(maxPan,panX));scene.style.setProperty("--pan-x",`${panX}px`);sceneShell.classList.toggle("pannable",maxPan>4)}
    function beginPan(event){if(maxPan<=4||event.target.closest("a,button"))return;dragging=true;dragPointer=event.pointerId;dragStartX=event.clientX;panStartX=panX;sceneShell.classList.add("dragging");sceneShell.setPointerCapture(event.pointerId)}
    function movePan(event){if(!dragging||event.pointerId!==dragPointer)return;panX=Math.max(-maxPan,Math.min(maxPan,panStartX+event.clientX-dragStartX));scene.style.setProperty("--pan-x",`${panX}px`)}
    function endPan(event){if(!dragging||(event&&event.pointerId!==dragPointer))return;dragging=false;dragPointer=null;sceneShell.classList.remove("dragging")}
    sceneShell.addEventListener("pointerdown",beginPan);
    sceneShell.addEventListener("pointermove",movePan);
    sceneShell.addEventListener("pointerup",endPan);
    sceneShell.addEventListener("pointercancel",endPan);
    sceneShell.addEventListener("lostpointercapture",()=>endPan());
    window.addEventListener("resize",updatePanBounds);

    for(let i=0;i<22;i++){const light=document.createElement("i");light.className="firefly";light.style.left=`${18+Math.random()*64}%`;light.style.top=`${18+Math.random()*56}%`;light.style.setProperty("--speed",`${2.2+Math.random()*4}s`);light.style.setProperty("--delay",`${-Math.random()*5}s`);light.style.setProperty("--dx",`${-18+Math.random()*36}px`);light.style.setProperty("--dy",`${-14+Math.random()*28}px`);scene.appendChild(light)}
    updatePanBounds();
    setTimeout(()=>showToast(maxPan>4?"Swipe to look around. Three paths. One raven with no useful information.":"Three paths. One greenhouse. One raven with no useful information.",3200),700);
    window.addEventListener("pagehide",stopRain);
  </script>
</body>
</html>
