name: House walk review
on:
  push:
    branches: [dev/house-guide-walk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium webkit
      - name: Test the round trip and capture the thresholds
        run: |
          mkdir -p walk-before
          git archive 2f7b7975ce4c016f1fec2aa20d961e1723df3182 house.html assets audio | tar -x -C walk-before
          python3 -m http.server 4173 --bind 127.0.0.1 &
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { mkdir } from 'node:fs/promises';
          import { chromium, webkit, devices } from 'playwright';

          await mkdir('walk-screenshots');
          for (const [label, engine, device] of [
            ['desktop', chromium, { viewport: { width: 1440, height: 900 } }],
            ['phone', chromium, devices['Pixel 7']],
            ['iphone-webkit', webkit, devices['iPhone 13']]
          ]) {
            const browser = await engine.launch();
            const mobile = label !== 'desktop';
            const swipe = label === 'phone';
            try {
              const context = await browser.newContext({
                ...device,
                ...(label === 'desktop' ? { recordVideo: { dir: 'walk-screenshots/video', size: { width: 1280, height: 800 } } } : {}),
                reducedMotion: mobile ? 'reduce' : 'no-preference'
              });
              const page = await context.newPage();
              page.setDefaultTimeout(8000);
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              const base = 'http://127.0.0.1:4173';
              if (label === 'desktop') {
                const before = await browser.newContext({ ...device, reducedMotion: 'reduce' });
                const prior = await before.newPage();
                const click = name => prior.getByRole('button', { name, exact: true }).click();
                const capture = name => prior.screenshot({ path: 'walk-screenshots/before-' + name + '.png' });
                await prior.goto(base + '/walk-before/house.html?room=foyer');
                await capture('01-front-hall-toward-main-hall');
                await click('Main Hall Opening');
                await capture('02-main-hall-up-main-stairs');
                await click('Main Stairs');
                await click('Turn around');
                await capture('03-upstairs-landing-down-main-stairs');
                await click('Main Stairs');
                await capture('04-main-hall-toward-front-hall');
                await before.close();
              }
              await page.goto(base + '/house.html?room=foyer');
              if (mobile) {
                await page.evaluate(() => {
                  window.walkInput = [];
                  for (const type of ['pointerdown', 'pointerup', 'pointercancel', 'click']) {
                    document.addEventListener(type, event => window.walkInput.push([
                      type, event.pointerType, event.target.closest('button')?.getAttribute('aria-label'),
                      event.clientX, event.clientY
                    ]), true);
                  }
                });
              }
              const button = name => page.getByRole('button', { name, exact: true });
              const shot = name => page.screenshot({
                path: 'walk-screenshots/' + (label + '-') + name + '.png'
              });
              const use = async target => {
                if (label !== 'iphone-webkit') return mobile ? target.tap() : target.click();
                // WebKit can stall while Playwright waits for stability on a transformed
                // portal. Hit-test the visible target and send a real touchscreen tap.
                await target.waitFor({state:'visible',timeout:16000});
                const point=await target.evaluate(el=>{
                  const box=el.getBoundingClientRect();
                  const left=Math.max(0,box.left),right=Math.min(innerWidth,box.right);
                  const top=Math.max(0,box.top),bottom=Math.min(innerHeight,box.bottom);
                  for(const fraction of [.50,.35,.65]){
                    const x=left+(right-left)*fraction,y=top+(bottom-top)*.5;
                    if(el.contains(document.elementFromPoint(x,y)))return {x,y};
                  }
                  return null;
                });
                assert.ok(point,'WebKit tap must hit its visible target');
                return page.touchscreen.tap(point.x,point.y);
              };
              const room = name => page.waitForFunction(
                name => document.querySelector('#floorName')?.textContent === name &&
                  !document.querySelector('#camera').hasAttribute('data-crossing'), name
              );
              const opening = 'Main Hall Opening';
              const stairs = 'Main Stairs';

              await room('Front Hall');
              await shot('01-front-hall-toward-main-hall');
              if (!mobile) {
                const rain = button('Rain sound');
                assert.equal(await rain.getAttribute('aria-pressed'), 'false');
                await use(rain);
                await page.waitForFunction(() => !document.querySelector('#walkRainAudio').paused);
              }
              if (swipe) {
                const box = await button(opening).boundingBox();
                assert.ok(box);
                const x = Math.round(box.x + box.width / 2);
                const y = Math.round(box.y + box.height * .4);
                assert.equal(await page.evaluate(({x, y}) =>
                  document.elementFromPoint(x, y).closest('button')?.getAttribute('aria-label'), {x, y}), opening);
                const before = await page.locator('#plate').evaluate(el => el.style.getPropertyValue('--pan'));
                const cdp = await context.newCDPSession(page);
                await cdp.send('Input.dispatchTouchEvent', { type: 'touchStart', touchPoints: [{ x, y }] });
                for (const offset of [15, 30, 45, 60]) {
                  await cdp.send('Input.dispatchTouchEvent', { type: 'touchMove', touchPoints: [{ x: x + offset, y }] });
                }
                await cdp.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });
                await cdp.detach();
                await page.evaluate(() => new Promise(resolve =>
                  requestAnimationFrame(() => requestAnimationFrame(resolve))));
                assert.equal(await page.locator('#floorName').textContent(), 'Front Hall');
                assert.notEqual(await page.locator('#plate').evaluate(el => el.style.getPropertyValue('--pan')), before);
              }
              try {
                await use(button(opening));
                await room('Main Hall');
              } catch (error) {
                if (mobile) console.log('Doorway input', await page.evaluate(() => window.walkInput));
                throw error;
              }
              const hallImage = page.locator('#painting img');
              assert.match(await hallImage.getAttribute('src'), /main-hall-cedar[.]webp$/);
              assert.equal(await hallImage.evaluate(async image => {
                await image.decode();
                return image.naturalWidth;
              }), 1600);
              if (!mobile) {
                assert.equal(await page.locator('#walkRainAudio').evaluate(audio => audio.paused), false);

              }
              await shot('02-main-hall-up-main-stairs');
              if (!mobile) {
                const model = await page.evaluate(() => {
                  const {stairs, stairCamera} = window.StudioHouseSpatial;
                  return [stairs.to, stairCamera(0,false), stairCamera(1,true), stairCamera(1,false)];
                });
                assert.deepEqual(model[0], [0,2.72,3.5]);
                assert.equal(model[1].z, model[2].z);
                assert.ok(model[3].y > model[1].y);
                await button(stairs).focus();
                await page.keyboard.press('Enter');
                await page.locator('#stairFlight').waitFor({state:'visible'});
                await page.keyboard.press('Escape');
                await room('Main Hall');
                assert.equal(await page.locator('#stairFlight').isVisible(), false);
              }
              await use(button(stairs));
              if (!mobile) {
                await page.locator('#stairFlight').waitFor({state:'visible'});
                await page.waitForFunction(() => Number(document.querySelector('#stairFlight').style.opacity) >= .95);
                await shot('06-mid-flight-ascending');
              }
              await room('Upstairs Landing');
              assert.equal(await page.locator('#provisionalView').isVisible(), true);
              assert.equal(await button(stairs).count(), 0);
              await use(button('Turn around'));
              await room('Upstairs Landing');
              await shot('03-upstairs-landing-down-main-stairs');
              await use(button('Open house floor plan'));
              const plan = page.locator('#walkPlan');
              assert.deepEqual(await plan.locator('.threshold-name').allTextContents(), [opening, stairs]);
              assert.equal(await plan.locator('[aria-current=location]').textContent(), 'Upstairs Landing');
              await shot('05-map-upstairs-landing');
              await use(button('Close map'));
              await use(button(stairs));
              if (!mobile) {
                await page.waitForFunction(() => Number(document.querySelector('#stairFlight').style.opacity) >= .95);
                await shot('07-mid-flight-descending');
              }
              await room('Main Hall');
              await shot('04-main-hall-toward-front-hall');
              await use(button(opening));
              await room('Front Hall');
              if (!mobile) {
                assert.equal(await page.locator('#walkRainAudio').evaluate(audio => audio.paused), false);
                assert.equal(await page.locator('#walkRainAudio').evaluate(audio => audio.currentTime > 0), true);
                await use(button('Rain sound'));
                await page.waitForFunction(() => document.querySelector('#walkRainAudio').paused);
                await button(opening).focus();
                await page.keyboard.press('Enter');
                await room('Main Hall');
                assert.equal(await page.evaluate(() => document.activeElement.id), 'floorName');
              }
              assert.deepEqual(errors, []);
              await page.goto(base + '/index.html');
              await use(button('Turn around'));
              await use(page.getByRole('link', { name: opening, exact: true }));
              await room('Main Hall');
              console.log(label + ' round trip passed' + (swipe ? ' with doorway-origin swipe' : ''));
              await context.close();
            } finally {
              await browser.close();
            }
          }
          const profileBrowser = await chromium.launch();
          try {
            const context = await profileBrowser.newContext(devices['Pixel 7']);
            const page = await context.newPage();
            const cdp = await context.newCDPSession(page);
            await cdp.send('Performance.enable');
            await cdp.send('Emulation.setCPUThrottlingRate', { rate: 4 });
            await page.goto('http://127.0.0.1:4173/house.html?room=foyer');
            await page.evaluate(() => {
              const frames = [];
              let previous = performance.now();
              window.walkProfile = { frames, running: true };
              function sample(now) {
                if (!window.walkProfile.running) return;
                frames.push(now - previous);
                previous = now;
                requestAnimationFrame(sample);
              }
              requestAnimationFrame(sample);
            });
            const beforeHeap = (await cdp.send('Performance.getMetrics')).metrics.find(m => m.name === 'JSHeapUsedSize').value;
            const start = await page.getByRole('button', { name: 'Main Hall Opening', exact: true }).boundingBox();
            const x = Math.round(start.x + start.width / 2);
            const y = Math.round(start.y + start.height / 2);
            await cdp.send('Input.dispatchTouchEvent', { type: 'touchStart', touchPoints: [{x, y}] });
            for (const offset of [12, 24, 36, 48, 60, 72, 84]) {
              await cdp.send('Input.dispatchTouchEvent', { type: 'touchMove', touchPoints: [{x: x + offset, y}] });
            }
            await cdp.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });
            assert.equal(await page.locator('#floorName').textContent(), 'Front Hall');
            for (let lap = 0; lap < 3; lap++) for (const [control, room, facing] of [
              ['Main Hall Opening', 'Main Hall'], ['Main Stairs', 'Upstairs Landing'],
              ['Turn around', 'Upstairs Landing', true], ['Main Stairs', 'Main Hall'],
              ['Main Hall Opening', 'Front Hall']
            ]) {
              await page.getByRole('button', { name: control, exact: true }).tap();
              await page.waitForFunction(({room, facing}) => document.querySelector('#floorName').textContent === room &&
                !document.querySelector('#camera').hasAttribute('data-crossing') &&
                (!facing || document.querySelector('#turnWalk').getAttribute('aria-pressed') === 'true'), {room, facing});
            }
            const profile = await page.evaluate(() => {
              const {frames} = window.walkProfile;
              window.walkProfile.running = false;
              const intervals = frames.slice(1).sort((a, b) => a - b);
              return {
                samples: intervals.length,
                medianMs: Math.round(intervals[Math.floor(intervals.length / 2)] * 10) / 10,
                p95Ms: Math.round(intervals[Math.floor(intervals.length * .95)] * 10) / 10,
                intervalsOver50Ms: intervals.filter(ms => ms > 50).length,
                sameOriginEncodedBytes: performance.getEntriesByType('resource').filter(entry =>
                  entry.name.startsWith(location.origin)).reduce((total, entry) => total + entry.encodedBodySize, 0)
              };
            });
            profile.heapBeforeBytes = beforeHeap;
            profile.heapAfterBytes = (await cdp.send('Performance.getMetrics')).metrics.find(m => m.name === 'JSHeapUsedSize').value;
            assert.equal(await page.locator('#stairFlight').count(), 1);
            assert.equal(await page.locator('#stairFlight').isVisible(), false);
            console.log('Mobile walk profile (Chromium, Pixel 7 viewport, 4x CPU throttle): ' + JSON.stringify(profile));
            await (await import('node:fs/promises')).writeFile('walk-screenshots/mobile-profile.json', JSON.stringify(profile, null, 2));
          } finally {
            await profileBrowser.close();
          }
          JS
          cat > walk-screenshots/index.html <<'HTML'
          <!doctype html><html lang="en"><meta charset="utf-8"><title>Studio LaDuke threshold review</title>
          <style>
          body{font:16px system-ui;background:#211b17;color:#fff3de;margin:24px}
          section{display:grid;grid-template-columns:3fr 3fr 1fr 1fr;gap:14px;align-items:start}
          h2{grid-column:1/-1}figure{margin:0}img{display:block;width:100%;height:auto}figcaption{margin:6px 0 20px}
          </style>
          <h1>Studio LaDuke threshold review</h1>
          <section id="walk"></section>
          <script>
          for (const [file, title] of [
            ['01-front-hall-toward-main-hall', 'Main Hall Opening from Front Hall'],
            ['04-main-hall-toward-front-hall', 'Main Hall Opening from Main Hall'],
            ['02-main-hall-up-main-stairs', 'Main Stairs from Main Hall'],
            ['03-upstairs-landing-down-main-stairs', 'Main Stairs from Upstairs Landing'],
            ['05-map-upstairs-landing', 'House map on Upstairs Landing']
          ]) {
            document.querySelector('#walk').insertAdjacentHTML('beforeend',
              '<h2>' + title + '</h2>' + (file.startsWith('05') ? ['desktop', 'phone', 'iphone-webkit'] : ['before', 'desktop', 'phone', 'iphone-webkit']).map(device =>
                '<figure><img src="' + device + '-' + file + '.png" alt="' + title +
                ' on ' + device + '"><figcaption>' + device + '</figcaption></figure>').join(''));
          }
          </script></html>
          HTML
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: house-walk-thresholds
          path: walk-screenshots/
