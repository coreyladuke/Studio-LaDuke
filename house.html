function showMap(){if(crossing)return;id("shade").hidden=false;id("map").hidden=false;id("closeMap").focus();}
function hideMap(focus){id("shade").hidden=true;id("map").hidden=true;if(focus!==false)id("mapOpen").focus();}
function detail(title,copy,to){detailFocus=document.activeElement;id("dialogTitle").textContent=title;id("dialogText").textContent=copy;id("dialogButtons").replaceChildren();id("codeForm").hidden=true;if(to){let b=document.createElement("button");b.type="button";b.textContent=/\.html/.test(to)?"Visit this part of Studio LaDuke":"Go there";b.addEventListener("click",function(){go(to);});id("dialogButtons").append(b);}id("dialogShade").hidden=false;id("dialog").hidden=false;id("closeDialog").focus();}
function hideDetail(focus){id("dialogShade").hidden=true;id("dialog").hidden=true;if(focus!==false&&detailFocus&&detailFocus.focus)detailFocus.focus();}
function code(){detail("The hidden cinema","Find the three clues to open the secret passage into five movie-inspired puzzle rooms.");id("codeForm").hidden=false;id("codeInput").value="";id("codeInput").focus();}
id("codeForm").addEventListener("submit",function(e){e.preventDefault();if(id("codeInput").value.trim()==="472"){try{sessionStorage.setItem("laduke-escape-done","1");}catch(e){}if(window.StudioHouseAdventure)window.StudioHouseAdventure.collect("escape","solved");hideDetail(false);location.href="movie-escape.html";}else{id("codeInput").value="";toast("The lock refuses to open.");id("codeInput").focus();}});
id("mapOpen").addEventListener("click",showMap);id("closeMap").addEventListener("click",function(){hideMap(true);});id("shade").addEventListener("click",function(){hideMap(true);});
id("closeDialog").addEventListener("click",function(){hideDetail(true);});id("dialogShade").addEventListener("click",function(){hideDetail(true);});
id("turnWalk").addEventListener("click",function(){
 if(crossing)return;
 moveCamera(()=>{
  saveView();
  facing=facing==="forward"?"reverse":"forward";
  history.replaceState({room:here,facing},"",location.href);
  draw();
 },"50% 52%",0);
});
id("left").addEventListener("click",function(){setPan(pan+Math.max(180,innerWidth*.66));});id("right").addEventListener("click",function(){setPan(pan-Math.max(180,innerWidth*.66));});
let activatedTouchDoor=false;
camera.addEventListener("pointerdown",function(e){
 if(crossing||!e.isPrimary||e.button!==0||!id("dialog").hidden||!id("map").hidden)return;
 activatedTouchDoor=false;suppress=false;stopPan();panTarget=pan;
 drag={x:e.clientX,y:e.clientY,p:pan,m:false,lastX:e.clientX,lastT:performance.now(),velocity:0,pointerId:e.pointerId,
  door:e.pointerType==="touch"?e.target.closest(".door"):null};
});
camera.addEventListener("pointermove",function(e){
 if(!drag||e.pointerId!==drag.pointerId)return;
 const dx=e.clientX-drag.x,now=performance.now(),dt=Math.max(8,now-drag.lastT);
 if(drag.m||Math.hypot(dx,e.clientY-drag.y)>9){
  if(!drag.m){drag.m=true;try{camera.setPointerCapture(e.pointerId);}catch(error){}}
  camera.classList.add("dragging");
  drag.velocity=Math.max(-2.6,Math.min(2.6,(e.clientX-drag.lastX)/dt));
  drag.lastX=e.clientX;drag.lastT=now;
  panTarget=clampPan(drag.p+dx);
  if(!panFrame)panFrame=requestAnimationFrame(()=>{
   panFrame=0;
   pan=panTarget;
   paintPan();
  });
 }
});
function finish(e){
 if(!drag||e.pointerId!==drag.pointerId)return;
 const wasDragging=drag.m||Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>9,speed=e.type==="pointerup"&&performance.now()-drag.lastT<90?drag.velocity:0;
 const tapDoor=e.type==="pointerup"&&!wasDragging&&drag.door===e.target.closest(".door")?drag.door:null;
 if(drag.m)setPan(panTarget,true);
 suppress=wasDragging;drag=null;camera.classList.remove("dragging");
 if(tapDoor){activatedTouchDoor=true;tapDoor.click();}
 if(wasDragging&&!reduceMotion.matches&&Math.abs(speed)>.18)setPan(pan+speed*115);
}
camera.addEventListener("pointerup",finish);camera.addEventListener("pointercancel",finish);camera.addEventListener("lostpointercapture",finish);window.addEventListener("pointerup",finish);
camera.addEventListener("click",function(e){
 // WebKit can emit a mouse compatibility click against the destination DOM
 // after a touch release has already crossed the opening.
 if(e.detail>0&&(suppress||activatedTouchDoor)){
  activatedTouchDoor=false;suppress=false;e.preventDefault();e.stopImmediatePropagation();
 }
},true);
window.addEventListener("resize",resize);
window.addEventListener("popstate",function(event){clearCrossing();saveView();facing=event.state?.facing==="reverse"?"reverse":"forward";let q=new URLSearchParams(location.search).get("room");here=R[q]&&(q!=="vault"||sessionStorage.getItem("laduke-movie-gauntlet-done")==="1")?q:"escape";draw();});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if(crossing){clearCrossing();return;}if(!id("dialog").hidden)hideDetail(true);else if(!id("map").hidden)hideMap(true);return;}if(!id("dialog").hidden||!id("map").hidden||(window.StudioHouseAdventure&&window.StudioHouseAdventure.isOpen))return;if(crossing)return;if(e.key==="ArrowLeft"){e.preventDefault();setPan(pan+180);}if(e.key==="ArrowRight"){e.preventDefault();setPan(pan-180);}if(e.key.toLowerCase()==="m"&&!e.metaKey&&!e.ctrlKey)showMap();});
facing=history.state?.facing==="reverse"?"reverse":"forward";
const initial=new URLSearchParams(location.search).get("room");here=R[initial]&&(initial!=="vault"||sessionStorage.getItem("laduke-movie-gauntlet-done")==="1")?initial:"escape";if(!R[initial]||here!==initial)history.replaceState({room:here},"","house.html?room="+here);draw();
try{if(!sessionStorage.getItem("laduke-house-seen")){sessionStorage.setItem("laduke-house-seen","1");}}catch(e){}
})();
