<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >

  <title>Mortal KomPlant</title>

  <style>
    :root {
      --gold: #e4b554;
      --cream: #f2dfb2;
      --green: #78b83d;
      --red: #cc382d;
      --dark: #050806;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020302;
      color: white;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      user-select: none;
      touch-action: manipulation;
    }

    button {
      font: inherit;
    }

    .game {
      position: fixed;
      inset: 0;
      overflow: hidden;

      background:
        radial-gradient(
          ellipse at 50% 78%,
          rgba(74, 105, 36, 0.35),
          transparent 42%
        ),
        linear-gradient(
          to bottom,
          #10160f 0%,
          #070a07 52%,
          #15100c 100%
        );

      isolation: isolate;
    }

    /* ARCADE BACKGROUND */

    .arcade-backdrop {
      position: absolute;
      inset: 0;
      z-index: -5;
      opacity: 0.5;

      background:
        radial-gradient(circle at 8% 30%, #256cff 0 3px, transparent 5px),
        radial-gradient(circle at 19% 48%, #ff2f88 0 3px, transparent 5px),
        radial-gradient(circle at 32% 27%, #66d33c 0 3px, transparent 5px),
        radial-gradient(circle at 68% 29%, #f3cb38 0 3px, transparent 5px),
        radial-gradient(circle at 82% 47%, #9a45ff 0 3px, transparent 5px),
        radial-gradient(circle at 94% 31%, #19dec3 0 3px, transparent 5px),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.025) 0,
          rgba(255,255,255,0.025) 2px,
          transparent 2px,
          transparent 90px
        );
    }

    .floor {
      position: absolute;
      left: -20%;
      right: -20%;
      bottom: -31%;
      height: 63%;
      z-index: -3;

      transform: perspective(520px) rotateX(62deg);
      transform-origin: center top;

      background:
        repeating-linear-gradient(
          90deg,
          transparent 0 56px,
          rgba(106, 193, 51, 0.22) 57px 59px
        ),
        repeating-linear-gradient(
          0deg,
          transparent 0 56px,
          rgba(106, 193, 51, 0.22) 57px 59px
        ),
        #071009;

      border-top: 2px solid rgba(128, 191, 65, 0.35);
    }

    .neon {
      position: absolute;
      top: 25%;
      left: 50%;
      z-index: -2;

      transform: translateX(-50%);

      color: #ff4536;
      font-size: clamp(1.2rem, 6vw, 3.4rem);
      letter-spacing: 0.08em;
      white-space: nowrap;

      opacity: 0.63;

      text-shadow:
        0 0 6px #ff3e31,
        0 0 18px #ff3e31,
        0 0 35px rgba(255, 62, 49, 0.6);
    }

    /* HUD */

    .hud {
      position: absolute;
      left: 3%;
      right: 3%;
      top: 3%;
      z-index: 15;

      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: start;
    }

    .hud-side.enemy {
      text-align: right;
    }

    .name {
      margin-bottom: 3px;
      color: var(--cream);
      font-size: clamp(0.75rem, 3.3vw, 1.3rem);
      letter-spacing: 0.07em;
      text-shadow: 2px 2px 0 black;
    }

    .health-shell {
      position: relative;
      height: clamp(17px, 3.5vw, 25px);

      overflow: hidden;

      background: #310b09;
      border: 2px solid #0b0b09;

      box-shadow:
        0 0 0 1px rgba(228, 181, 84, 0.75),
        inset 0 2px 4px rgba(0,0,0,0.8);
    }

    .health {
      width: 100%;
      height: 100%;

      transition: width 320ms ease;

      background:
        linear-gradient(
          to bottom,
          #a8ea5b,
          #5b9e2c 55%,
          #2f5915
        );
    }

    .enemy .health {
      margin-left: auto;

      background:
        linear-gradient(
          to bottom,
          #f26452,
          #bb2e28 55%,
          #691715
        );
    }

    .health-number {
      position: absolute;
      inset: 0;

      display: grid;
      place-items: center;

      font-family: Arial, sans-serif;
      font-size: clamp(0.55rem, 2vw, 0.75rem);
      font-weight: 900;

      text-shadow: 1px 1px 2px black;
    }

    .power-shell {
      height: 7px;
      margin-top: 4px;

      overflow: hidden;

      background: #141819;
      border: 1px solid rgba(228,181,84,0.65);
    }

    .power {
      width: 0;
      height: 100%;

      transition: width 250ms ease;

      background: linear-gradient(90deg, #1985ff, #69efff);
    }

    .enemy .power {
      margin-left: auto;
      background: linear-gradient(90deg, #ff7b28, #ffe05a);
    }

    .center-hud {
      min-width: 50px;
      text-align: center;
    }

    .timer {
      color: var(--gold);
      font-size: clamp(1.6rem, 7vw, 3rem);
      line-height: 0.9;

      text-shadow:
        2px 2px 0 #000,
        0 0 10px rgba(228,181,84,0.42);
    }

    .round-text {
      margin-top: 5px;
      color: #d7bd81;
      font-size: clamp(0.55rem, 2.2vw, 0.75rem);
      letter-spacing: 0.05em;
    }

    .round-dots {
      display: flex;
      gap: 5px;
      margin-top: 5px;
    }

    .enemy .round-dots {
      justify-content: flex-end;
    }

    .round-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;
      border: 1px solid var(--gold);
      background: #171717;
    }

    .round-dot.won {
      background: var(--gold);
      box-shadow: 0 0 8px rgba(228,181,84,0.8);
    }

    /* FIGHTERS */

    .fight-stage {
      position: absolute;
      left: 0;
      right: 0;
      top: 16%;
      bottom: 22%;

      display: flex;
      align-items: end;
      justify-content: space-between;

      padding: 0 3% 1%;
    }

    .fighter {
      position: relative;

      width: 48%;
      height: 92%;

      overflow: hidden;

      transform-origin: center bottom;

      filter:
        drop-shadow(0 14px 12px rgba(0,0,0,0.75))
        saturate(1.08)
        contrast(1.05);

      transition:
        transform 120ms ease,
        filter 100ms ease;
    }

    /*
      Both fighters come from the same uploaded image.

      The original image contains Bob on the left
      and Flytrap on the right.
    */

    .fighter-image {
      position: absolute;
      inset: 0;

      background-image:
        url("2E040EFB-EE2C-49A3-81D1-3A72CDFD3608.png");

      background-repeat: no-repeat;
      background-size: 200% 100%;
    }

    .bob .fighter-image {
      background-position: left center;
    }

    .flytrap .fighter-image {
      background-position: right center;
    }

    /*
      This darkens the original background around each
      character so it blends into the game stage.
    */

    .fighter::after {
      content: "";
      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          rgba(5,8,5,0.03),
          rgba(5,8,5,0.08) 58%,
          rgba(5,8,5,0.56) 100%
        );

      mix-blend-mode: multiply;
    }

    .fighter.bob {
      animation: bobIdle 1.8s ease-in-out infinite;
    }

    .fighter.flytrap {
      animation: flyIdle 1.45s ease-in-out infinite;
    }

    @keyframes bobIdle {
      0%, 100% {
        transform: translateY(0) rotate(-0.6deg);
      }

      50% {
        transform: translateY(-5px) rotate(0.6deg);
      }
    }

    @keyframes flyIdle {
      0%, 100% {
        transform: translateY(0) rotate(1deg);
      }

      50% {
        transform: translateY(-7px) rotate(-1deg);
      }
    }

    .fighter.attack-left {
      animation: attackLeft 300ms ease;
    }

    .fighter.attack-right {
      animation: attackRight 300ms ease;
    }

    @keyframes attackLeft {
      0%, 100% {
        transform: translateX(0) scale(1);
      }

      48% {
        transform: translateX(55px) scale(1.06);
      }
    }

    @keyframes attackRight {
      0%, 100% {
        transform: translateX(0) scale(1);
      }

      48% {
        transform: translateX(-55px) scale(1.06);
      }
    }

    .fighter.hit {
      animation: hitShake 300ms ease;
      filter:
        brightness(2.2)
        saturate(0.3)
        drop-shadow(0 0 20px #ffdf69);
    }

    @keyframes hitShake {
      0%, 100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-15px) rotate(-3deg);
      }

      45% {
        transform: translateX(13px) rotate(2deg);
      }

      70% {
        transform: translateX(-7px);
      }
    }

    .fighter.blocking {
      filter:
        drop-shadow(0 0 24px rgba(70, 180, 255, 0.95))
        brightness(1.1);

      transform: scale(0.94);
    }

    .fighter.defeated {
      animation: fall 700ms ease forwards;
    }

    @keyframes fall {
      to {
        transform:
          translateY(65px)
          rotate(75deg)
          scale(0.85);

        filter:
          grayscale(0.7)
          brightness(0.42);
      }
    }

    /* TEXT AND EFFECTS */

    .announcement {
      position: absolute;
      left: 50%;
      top: 45%;
      z-index: 40;

      width: 94%;

      transform:
        translate(-50%, -50%)
        scale(0.5);

      opacity: 0;

      color: #f0ca60;
      text-align: center;
      font-size: clamp(2.2rem, 14vw, 6rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;

      pointer-events: none;

      text-shadow:
        5px 5px 0 #56110d,
        -2px -2px 0 black,
        0 0 24px rgba(255,64,32,0.76);
    }

    .announcement.show {
      animation: announcement 1150ms ease forwards;
    }

    @keyframes announcement {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(2);
      }

      18% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.85);
      }

      72% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.08);
      }
    }

    .combat-message {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 22%;
      z-index: 20;

      min-height: 1.2em;

      color: #f6e8c7;
      text-align: center;
      font-family: Arial, sans-serif;
      font-weight: 900;
      font-size: clamp(0.7rem, 2.7vw, 0.95rem);

      text-shadow: 2px 2px 3px black;
    }

    .impact {
      position: absolute;
      z-index: 45;

      width: 18px;
      height: 18px;

      border-radius: 50%;

      background: #fff1a0;

      box-shadow:
        0 0 14px #ffbe27,
        0 0 34px #ff3b20;

      animation: impact 500ms ease forwards;
    }

    @keyframes impact {
      from {
        opacity: 1;
        transform: scale(0.4);
      }

      to {
        opacity: 0;
        transform: scale(8);
      }
    }

    .damage {
      position: absolute;
      z-index: 46;

      color: #ffe15c;
      font-size: clamp(1.2rem, 6vw, 2.5rem);

      pointer-events: none;

      text-shadow:
        3px 3px 0 #79170d,
        0 0 8px black;

      animation: damageFloat 700ms ease forwards;
    }

    @keyframes damageFloat {
      from {
        opacity: 1;
        transform: translateY(0) scale(0.7);
      }

      to {
        opacity: 0;
        transform: translateY(-75px) scale(1.2);
      }
    }

    .screen-shake {
      animation: screenShake 320ms ease;
    }

    @keyframes screenShake {
      0%, 100% {
        transform: translate(0);
      }

      20% {
        transform: translate(-5px, 3px);
      }

      40% {
        transform: translate(7px, -3px);
      }

      60% {
        transform: translate(-4px, 2px);
      }

      80% {
        transform: translate(3px, -2px);
      }
    }

    /* CONTROLS */

    .controls {
      position: absolute;
      left: 2%;
      right: 2%;
      bottom: 2%;
      z-index: 30;

      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .move {
      min-height: clamp(48px, 11vw, 72px);
      padding: 5px 3px;

      color: white;

      border: 2px solid #070807;
      border-radius: 7px;

      background: linear-gradient(#384d22, #18220f);

      box-shadow:
        0 0 0 1px rgba(156,196,80,0.56),
        inset 0 4px 7px rgba(255,255,255,0.05),
        0 4px 8px rgba(0,0,0,0.38);

      font-size: clamp(0.62rem, 2.7vw, 0.94rem);
      letter-spacing: 0.025em;
      text-transform: uppercase;
    }

    .move:nth-child(2) {
      background: linear-gradient(#54331d, #26160e);

      box-shadow:
        0 0 0 1px rgba(211,139,74,0.6),
        inset 0 4px 7px rgba(255,255,255,0.05),
        0 4px 8px rgba(0,0,0,0.38);
    }

    .move:nth-child(3) {
      background: linear-gradient(#294452, #111d24);

      box-shadow:
        0 0 0 1px rgba(85,177,220,0.61),
        inset 0 4px 7px rgba(255,255,255,0.05),
        0 4px 8px rgba(0,0,0,0.38);
    }

    .move:nth-child(4) {
      background: linear-gradient(#514733, #252016);

      box-shadow:
        0 0 0 1px rgba(217,191,121,0.59),
        inset 0 4px 7px rgba(255,255,255,0.05),
        0 4px 8px rgba(0,0,0,0.38);
    }

    .move:active:not(:disabled) {
      transform: translateY(2px) scale(0.96);
      filter: brightness(1.25);
    }

    .move:disabled {
      opacity: 0.33;
    }

    .small {
      display: block;
      margin-top: 3px;

      color: rgba(255,255,255,0.58);
      font-family: Arial, sans-serif;
      font-size: clamp(0.45rem, 1.7vw, 0.58rem);
      text-transform: none;
    }

    .special-row {
      position: absolute;
      left: 2%;
      right: 2%;
      bottom: calc(2% + clamp(55px, 12vw, 80px));
      z-index: 31;

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .special,
    .restart {
      min-height: 43px;

      border-radius: 6px;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .special {
      color: #211204;
      background: linear-gradient(#ffd85c, #ac6515);
      border: 2px solid #4b2808;
    }

    .special:disabled {
      opacity: 0.28;
      filter: grayscale(0.8);
    }

    .restart {
      display: none;

      color: var(--cream);
      background: #281714;
      border: 1px solid rgba(228,181,84,0.7);
    }

    .restart.show {
      display: block;
    }

    /* START SCREEN */

    .start-screen {
      position: absolute;
      inset: 0;
      z-index: 100;

      display: grid;
      place-items: center;

      padding: 18px;

      background:
        radial-gradient(
          circle at center,
          rgba(59,100,28,0.25),
          transparent 45%
        ),
        rgba(1,3,1,0.96);
    }

    .start-screen.hidden {
      display: none;
    }

    .start-card {
      width: min(92%, 550px);
      text-align: center;
    }

    .title {
      color: #72b13b;
      font-size: clamp(2.5rem, 14vw, 6rem);
      line-height: 0.82;
      letter-spacing: 0.02em;

      text-shadow:
        4px 4px 0 #3f160d,
        0 0 18px rgba(113,177,59,0.45);
    }

    .title span {
      color: #e2b754;
    }

    .subtitle {
      margin-top: 14px;

      color: #d24531;
      font-size: clamp(1.2rem, 6vw, 2.5rem);
      letter-spacing: 0.08em;
    }

    .insert {
      margin-top: 35px;

      color: #f1dfaa;
      font-family: Arial, sans-serif;
      font-weight: 900;
      font-size: clamp(0.9rem, 4vw, 1.2rem);

      animation: blink 1s steps(2) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0.25;
      }
    }

    .start-button {
      margin-top: 20px;
      min-height: 54px;
      padding: 12px 30px;

      color: #1e1104;
      background: linear-gradient(#ffd762, #a96115);

      border: 2px solid #4f2908;
      border-radius: 7px;

      font-size: 1.1rem;
      letter-spacing: 0.06em;
    }

    /* CRT EFFECT */

    .scanlines {
      position: absolute;
      inset: 0;
      z-index: 90;

      pointer-events: none;

      opacity: 0.14;

      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.18) 0,
          rgba(255,255,255,0.18) 1px,
          transparent 1px,
          transparent 4px
        );
    }

    .glass {
      position: absolute;
      inset: 0;
      z-index: 91;

      pointer-events: none;

      background:
        linear-gradient(
          115deg,
          rgba(255,255,255,0.07),
          transparent 22%,
          transparent 70%,
          rgba(255,255,255,0.025)
        );

      box-shadow:
        inset 0 0 35px rgba(0,0,0,0.9);
    }

    @media (max-height: 600px) and (orientation: landscape) {
      .fight-stage {
        top: 13%;
        bottom: 19%;
      }

      .controls {
        grid-template-columns: repeat(4, 1fr);
      }

      .special-row {
        bottom: 14%;
      }
    }
  </style>
</head>

<body>

  <main class="game" id="game">

    <div class="arcade-backdrop"></div>
    <div class="floor"></div>
    <div class="neon">McBride’s</div>

    <section class="hud">

      <div class="hud-side">

        <div class="name">BOB</div>

        <div class="health-shell">
          <div class="health" id="bobHealth"></div>
          <div class="health-number" id="bobNumber">100</div>
        </div>

        <div class="power-shell">
          <div class="power" id="bobPower"></div>
        </div>

        <div class="round-dots">
          <span class="round-dot" id="bobDot1"></span>
          <span class="round-dot" id="bobDot2"></span>
        </div>

      </div>

      <div class="center-hud">
        <div class="timer" id="timer">60</div>

        <div class="round-text">
          ROUND <span id="roundNumber">1</span>
        </div>
      </div>

      <div class="hud-side enemy">

        <div class="name">FLYTRAP</div>

        <div class="health-shell">
          <div class="health" id="flyHealth"></div>
          <div class="health-number" id="flyNumber">100</div>
        </div>

        <div class="power-shell">
          <div class="power" id="flyPower"></div>
        </div>

        <div class="round-dots">
          <span class="round-dot" id="flyDot1"></span>
          <span class="round-dot" id="flyDot2"></span>
        </div>

      </div>

    </section>

    <section class="fight-stage">

      <div class="fighter bob" id="bob">
        <div class="fighter-image"></div>
      </div>

      <div class="fighter flytrap" id="flytrap">
        <div class="fighter-image"></div>
      </div>

    </section>

    <div class="announcement" id="announcement">
      FIGHT!
    </div>

    <div class="combat-message" id="message">
      Bob’s turn.
    </div>

    <div class="special-row">

      <button
        class="special"
        id="specialButton"
        disabled
      >
        Kintsugi Crush
      </button>

      <button
        class="restart"
        id="restartButton"
      >
        Fight Again
      </button>

    </div>

    <section class="controls">

      <button class="move" data-move="pot">
        Pot Shot
        <span class="small">Fast strike</span>
      </button>

      <button class="move" data-move="leaf">
        Leaf Slap
        <span class="small">Heavy damage</span>
      </button>

      <button class="move" data-move="root">
        Root Problem
        <span class="small">Builds power</span>
      </button>

      <button class="move" data-move="block">
        Block
        <span class="small">Reduce damage</span>
      </button>

    </section>

    <section class="start-screen" id="startScreen">

      <div class="start-card">

        <div class="title">
          <span>MORTAL</span><br>
          KOMPLANT
        </div>

        <div class="subtitle">
          GARDEN BRAWL
        </div>

        <div class="insert">
          INSERT COIN
        </div>

        <button class="start-button" id="startButton">
          PRESS START
        </button>

      </div>

    </section>

    <div class="scanlines"></div>
    <div class="glass"></div>

  </main>

  <script>
    "use strict";

    const game = document.getElementById("game");

    const bob = document.getElementById("bob");
    const flytrap = document.getElementById("flytrap");

    const bobHealthBar = document.getElementById("bobHealth");
    const flyHealthBar = document.getElementById("flyHealth");

    const bobNumber = document.getElementById("bobNumber");
    const flyNumber = document.getElementById("flyNumber");

    const bobPowerBar = document.getElementById("bobPower");
    const flyPowerBar = document.getElementById("flyPower");

    const timerDisplay = document.getElementById("timer");
    const roundDisplay = document.getElementById("roundNumber");

    const announcement = document.getElementById("announcement");
    const message = document.getElementById("message");

    const moveButtons = Array.from(
      document.querySelectorAll(".move")
    );

    const specialButton =
      document.getElementById("specialButton");

    const restartButton =
      document.getElementById("restartButton");

    const startScreen =
      document.getElementById("startScreen");

    const startButton =
      document.getElementById("startButton");

    const bobDots = [
      document.getElementById("bobDot1"),
      document.getElementById("bobDot2")
    ];

    const flyDots = [
      document.getElementById("flyDot1"),
      document.getElementById("flyDot2")
    ];

    const moves = {
      pot: {
        name: "Pot Shot",
        min: 7,
        max: 12,
        accuracy: 0.94,
        power: 11,
        text: "Bob launches a handful of soil."
      },

      leaf: {
        name: "Leaf Slap",
        min: 11,
        max: 18,
        accuracy: 0.79,
        power: 8,
        text: "Bob delivers photosynthetic disrespect."
      },

      root: {
        name: "Root of the Problem",
        min: 8,
        max: 15,
        accuracy: 0.84,
        power: 20,
        text: "Roots burst through the arcade floor."
      }
    };

    const enemyMoves = [
      {
        name: "Snap Attack",
        min: 7,
        max: 13,
        accuracy: 0.9,
        power: 9
      },
      {
        name: "Acid Spit",
        min: 10,
        max: 17,
        accuracy: 0.78,
        power: 12
      },
      {
        name: "Chomp Chomp",
        min: 12,
        max: 20,
        accuracy: 0.7,
        power: 8
      }
    ];

    let bobHealth = 100;
    let flyHealth = 100;

    let bobPower = 0;
    let flyPower = 0;

    let bobRounds = 0;
    let flyRounds = 0;

    let currentRound = 1;
    let time = 60;

    let timerInterval = null;

    let active = false;
    let locked = true;
    let bobBlocking = false;

    let audioContext = null;

    function random(min, max) {
      return Math.floor(
        Math.random() * (max - min + 1)
      ) + min;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function getAudio() {
      if (!audioContext) {
        const Audio =
          window.AudioContext ||
          window.webkitAudioContext;

        if (Audio) {
          audioContext = new Audio();
        }
      }

      if (
        audioContext &&
        audioContext.state === "suspended"
      ) {
        audioContext.resume().catch(() => {});
      }

      return audioContext;
    }

    function tone(
      frequency,
      duration = 0.08,
      type = "square",
      volume = 0.05,
      endFrequency = null
    ) {
      const context = getAudio();

      if (!context) {
        return;
      }

      const oscillator = context.createOscillator();
      const gain = context.createGain();

      oscillator.type = type;

      oscillator.frequency.setValueAtTime(
        frequency,
        context.currentTime
      );

      if (endFrequency) {
        oscillator.frequency.exponentialRampToValueAtTime(
          endFrequency,
          context.currentTime + duration
        );
      }

      gain.gain.setValueAtTime(
        volume,
        context.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        context.currentTime + duration
      );

      oscillator.connect(gain);
      gain.connect(context.destination);

      oscillator.start();
      oscillator.stop(
        context.currentTime + duration
      );
    }

    function hitSound() {
      tone(105, 0.09, "sawtooth", 0.055, 42);

      setTimeout(() => {
        tone(38, 0.11, "square", 0.035);
      }, 25);
    }

    function missSound() {
      tone(220, 0.1, "triangle", 0.03, 90);
    }

    function blockSound() {
      tone(390, 0.08, "triangle", 0.05, 145);
    }

    function vibrate(pattern) {
      if ("vibrate" in navigator) {
        navigator.vibrate(pattern);
      }
    }

    function announce(text) {
      announcement.textContent = text;

      announcement.classList.remove("show");

      void announcement.offsetWidth;

      announcement.classList.add("show");
    }

    function setMessage(text) {
      message.textContent = text;
    }

    function update() {
      bobHealth = clamp(bobHealth, 0, 100);
      flyHealth = clamp(flyHealth, 0, 100);

      bobPower = clamp(bobPower, 0, 100);
      flyPower = clamp(flyPower, 0, 100);

      bobHealthBar.style.width = bobHealth + "%";
      flyHealthBar.style.width = flyHealth + "%";

      bobPowerBar.style.width = bobPower + "%";
      flyPowerBar.style.width = flyPower + "%";

      bobNumber.textContent = bobHealth;
      flyNumber.textContent = flyHealth;

      timerDisplay.textContent = time;
      roundDisplay.textContent = currentRound;

      bobDots.forEach((dot, index) => {
        dot.classList.toggle(
          "won",
          index < bobRounds
        );
      });

      flyDots.forEach((dot, index) => {
        dot.classList.toggle(
          "won",
          index < flyRounds
        );
      });

      const controlsEnabled =
        active &&
        !locked &&
        bobHealth > 0 &&
        flyHealth > 0;

      moveButtons.forEach((button) => {
        button.disabled = !controlsEnabled;
      });

      specialButton.disabled =
        !controlsEnabled ||
        bobPower < 100 ||
        flyHealth > 25;
    }

    function impact(target, damage) {
      const gameRect = game.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();

      const burst = document.createElement("div");
      burst.className = "impact";

      burst.style.left =
        targetRect.left -
        gameRect.left +
        targetRect.width * 0.5 +
        "px";

      burst.style.top =
        targetRect.top -
        gameRect.top +
        targetRect.height * 0.45 +
        "px";

      game.appendChild(burst);

      const number = document.createElement("div");
      number.className = "damage";
      number.textContent = "-" + damage;

      number.style.left =
        targetRect.left -
        gameRect.left +
        targetRect.width * 0.48 +
        "px";

      number.style.top =
        targetRect.top -
        gameRect.top +
        targetRect.height * 0.32 +
        "px";

      game.appendChild(number);

      setTimeout(() => burst.remove(), 520);
      setTimeout(() => number.remove(), 730);
    }

    function animateAttack(
      attacker,
      defender,
      direction,
      damage,
      blocked = false
    ) {
      attacker.classList.add(direction);

      setTimeout(() => {
        if (blocked) {
          defender.classList.add("blocking");
          blockSound();
          vibrate(25);
        } else {
          defender.classList.add("hit");

          impact(defender, damage);

          hitSound();
          vibrate([25, 20, 40]);

          game.classList.add("screen-shake");
        }
      }, 110);

      setTimeout(() => {
        attacker.classList.remove(direction);
        defender.classList.remove("hit");
        defender.classList.remove("blocking");

        game.classList.remove("screen-shake");
      }, 430);
    }

    function playerMove(key) {
      if (!active || locked) {
        return;
      }

      getAudio();

      if (key === "block") {
        bobBlocking = true;
        locked = true;

        bob.classList.add("blocking");

        setMessage("Bob braces his pot.");
        blockSound();

        setTimeout(enemyTurn, 500);

        return;
      }

      const move = moves[key];

      if (!move) {
        return;
      }

      locked = true;
      update();

      if (Math.random() > move.accuracy) {
        bob.classList.add("attack-left");

        missSound();

        setMessage(
          move.name +
          " misses. Bob looks personally offended."
        );

        setTimeout(() => {
          bob.classList.remove("attack-left");
          enemyTurn();
        }, 580);

        return;
      }

      const damage = random(move.min, move.max);

      flyHealth -= damage;
      bobPower += move.power;

      animateAttack(
        bob,
        flytrap,
        "attack-left",
        damage
      );

      setMessage(move.text);

      update();

      if (flyHealth <= 0) {
        setTimeout(() => {
          endRound("bob");
        }, 650);

        return;
      }

      if (
        flyHealth <= 25 &&
        bobPower >= 100
      ) {
        setTimeout(() => {
          locked = false;
          update();

          setMessage(
            "Flytrap is vulnerable. KINTSUGI CRUSH is ready."
          );
        }, 650);

        return;
      }

      setTimeout(enemyTurn, 720);
    }

    function enemyTurn() {
      if (
        !active ||
        flyHealth <= 0 ||
        bobHealth <= 0
      ) {
        return;
      }

      locked = true;
      update();

      const move =
        enemyMoves[
          Math.floor(Math.random() * enemyMoves.length)
        ];

      setTimeout(() => {
        if (Math.random() > move.accuracy) {
          flytrap.classList.add("attack-right");

          missSound();

          setMessage(
            "Flytrap uses " +
            move.name +
            " and bites absolutely nothing."
          );

          setTimeout(() => {
            flytrap.classList.remove("attack-right");
            endEnemyTurn();
          }, 550);

          return;
        }

        let damage = random(move.min, move.max);

        if (bobBlocking) {
          damage = Math.max(
            1,
            Math.floor(damage * 0.28)
          );
        }

        bobHealth -= damage;
        flyPower += move.power;

        animateAttack(
          flytrap,
          bob,
          "attack-right",
          damage,
          bobBlocking
        );

        setMessage(
          "Flytrap uses " +
          move.name +
          (bobBlocking
            ? ". Bob blocks most of it."
            : ".")
        );

        update();

        if (bobHealth <= 0) {
          setTimeout(() => {
            endRound("fly");
          }, 650);

          return;
        }

        setTimeout(endEnemyTurn, 650);
      }, random(350, 650));
    }

    function endEnemyTurn() {
      bobBlocking = false;
      bob.classList.remove("blocking");

      locked = false;

      update();

      setMessage("Bob’s turn.");
    }

    function startTimer() {
      clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        if (!active) {
          return;
        }

        time -= 1;

        if (time <= 0) {
          time = 0;
          update();

          clearInterval(timerInterval);

          endRound(
            bobHealth >= flyHealth
              ? "bob"
              : "fly"
          );

          return;
        }

        update();
      }, 1000);
    }

    function startRound() {
      clearInterval(timerInterval);

      bobHealth = 100;
      flyHealth = 100;

      bobPower = 0;
      flyPower = 0;

      time = 60;

      active = false;
      locked = true;
      bobBlocking = false;

      bob.className = "fighter bob";
      flytrap.className = "fighter flytrap";

      restartButton.classList.remove("show");

      update();

      announce("ROUND " + currentRound);

      setTimeout(() => {
        announce("FIGHT!");

        tone(
          125,
          0.3,
          "sawtooth",
          0.06,
          62
        );
      }, 900);

      setTimeout(() => {
        active = true;
        locked = false;

        update();
        startTimer();

        setMessage("Bob’s turn.");
      }, 1750);
    }

    function endRound(winner) {
      if (!active) {
        return;
      }

      active = false;
      locked = true;

      clearInterval(timerInterval);

      if (winner === "bob") {
        bobRounds += 1;

        flytrap.classList.add("defeated");

        announce("BOB WINS");

        setMessage(
          "Cracked, but never broken."
        );
      } else {
        flyRounds += 1;

        bob.classList.add("defeated");

        announce("FLYTRAP WINS");

        setMessage(
          "Bob has been temporarily composted."
        );
      }

      update();

      setTimeout(() => {
        if (
          bobRounds >= 2 ||
          flyRounds >= 2
        ) {
          endMatch();
        } else {
          currentRound += 1;
          startRound();
        }
      }, 2100);
    }

    function endMatch() {
      active = false;
      locked = true;

      clearInterval(timerInterval);

      if (bobRounds >= 2) {
        announce("BOB WINS");

        setMessage(
          "Cracked, but never broken. McBride’s has a new champion."
        );
      } else {
        announce("GAME OVER");

        setMessage(
          "Flytrap wins and immediately asks about lunch."
        );
      }

      restartButton.classList.add("show");
      update();
    }

    function finisher() {
      if (
        !active ||
        locked ||
        bobPower < 100 ||
        flyHealth > 25
      ) {
        return;
      }

      locked = true;
      update();

      announce("KINTSUGI CRUSH!");

      tone(
        72,
        0.55,
        "sawtooth",
        0.075,
        28
      );

      bob.classList.add("attack-left");

      setTimeout(() => {
        flytrap.classList.add("hit");

        impact(flytrap, 99);

        game.classList.add("screen-shake");

        flyHealth = 0;
        bobPower = 0;

        vibrate([90,40,120,60,170]);

        setMessage(
          "Bob breaks the pot, repairs it with gold, and checks the warranty."
        );

        update();
      }, 250);

      setTimeout(() => {
        bob.classList.remove("attack-left");
        flytrap.classList.remove("hit");
        game.classList.remove("screen-shake");

        endRound("bob");
      }, 1200);
    }

    function restart() {
      bobRounds = 0;
      flyRounds = 0;
      currentRound = 1;

      startRound();
    }

    moveButtons.forEach((button) => {
      button.addEventListener("click", () => {
        playerMove(button.dataset.move);
      });
    });

    specialButton.addEventListener(
      "click",
      finisher
    );

    restartButton.addEventListener(
      "click",
      restart
    );

    startButton.addEventListener(
      "click",
      () => {
        getAudio();

        startScreen.classList.add("hidden");

        tone(
          700,
          0.08,
          "square",
          0.05,
          1000
        );

        setTimeout(startRound, 350);
      }
    );

    update();
  </script>

</body>
</html>
