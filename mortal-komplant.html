<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >

  <title>Mortal KomPlant</title>

  <style>
    :root {
      --gold: #e4b554;
      --cream: #f2dfb2;
      --green: #78b83d;
      --bright-green: #c6ff65;
      --red: #cc382d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020302;
      color: white;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      user-select: none;
      touch-action: manipulation;
    }

    button {
      font: inherit;
    }

    .game {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;

      background:
        radial-gradient(
          ellipse at 50% 80%,
          rgba(72, 112, 35, 0.34),
          transparent 43%
        ),
        linear-gradient(
          to bottom,
          #10160f 0%,
          #070a07 52%,
          #15100c 100%
        );
    }

    .arcade-backdrop {
      position: absolute;
      inset: 0;
      z-index: -5;
      opacity: 0.48;

      background:
        radial-gradient(circle at 8% 30%, #256cff 0 3px, transparent 5px),
        radial-gradient(circle at 19% 48%, #ff2f88 0 3px, transparent 5px),
        radial-gradient(circle at 32% 27%, #66d33c 0 3px, transparent 5px),
        radial-gradient(circle at 68% 29%, #f3cb38 0 3px, transparent 5px),
        radial-gradient(circle at 82% 47%, #9a45ff 0 3px, transparent 5px),
        radial-gradient(circle at 94% 31%, #19dec3 0 3px, transparent 5px);
    }

    .floor {
      position: absolute;
      left: -20%;
      right: -20%;
      bottom: -31%;
      height: 63%;
      z-index: -3;

      transform: perspective(520px) rotateX(62deg);
      transform-origin: center top;

      background:
        repeating-linear-gradient(
          90deg,
          transparent 0 56px,
          rgba(106, 193, 51, 0.22) 57px 59px
        ),
        repeating-linear-gradient(
          0deg,
          transparent 0 56px,
          rgba(106, 193, 51, 0.22) 57px 59px
        ),
        #071009;
    }

    .neon {
      position: absolute;
      top: 25%;
      left: 50%;
      z-index: -2;

      transform: translateX(-50%);

      color: #ff4536;
      font-size: clamp(1.2rem, 6vw, 3.4rem);
      letter-spacing: 0.08em;
      white-space: nowrap;
      opacity: 0.63;

      text-shadow:
        0 0 6px #ff3e31,
        0 0 18px #ff3e31,
        0 0 35px rgba(255, 62, 49, 0.6);
    }

    /* HUD */

    .hud {
      position: absolute;
      left: 3%;
      right: 3%;
      top: 3%;
      z-index: 15;

      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: start;
    }

    .hud-side.enemy {
      text-align: right;
    }

    .name {
      margin-bottom: 3px;
      color: var(--cream);
      font-size: clamp(0.75rem, 3.3vw, 1.3rem);
      letter-spacing: 0.07em;
      text-shadow: 2px 2px 0 black;
    }

    .health-shell {
      position: relative;
      height: clamp(17px, 3.5vw, 25px);
      overflow: hidden;

      background: #310b09;
      border: 2px solid #0b0b09;

      box-shadow:
        0 0 0 1px rgba(228, 181, 84, 0.75),
        inset 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    .health {
      width: 100%;
      height: 100%;
      transition: width 320ms ease;

      background:
        linear-gradient(
          to bottom,
          #a8ea5b,
          #5b9e2c 55%,
          #2f5915
        );
    }

    .enemy .health {
      margin-left: auto;

      background:
        linear-gradient(
          to bottom,
          #f26452,
          #bb2e28 55%,
          #691715
        );
    }

    .health-number {
      position: absolute;
      inset: 0;

      display: grid;
      place-items: center;

      font-family: Arial, sans-serif;
      font-size: clamp(0.55rem, 2vw, 0.75rem);
      font-weight: 900;
      text-shadow: 1px 1px 2px black;
    }

    .power-shell {
      height: 7px;
      margin-top: 4px;
      overflow: hidden;

      background: #141819;
      border: 1px solid rgba(228, 181, 84, 0.65);
    }

    .power {
      width: 0;
      height: 100%;
      transition: width 250ms ease;
      background: linear-gradient(90deg, #1985ff, #69efff);
    }

    .power.ready {
      animation: powerPulse 500ms ease-in-out infinite alternate;
      background: linear-gradient(90deg, #6dff1f, #e7ff66);
    }

    .enemy .power {
      margin-left: auto;
      background: linear-gradient(90deg, #ff7b28, #ffe05a);
    }

    @keyframes powerPulse {
      from {
        filter: brightness(1);
        box-shadow: 0 0 4px #8aff33;
      }

      to {
        filter: brightness(1.8);
        box-shadow: 0 0 16px #caff55;
      }
    }

    .center-hud {
      min-width: 50px;
      text-align: center;
    }

    .timer {
      color: var(--gold);
      font-size: clamp(1.6rem, 7vw, 3rem);
      line-height: 0.9;

      text-shadow:
        2px 2px 0 #000,
        0 0 10px rgba(228, 181, 84, 0.42);
    }

    .round-text {
      margin-top: 5px;
      color: #d7bd81;
      font-size: clamp(0.55rem, 2.2vw, 0.75rem);
    }

    .round-dots {
      display: flex;
      gap: 5px;
      margin-top: 5px;
    }

    .enemy .round-dots {
      justify-content: flex-end;
    }

    .round-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;
      border: 1px solid var(--gold);
      background: #171717;
    }

    .round-dot.won {
      background: var(--gold);
      box-shadow: 0 0 8px rgba(228, 181, 84, 0.8);
    }

    /* FIGHTERS */

    .fight-stage {
      position: absolute;
      left: 0;
      right: 0;
      top: 16%;
      bottom: 22%;

      display: flex;
      align-items: end;
      justify-content: space-between;

      padding: 0 3% 1%;
    }

    .fighter {
      position: relative;
      width: 48%;
      height: 92%;
      overflow: hidden;
      transform-origin: center bottom;

      filter:
        drop-shadow(0 14px 12px rgba(0, 0, 0, 0.75))
        saturate(1.08)
        contrast(1.05);

      transition:
        transform 150ms ease,
        filter 120ms ease,
        opacity 180ms ease;
    }

    .fighter-image {
      position: absolute;
      inset: 0;

      background-image:
        url("2E040EFB-EE2C-49A3-81D1-3A72CDFD3608.png");

      background-repeat: no-repeat;
      background-size: 200% 100%;
    }

    .bob .fighter-image {
      background-position: left center;
    }

    .flytrap .fighter-image {
      background-position: right center;
    }

    .fighter::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(5, 8, 5, 0.06) 58%,
          rgba(5, 8, 5, 0.5)
        );

      mix-blend-mode: multiply;
    }

    .bob {
      animation: bobIdle 1.8s ease-in-out infinite;
    }

    .flytrap {
      animation: flyIdle 1.45s ease-in-out infinite;
    }

    @keyframes bobIdle {
      0%, 100% {
        transform: translateY(0) rotate(-0.6deg);
      }

      50% {
        transform: translateY(-5px) rotate(0.6deg);
      }
    }

    @keyframes flyIdle {
      0%, 100% {
        transform: translateY(0) rotate(1deg);
      }

      50% {
        transform: translateY(-7px) rotate(-1deg);
      }
    }

    /* UNIQUE BOB MOVE ANIMATIONS */

    .bob.pot-shot-animation {
      animation: potShotBob 440ms ease !important;
    }

    @keyframes potShotBob {
      0%, 100% {
        transform: translateX(0) rotate(0);
      }

      25% {
        transform: translateX(-15px) rotate(-8deg);
      }

      55% {
        transform: translateX(22px) rotate(7deg);
      }
    }

    .bob.leaf-slap-animation {
      animation: leafSlapBob 520ms ease !important;
    }

    @keyframes leafSlapBob {
      0%, 100% {
        transform: rotate(0) scale(1);
      }

      25% {
        transform: rotate(-13deg) scale(0.96);
      }

      60% {
        transform:
          translateX(45px)
          rotate(17deg)
          scale(1.08);
      }
    }

    .bob.root-animation {
      animation: rootBob 650ms ease !important;
    }

    @keyframes rootBob {
      0%, 100% {
        transform: translateY(0);
      }

      28% {
        transform:
          translateY(18px)
          scaleY(0.88);
      }

      55% {
        transform:
          translateY(-8px)
          scaleY(1.05);
      }
    }

    .bob.blocking {
      transform:
        translateY(18px)
        scale(0.91);

      filter:
        drop-shadow(0 0 24px rgba(255, 212, 83, 0.95))
        brightness(1.15);
    }

    .bob.dodge-left {
      animation: dodgeLeft 360ms ease !important;
    }

    .bob.dodge-right {
      animation: dodgeRight 360ms ease !important;
    }

    @keyframes dodgeLeft {
      45% {
        transform: translateX(-48px) scale(0.94);
      }
    }

    @keyframes dodgeRight {
      45% {
        transform: translateX(48px) scale(0.94);
      }
    }

    .bob.charging {
      animation: chargePower 520ms ease !important;

      filter:
        drop-shadow(0 0 25px #aaff45)
        brightness(1.5);
    }

    @keyframes chargePower {
      50% {
        transform:
          translateY(-10px)
          scale(1.06);
      }
    }

    /* UNIQUE FLYTRAP MOVE ANIMATIONS */

    .flytrap.bite-animation {
      animation: flyBite 500ms ease !important;
    }

    @keyframes flyBite {
      0%, 100% {
        transform: translateX(0) scale(1);
      }

      32% {
        transform:
          translateX(-18px)
          scale(0.93);
      }

      62% {
        transform:
          translateX(-58px)
          scale(1.13, 0.94);
      }
    }

    .flytrap.acid-animation {
      animation: flyAcid 640ms ease !important;
    }

    @keyframes flyAcid {
      0%, 100% {
        transform: rotate(0);
      }

      30% {
        transform:
          translateY(12px)
          rotate(8deg);
      }

      55% {
        transform:
          translateY(-10px)
          rotate(-11deg);
      }
    }

    .flytrap.vine-animation {
      animation: flyVine 540ms ease !important;
    }

    @keyframes flyVine {
      0%, 100% {
        transform: rotate(0);
      }

      35% {
        transform:
          translateX(18px)
          rotate(12deg);
      }

      65% {
        transform:
          translateX(-38px)
          rotate(-14deg);
      }
    }

    .fighter.hit {
      animation: hitShake 300ms ease !important;

      filter:
        brightness(2.2)
        saturate(0.3)
        drop-shadow(0 0 20px #ffdf69);
    }

    @keyframes hitShake {
      20% {
        transform: translateX(-15px) rotate(-3deg);
      }

      45% {
        transform: translateX(13px) rotate(2deg);
      }

      70% {
        transform: translateX(-7px);
      }
    }

    .fighter.defeated {
      animation: fall 700ms ease forwards !important;
    }

    @keyframes fall {
      to {
        transform:
          translateY(65px)
          rotate(75deg)
          scale(0.85);

        filter:
          grayscale(0.7)
          brightness(0.42);
      }
    }

    /* EFFECT OBJECTS */

    .projectile,
    .leaf-arc,
    .root-spike,
    .acid-drop,
    .vine-whip,
    .shield {
      position: absolute;
      z-index: 55;
      pointer-events: none;
    }

    .projectile {
      left: 28%;
      top: 53%;

      width: 35px;
      height: 27px;

      border-radius: 48% 52% 42% 58%;

      background:
        radial-gradient(
          circle at 30% 25%,
          #b6955b,
          #644124 65%,
          #25170d
        );

      box-shadow:
        0 0 12px rgba(226, 182, 96, 0.65);

      animation: projectileFly 420ms linear forwards;
    }

    @keyframes projectileFly {
      to {
        transform:
          translateX(760%)
          rotate(760deg);

        opacity: 0;
      }
    }

    .leaf-arc {
      left: 24%;
      top: 39%;

      width: 42%;
      height: 34%;

      border-top: 10px solid #aaff55;
      border-right: 5px solid transparent;
      border-radius: 50%;

      filter:
        drop-shadow(0 0 8px #76e33e);

      transform: rotate(-18deg);
      animation: leafArc 460ms ease forwards;
    }

    @keyframes leafArc {
      from {
        opacity: 0;
        transform:
          rotate(-75deg)
          scale(0.3);
      }

      35% {
        opacity: 1;
      }

      to {
        opacity: 0;
        transform:
          translateX(85%)
          rotate(28deg)
          scale(1.25);
      }
    }

    .root-spike {
      bottom: 21%;
      width: 20px;
      height: 90px;

      border-radius: 80% 20% 10% 10%;

      background:
        linear-gradient(
          90deg,
          #392314,
          #98704a,
          #28170d
        );

      transform-origin: bottom center;
      animation: rootBurst 520ms ease forwards;
    }

    @keyframes rootBurst {
      from {
        transform:
          translateY(100%)
          scaleY(0.1);
      }

      48% {
        transform:
          translateY(0)
          scaleY(1.15);
      }

      to {
        transform:
          translateY(110%)
          scaleY(0.1);

        opacity: 0;
      }
    }

    .shield {
      left: 12%;
      top: 31%;

      width: 38%;
      height: 54%;

      border: 7px solid rgba(238, 192, 82, 0.88);
      border-radius: 50%;

      box-shadow:
        0 0 18px rgba(255, 211, 88, 0.92),
        inset 0 0 20px rgba(255, 211, 88, 0.2);

      animation: shieldFlash 650ms ease forwards;
    }

    .shield::before,
    .shield::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 8%;
      width: 4px;
      height: 84%;

      background: rgba(255, 219, 112, 0.75);
      transform: rotate(22deg);
    }

    .shield::after {
      transform: rotate(-29deg);
    }

    @keyframes shieldFlash {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      30% {
        opacity: 1;
        transform: scale(1);
      }

      to {
        opacity: 0;
        transform: scale(1.12);
      }
    }

    .acid-drop {
      right: 29%;
      top: 45%;

      width: 25px;
      height: 18px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 30%,
          #e8ff74,
          #52d52d 60%,
          #176419
        );

      box-shadow:
        0 0 13px #5aff38;

      animation: acidFly 480ms linear forwards;
    }

    @keyframes acidFly {
      to {
        transform:
          translateX(-760%)
          translateY(85px)
          scale(1.4);

        opacity: 0;
      }
    }

    .vine-whip {
      right: 28%;
      top: 52%;

      width: 48%;
      height: 18px;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #315f27,
          #83be4c
        );

      transform-origin: right center;
      animation: vineWhip 470ms ease forwards;
    }

    @keyframes vineWhip {
      from {
        transform:
          rotate(35deg)
          scaleX(0);
      }

      50% {
        transform:
          rotate(-8deg)
          scaleX(1);
      }

      to {
        transform:
          rotate(-30deg)
          scaleX(0);

        opacity: 0;
      }
    }

    /* TEXT */

    .announcement {
      position: absolute;
      left: 50%;
      top: 45%;
      z-index: 80;

      width: 94%;

      transform:
        translate(-50%, -50%)
        scale(0.5);

      opacity: 0;

      color: #f0ca60;
      text-align: center;
      font-size: clamp(2.2rem, 14vw, 6rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      pointer-events: none;

      text-shadow:
        5px 5px 0 #56110d,
        -2px -2px 0 black,
        0 0 24px rgba(255, 64, 32, 0.76);
    }

    .announcement.show {
      animation: announcement 1150ms ease forwards;
    }

    .announcement.finish {
      color: #df2920;
      animation: finishPulse 800ms ease-in-out infinite alternate;
    }

    @keyframes announcement {
      0% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          scale(2);
      }

      18% {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          scale(0.85);
      }

      72% {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          scale(1);
      }

      100% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          scale(1.08);
      }
    }

    @keyframes finishPulse {
      from {
        opacity: 0.72;
        transform:
          translate(-50%, -50%)
          scale(0.96);
      }

      to {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          scale(1.08);
      }
    }

    .combat-message {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 22%;
      z-index: 20;

      min-height: 1.2em;

      color: #f6e8c7;
      text-align: center;
      font-family: Arial, sans-serif;
      font-weight: 900;
      font-size: clamp(0.7rem, 2.7vw, 0.95rem);

      text-shadow: 2px 2px 3px black;
    }

    .screen-shake {
      animation: screenShake 320ms ease;
    }

    @keyframes screenShake {
      20% { transform: translate(-5px, 3px); }
      40% { transform: translate(7px, -3px); }
      60% { transform: translate(-4px, 2px); }
      80% { transform: translate(3px, -2px); }
    }

    /* RAZOR ALOE */

    .razor-leaf {
      position: absolute;
      left: 22%;
      top: 42%;
      z-index: 62;

      width: 24%;
      height: 7px;

      border-radius: 90% 10% 90% 10%;

      background:
        linear-gradient(
          90deg,
          #caff6c,
          #3eaa2a 65%,
          #16310e
        );

      box-shadow:
        0 0 12px #aaff55,
        0 0 25px rgba(83, 255, 50, 0.65);

      animation: razorFly 440ms linear forwards;
    }

    @keyframes razorFly {
      from {
        transform:
          translateX(0)
          rotate(var(--angle))
          scaleX(0.5);
      }

      to {
        transform:
          translateX(270%)
          rotate(var(--angle))
          scaleX(1.5);

        opacity: 0;
      }
    }

    /* FINISHER */

    .finisher-darkness {
      position: absolute;
      inset: 0;
      z-index: 60;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 30% 57%,
          rgba(72, 255, 42, 0.22),
          transparent 25%
        ),
        rgba(0, 0, 0, 0.88);

      opacity: 0;
      transition: opacity 250ms ease;
    }

    .finisher-darkness.show {
      opacity: 1;
    }

    .slash {
      position: absolute;
      left: -20%;
      top: 50%;
      z-index: 72;

      width: 145%;
      height: 9px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #caff75 20%,
          white 50%,
          #60d939 80%,
          transparent
        );

      box-shadow:
        0 0 15px #caff75,
        0 0 35px #52ff2e;

      opacity: 0;

      transform:
        rotate(var(--slash-angle))
        scaleX(0);

      animation: slashCut 260ms ease forwards;
    }

    @keyframes slashCut {
      15% {
        opacity: 1;
      }

      62% {
        opacity: 1;
        transform:
          rotate(var(--slash-angle))
          scaleX(1);
      }

      100% {
        opacity: 0;
        transform:
          rotate(var(--slash-angle))
          scaleX(1.25);
      }
    }

    .sap-drop,
    .plant-chunk,
    .pot-fragment {
      position: absolute;
      z-index: 75;
      pointer-events: none;
    }

    .sap-drop {
      width: var(--sap-size);
      height: calc(var(--sap-size) * 1.35);

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 25%,
          #d8ff70,
          #49c728 45%,
          #176d14
        );

      animation: sapSpray 920ms ease-out forwards;
    }

    @keyframes sapSpray {
      to {
        transform:
          translate(
            var(--sap-x),
            var(--sap-y)
          )
          scale(1.2);

        opacity: 0;
      }
    }

    .plant-chunk {
      width: var(--chunk-size);
      height: var(--chunk-size);

      border-radius: 48% 52% 38% 62%;

      background:
        radial-gradient(
          circle at 35% 30%,
          #b1d65b,
          #397a27 48%,
          #163716
        );

      border: 2px solid #0b180b;

      animation: chunkFly 1050ms ease-out forwards;
    }

    @keyframes chunkFly {
      to {
        transform:
          translate(
            var(--chunk-x),
            var(--chunk-y)
          )
          rotate(var(--chunk-spin))
          scale(0.7);

        opacity: 0;
      }
    }

    .pot-fragment {
      width: var(--fragment-width);
      height: var(--fragment-height);

      background:
        linear-gradient(
          135deg,
          #84983d,
          #243016
        );

      border: 2px solid #0c1108;

      clip-path:
        polygon(
          0 10%,
          100% 0,
          80% 100%,
          15% 80%
        );

      animation: fragmentFly 980ms ease-out forwards;
    }

    @keyframes fragmentFly {
      to {
        transform:
          translate(
            var(--frag-x),
            var(--frag-y)
          )
          rotate(var(--frag-spin));

        opacity: 0;
      }
    }

    .victory-screen {
      position: absolute;
      inset: 0;
      z-index: 90;

      display: grid;
      place-items: center;

      background:
        radial-gradient(
          circle at center,
          rgba(128, 181, 47, 0.32),
          transparent 45%
        ),
        rgba(1, 3, 1, 0.91);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 450ms ease,
        visibility 450ms ease;
    }

    .victory-screen.show {
      opacity: 1;
      visibility: visible;
    }

    .victory-content {
      text-align: center;
    }

    .victory-title {
      color: #d7b650;
      font-size: clamp(2rem, 11vw, 5rem);
      line-height: 0.9;

      text-shadow:
        4px 4px 0 #332208,
        0 0 22px rgba(255, 220, 86, 0.55);
    }

    .victory-title span {
      display: block;
      margin-top: 12px;

      color: #87cf42;
      font-size: 0.56em;
      letter-spacing: 0.08em;
    }

    .victory-quarter {
      margin-top: 28px;

      color: #f2dfae;
      font-family: Arial, sans-serif;
      font-weight: 900;
      font-size: clamp(0.7rem, 3vw, 1rem);
      letter-spacing: 0.08em;

      animation: quarterBlink 850ms steps(2) infinite;
    }

    @keyframes quarterBlink {
      50% {
        opacity: 0.28;
      }
    }

    /* NORMAL PAGE CONTROLS */

    .controls {
      position: absolute;
      left: 2%;
      right: 2%;
      bottom: 2%;
      z-index: 30;

      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .move {
      min-height: clamp(48px, 11vw, 72px);
      padding: 5px 3px;

      color: white;
      border: 2px solid #070807;
      border-radius: 7px;
      background: linear-gradient(#384d22, #18220f);

      font-size: clamp(0.62rem, 2.7vw, 0.94rem);
      text-transform: uppercase;
    }

    .move:nth-child(2) {
      background: linear-gradient(#54331d, #26160e);
    }

    .move:nth-child(3) {
      background: linear-gradient(#294452, #111d24);
    }

    .move:nth-child(4) {
      background: linear-gradient(#514733, #252016);
    }

    .move:disabled {
      opacity: 0.33;
    }

    .small {
      display: block;
      margin-top: 3px;

      color: rgba(255, 255, 255, 0.58);
      font-family: Arial, sans-serif;
      font-size: clamp(0.45rem, 1.7vw, 0.58rem);
      text-transform: none;
    }

    .special-row {
      position: absolute;
      left: 2%;
      right: 2%;
      bottom: calc(2% + clamp(55px, 12vw, 80px));
      z-index: 31;

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .special,
    .restart {
      min-height: 43px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .special {
      color: #211204;
      background: linear-gradient(#aaff55, #418f20);
      border: 2px solid #203f10;
    }

    .special:disabled {
      opacity: 0.28;
    }

    .restart {
      display: none;
      color: var(--cream);
      background: #281714;
      border: 1px solid rgba(228, 181, 84, 0.7);
    }

    .restart.show {
      display: block;
    }

    /* START SCREEN */

    .start-screen {
      position: absolute;
      inset: 0;
      z-index: 100;

      display: grid;
      place-items: center;
      padding: 18px;

      background:
        radial-gradient(
          circle at center,
          rgba(59, 100, 28, 0.25),
          transparent 45%
        ),
        rgba(1, 3, 1, 0.96);
    }

    .start-screen.hidden {
      display: none;
    }

    .start-card {
      width: min(92%, 550px);
      text-align: center;
    }

    .title {
      color: #72b13b;
      font-size: clamp(2.5rem, 14vw, 6rem);
      line-height: 0.82;

      text-shadow:
        4px 4px 0 #3f160d,
        0 0 18px rgba(113, 177, 59, 0.45);
    }

    .title span {
      color: #e2b754;
    }

    .subtitle {
      margin-top: 14px;
      color: #d24531;
      font-size: clamp(1.2rem, 6vw, 2.5rem);
    }

    .insert {
      margin-top: 35px;
      color: #f1dfaa;
      font-family: Arial, sans-serif;
      font-weight: 900;
      animation: blink 1s steps(2) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0.25;
      }
    }

    .start-button {
      margin-top: 20px;
      min-height: 54px;
      padding: 12px 30px;

      color: #1e1104;
      background: linear-gradient(#ffd762, #a96115);
      border: 2px solid #4f2908;
      border-radius: 7px;
    }

    .scanlines {
      position: absolute;
      inset: 0;
      z-index: 110;
      pointer-events: none;
      opacity: 0.13;

      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.18) 0 1px,
          transparent 1px 4px
        );
    }

    .glass {
      position: absolute;
      inset: 0;
      z-index: 111;
      pointer-events: none;

      background:
        linear-gradient(
          115deg,
          rgba(255, 255, 255, 0.07),
          transparent 22% 70%,
          rgba(255, 255, 255, 0.025)
        );

      box-shadow:
        inset 0 0 35px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>

<body>

  <main class="game" id="game">

    <div class="arcade-backdrop"></div>
    <div class="floor"></div>
    <div class="neon">McBride’s</div>

    <section class="hud">

      <div class="hud-side">

        <div class="name">BOB</div>

        <div class="health-shell">
          <div class="health" id="bobHealth"></div>
          <div class="health-number" id="bobNumber">100</div>
        </div>

        <div class="power-shell">
          <div class="power" id="bobPower"></div>
        </div>

        <div class="round-dots">
          <span class="round-dot" id="bobDot1"></span>
          <span class="round-dot" id="bobDot2"></span>
        </div>

      </div>

      <div class="center-hud">
        <div class="timer" id="timer">60</div>

        <div class="round-text">
          ROUND <span id="roundNumber">1</span>
        </div>
      </div>

      <div class="hud-side enemy">

        <div class="name">FLYTRAP</div>

        <div class="health-shell">
          <div class="health" id="flyHealth"></div>
          <div class="health-number" id="flyNumber">100</div>
        </div>

        <div class="power-shell">
          <div class="power" id="flyPower"></div>
        </div>

        <div class="round-dots">
          <span class="round-dot" id="flyDot1"></span>
          <span class="round-dot" id="flyDot2"></span>
        </div>

      </div>

    </section>

    <section class="fight-stage">

      <div class="fighter bob" id="bob">
        <div class="fighter-image"></div>
      </div>

      <div class="fighter flytrap" id="flytrap">
        <div class="fighter-image"></div>
      </div>

    </section>

    <div class="announcement" id="announcement">
      FIGHT!
    </div>

    <div class="combat-message" id="message">
      Bob’s turn.
    </div>

    <div class="special-row">

      <button
        class="special"
        id="specialButton"
        disabled
      >
        Razor Aloe
      </button>

      <button
        class="restart"
        id="restartButton"
      >
        Fight Again
      </button>

    </div>

    <section class="controls">

      <button class="move" data-move="pot">
        Pot Shot
        <span class="small">Projectile</span>
      </button>

      <button class="move" data-move="leaf">
        Leaf Slap
        <span class="small">Wide strike</span>
      </button>

      <button class="move" data-move="root">
        Root Problem
        <span class="small">Ground attack</span>
      </button>

      <button class="move" data-move="block">
        Block
        <span class="small">Gold shield</span>
      </button>

    </section>

    <section class="start-screen" id="startScreen">

      <div class="start-card">

        <div class="title">
          <span>MORTAL</span><br>
          KOMPLANT
        </div>

        <div class="subtitle">
          GARDEN BRAWL
        </div>

        <div class="insert">
          INSERT COIN
        </div>

        <button class="start-button" id="startButton">
          PRESS START
        </button>

      </div>

    </section>

    <div
      class="finisher-darkness"
      id="finisherDarkness"
    ></div>

    <div
      class="victory-screen"
      id="victoryScreen"
    >
      <div class="victory-content">

        <div class="victory-title">
          KINTSUGI
          <span>VICTORY</span>
        </div>

        <div class="victory-quarter">
          INSERT ANOTHER QUARTER
        </div>

      </div>
    </div>

    <div class="scanlines"></div>
    <div class="glass"></div>

  </main>

  <script>
    "use strict";

    const game = document.getElementById("game");

    const bob = document.getElementById("bob");
    const flytrap = document.getElementById("flytrap");

    const bobHealthBar = document.getElementById("bobHealth");
    const flyHealthBar = document.getElementById("flyHealth");

    const bobNumber = document.getElementById("bobNumber");
    const flyNumber = document.getElementById("flyNumber");

    const bobPowerBar = document.getElementById("bobPower");
    const flyPowerBar = document.getElementById("flyPower");

    const timerDisplay = document.getElementById("timer");
    const roundDisplay = document.getElementById("roundNumber");

    const announcement =
      document.getElementById("announcement");

    const message =
      document.getElementById("message");

    const specialButton =
      document.getElementById("specialButton");

    const restartButton =
      document.getElementById("restartButton");

    const startScreen =
      document.getElementById("startScreen");

    const startButton =
      document.getElementById("startButton");

    const finisherDarkness =
      document.getElementById("finisherDarkness");

    const victoryScreen =
      document.getElementById("victoryScreen");

    const moveButtons = Array.from(
      document.querySelectorAll(".move")
    );

    const bobDots = [
      document.getElementById("bobDot1"),
      document.getElementById("bobDot2")
    ];

    const flyDots = [
      document.getElementById("flyDot1"),
      document.getElementById("flyDot2")
    ];

    let bobHealth = 100;
    let flyHealth = 100;

    let bobPower = 0;
    let flyPower = 0;

    let bobRounds = 0;
    let flyRounds = 0;

    let currentRound = 1;
    let time = 60;

    let timerInterval = null;

    let active = false;
    let locked = true;

    let bobBlocking = false;
    let dodging = false;

    let lastDirection = "";
    let directionSequence = [];

    let finisherReady = false;
    let finisherRunning = false;

    function random(min, max) {
      return Math.floor(
        Math.random() * (max - min + 1)
      ) + min;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function announce(text, persistent = false) {
      announcement.textContent = text;

      announcement.classList.remove(
        "show",
        "finish"
      );

      void announcement.offsetWidth;

      if (persistent) {
        announcement.classList.add("finish");
      } else {
        announcement.classList.add("show");
      }
    }

    function setMessage(text) {
      message.textContent = text;
    }

    function createEffect(className) {
      const effect = document.createElement("div");
      effect.className = className;
      game.appendChild(effect);
      return effect;
    }

    function removeLater(element, delay) {
      window.setTimeout(() => {
        element.remove();
      }, delay);
    }

    function update() {
      bobHealth = clamp(bobHealth, 0, 100);
      flyHealth = clamp(flyHealth, 0, 100);

      bobPower = clamp(bobPower, 0, 100);
      flyPower = clamp(flyPower, 0, 100);

      bobHealthBar.style.width = bobHealth + "%";
      flyHealthBar.style.width = flyHealth + "%";

      bobPowerBar.style.width = bobPower + "%";
      flyPowerBar.style.width = flyPower + "%";

      bobPowerBar.classList.toggle(
        "ready",
        bobPower >= 100
      );

      bobNumber.textContent = bobHealth;
      flyNumber.textContent = flyHealth;

      timerDisplay.textContent = time;
      roundDisplay.textContent = currentRound;

      bobDots.forEach((dot, index) => {
        dot.classList.toggle("won", index < bobRounds);
      });

      flyDots.forEach((dot, index) => {
        dot.classList.toggle("won", index < flyRounds);
      });

      const enabled =
        active &&
        !locked &&
        !finisherRunning &&
        bobHealth > 0 &&
        flyHealth > 0;

      moveButtons.forEach((button) => {
        button.disabled = !enabled;
      });

      specialButton.disabled =
        !enabled ||
        bobPower < 100;
    }

    function shakeTarget(target) {
      target.classList.add("hit");
      game.classList.add("screen-shake");

      window.setTimeout(() => {
        target.classList.remove("hit");
        game.classList.remove("screen-shake");
      }, 360);
    }

    function createPotProjectile() {
      const projectile = createEffect("projectile");
      removeLater(projectile, 460);
    }

    function createLeafArc() {
      const arc = createEffect("leaf-arc");
      removeLater(arc, 500);
    }

    function createRoots() {
      for (let index = 0; index < 7; index += 1) {
        const root = createEffect("root-spike");

        root.style.left =
          58 + index * 4 + "%";

        root.style.animationDelay =
          index * 35 + "ms";

        root.style.transform =
          "rotate(" +
          random(-16, 16) +
          "deg)";

        removeLater(root, 780);
      }
    }

    function createShield() {
      const shield = createEffect("shield");
      removeLater(shield, 700);
    }

    function createAcid() {
      const acid = createEffect("acid-drop");
      removeLater(acid, 520);
    }

    function createVine() {
      const vine = createEffect("vine-whip");
      removeLater(vine, 520);
    }

    function rememberDirection(direction) {
      lastDirection = direction;

      directionSequence.push({
        direction,
        time: Date.now()
      });

      directionSequence =
        directionSequence.filter(
          item =>
            Date.now() - item.time < 2600
        );
    }

    function joystick(direction) {
      if (
        !active ||
        locked ||
        finisherRunning
      ) {
        return;
      }

      rememberDirection(direction);

      if (direction === "left") {
        dodging = true;
        bob.classList.add("dodge-left");

        setMessage("Bob dodges left.");

        window.setTimeout(() => {
          bob.classList.remove("dodge-left");
          dodging = false;
        }, 370);
      }

      if (direction === "right") {
        dodging = true;
        bob.classList.add("dodge-right");

        setMessage("Bob dodges right.");

        window.setTimeout(() => {
          bob.classList.remove("dodge-right");
          dodging = false;
        }, 370);
      }

      if (direction === "up") {
        locked = true;
        bob.classList.add("charging");

        bobPower += 15;

        setMessage("Bob absorbs suspicious arcade light.");
        update();

        window.setTimeout(() => {
          bob.classList.remove("charging");
          locked = false;
          update();
        }, 520);
      }

      if (direction === "down") {
        bobBlocking = true;
        bob.classList.add("blocking");
        createShield();

        setMessage("Bob crouch-blocks.");

        window.setTimeout(() => {
          bob.classList.remove("blocking");
        }, 650);
      }
    }

    function performRazorAloe() {
      if (
        !active ||
        locked ||
        bobPower < 100
      ) {
        return;
      }

      locked = true;
      bobPower = 0;

      announce("RAZOR ALOE!");

      setMessage(
        "Bob launches a storm of sharpened aloe."
      );

      bob.classList.add("charging");

      for (let index = 0; index < 10; index += 1) {
        window.setTimeout(() => {
          const leaf = createEffect("razor-leaf");

          leaf.style.setProperty(
            "--angle",
            random(-18, 18) + "deg"
          );

          leaf.style.top =
            random(35, 68) + "%";

          removeLater(leaf, 470);
        }, index * 52);
      }

      window.setTimeout(() => {
        const damage = random(24, 34);

        flyHealth -= damage;
        shakeTarget(flytrap);
        update();
      }, 340);

      window.setTimeout(() => {
        bob.classList.remove("charging");

        if (flyHealth <= 0) {
          handleBobKnockout();
        } else {
          enemyTurn();
        }
      }, 1000);
    }

    function playerMove(key) {
      if (
        !active ||
        locked ||
        finisherRunning
      ) {
        return;
      }

      if (
        key === "pot" &&
        lastDirection === "up" &&
        bobPower >= 100
      ) {
        performRazorAloe();
        return;
      }

      if (
        key === "root" &&
        finisherReady &&
        matchesFinisherSequence()
      ) {
        performFinisher();
        return;
      }

      if (key === "block") {
        bobBlocking = true;
        locked = true;

        bob.classList.add("blocking");
        createShield();

        setMessage("Bob braces behind a cracked-gold shield.");

        window.setTimeout(enemyTurn, 580);
        return;
      }

      locked = true;
      update();

      if (key === "pot") {
        bob.classList.add("pot-shot-animation");
        createPotProjectile();

        setMessage("Bob fires a spinning clod of soil.");

        window.setTimeout(() => {
          const damage = random(7, 12);

          flyHealth -= damage;
          bobPower += 11;

          shakeTarget(flytrap);
          update();
        }, 310);

        window.setTimeout(() => {
          bob.classList.remove("pot-shot-animation");
          afterPlayerAttack();
        }, 650);

        return;
      }

      if (key === "leaf") {
        bob.classList.add("leaf-slap-animation");
        createLeafArc();

        setMessage("Bob swings his entire aloe crown.");

        window.setTimeout(() => {
          if (Math.random() < 0.82) {
            const damage = random(11, 18);

            flyHealth -= damage;
            bobPower += 8;

            shakeTarget(flytrap);
          } else {
            setMessage(
              "Leaf Slap misses. Flytrap remains offensively smug."
            );
          }

          update();
        }, 330);

        window.setTimeout(() => {
          bob.classList.remove("leaf-slap-animation");
          afterPlayerAttack();
        }, 720);

        return;
      }

      if (key === "root") {
        bob.classList.add("root-animation");
        createRoots();

        setMessage("Roots erupt underneath Flytrap.");

        window.setTimeout(() => {
          const damage = random(8, 15);

          flyHealth -= damage;
          bobPower += 20;

          flytrap.style.transform =
            "translateY(-38px) rotate(-6deg)";

          shakeTarget(flytrap);
          update();
        }, 370);

        window.setTimeout(() => {
          flytrap.style.transform = "";
          bob.classList.remove("root-animation");

          afterPlayerAttack();
        }, 790);
      }
    }

    function afterPlayerAttack() {
      if (flyHealth <= 0) {
        handleBobKnockout();
      } else {
        enemyTurn();
      }
    }

    function handleBobKnockout() {
      const bobWouldWinMatch =
        bobRounds + 1 >= 2;

      if (bobWouldWinMatch) {
        enterFinisherState();
      } else {
        endRound("bob");
      }
    }

    function enemyTurn() {
      if (
        !active ||
        flyHealth <= 0 ||
        bobHealth <= 0 ||
        finisherRunning
      ) {
        return;
      }

      locked = true;
      update();

      const enemyMove =
        ["bite", "acid", "vine"][
          Math.floor(Math.random() * 3)
        ];

      window.setTimeout(() => {
        let damage = 0;

        if (enemyMove === "bite") {
          flytrap.classList.add("bite-animation");

          setMessage("Flytrap lunges with Snap Attack.");

          damage = random(7, 13);
        }

        if (enemyMove === "acid") {
          flytrap.classList.add("acid-animation");
          createAcid();

          setMessage("Flytrap spits corrosive plant juice.");

          damage = random(10, 17);
        }

        if (enemyMove === "vine") {
          flytrap.classList.add("vine-animation");
          createVine();

          setMessage("Flytrap lashes Bob with a vine whip.");

          damage = random(8, 15);
        }

        window.setTimeout(() => {
          if (dodging && Math.random() < 0.75) {
            damage = 0;
            setMessage("Bob dodges the attack.");
          }

          if (bobBlocking) {
            damage = Math.max(
              1,
              Math.floor(damage * 0.28)
            );
          }

          if (damage > 0) {
            bobHealth -= damage;
            shakeTarget(bob);
          }

          flyPower += 10;
          update();
        }, 280);

        window.setTimeout(() => {
          flytrap.classList.remove(
            "bite-animation",
            "acid-animation",
            "vine-animation"
          );

          if (bobHealth <= 0) {
            endRound("fly");
          } else {
            endEnemyTurn();
          }
        }, 720);
      }, random(330, 620));
    }

    function endEnemyTurn() {
      bobBlocking = false;

      bob.classList.remove("blocking");

      locked = false;

      update();
      setMessage("Bob’s turn.");
    }

    function enterFinisherState() {
      active = true;
      locked = false;
      finisherReady = true;

      clearInterval(timerInterval);

      flyHealth = 1;
      update();

      announcement.classList.remove("show");

      announce("FINISH HIM!", true);

      setMessage(
        "DOWN → RIGHT → ROOT PROBLEM"
      );

      directionSequence = [];
    }

    function matchesFinisherSequence() {
      const recent =
        directionSequence
          .filter(
            item =>
              Date.now() - item.time < 2600
          )
          .map(item => item.direction);

      const lastTwo = recent.slice(-2);

      return (
        lastTwo[0] === "down" &&
        lastTwo[1] === "right"
      );
    }

    function createSlash(angle, delay) {
      window.setTimeout(() => {
        const slash = createEffect("slash");

        slash.style.setProperty(
          "--slash-angle",
          angle + "deg"
        );

        slash.style.top =
          random(34, 72) + "%";

        removeLater(slash, 310);
      }, delay);
    }

    function createSapBurst(amount) {
      for (let index = 0; index < amount; index += 1) {
        const drop = createEffect("sap-drop");

        drop.style.left =
          random(58, 78) + "%";

        drop.style.top =
          random(40, 70) + "%";

        drop.style.setProperty(
          "--sap-size",
          random(6, 20) + "px"
        );

        drop.style.setProperty(
          "--sap-x",
          random(-230, 250) + "px"
        );

        drop.style.setProperty(
          "--sap-y",
          random(-250, 210) + "px"
        );

        removeLater(drop, 1000);
      }
    }

    function createFragments(amount) {
      for (let index = 0; index < amount; index += 1) {
        const fragment = createEffect("pot-fragment");

        fragment.style.left =
          random(61, 77) + "%";

        fragment.style.top =
          random(54, 76) + "%";

        fragment.style.setProperty(
          "--fragment-width",
          random(14, 34) + "px"
        );

        fragment.style.setProperty(
          "--fragment-height",
          random(10, 24) + "px"
        );

        fragment.style.setProperty(
          "--frag-x",
          random(-240, 260) + "px"
        );

        fragment.style.setProperty(
          "--frag-y",
          random(-260, 190) + "px"
        );

        fragment.style.setProperty(
          "--frag-spin",
          random(320, 850) + "deg"
        );

        removeLater(fragment, 1100);
      }
    }

    function createPlantChunks(amount) {
      for (let index = 0; index < amount; index += 1) {
        const chunk = createEffect("plant-chunk");

        chunk.style.left =
          random(60, 78) + "%";

        chunk.style.top =
          random(38, 68) + "%";

        chunk.style.setProperty(
          "--chunk-size",
          random(12, 34) + "px"
        );

        chunk.style.setProperty(
          "--chunk-x",
          random(-230, 260) + "px"
        );

        chunk.style.setProperty(
          "--chunk-y",
          random(-270, 210) + "px"
        );

        chunk.style.setProperty(
          "--chunk-spin",
          random(300, 950) + "deg"
        );

        removeLater(chunk, 1120);
      }
    }

    function performFinisher() {
      if (
        !finisherReady ||
        finisherRunning
      ) {
        return;
      }

      finisherRunning = true;
      locked = true;

      announcement.classList.remove("finish");

      finisherDarkness.classList.add("show");

      announce("UNHEALING ALOE!");

      setMessage(
        "Bob weaponizes the healing process."
      );

      bob.classList.add("charging");

      const slashAngles = [
        -42, -34, -26, -18,
        -10, -3, 6, 14,
        22, 31, 39, -29,
        -15, 2, 18, 36
      ];

      slashAngles.forEach((angle, index) => {
        createSlash(
          angle,
          150 + index * 44
        );
      });

      window.setTimeout(() => {
        createSapBurst(78);
        createFragments(36);
        createPlantChunks(28);

        flytrap.classList.add("hit");
        game.classList.add("screen-shake");
      }, 610);

      window.setTimeout(() => {
        flytrap.style.opacity = "0";

        flytrap.style.transform =
          "scale(1.55) rotate(18deg)";

        createSapBurst(30);
        createFragments(16);
        createPlantChunks(18);

        flyHealth = 0;
        update();
      }, 980);

      window.setTimeout(() => {
        flytrap.classList.remove("hit");
        game.classList.remove("screen-shake");
        bob.classList.remove("charging");
      }, 1350);

      window.setTimeout(() => {
        bobRounds = 2;

        victoryScreen.classList.add("show");

        setMessage(
          "Cracked, but never broken."
        );
      }, 1750);

      window.setTimeout(() => {
        finisherDarkness.classList.remove("show");

        active = false;
        locked = true;

        finisherReady = false;

        restartButton.classList.add("show");

        setMessage(
          "Insert another quarter to fight again."
        );

        update();
      }, 2250);
    }

    function startTimer() {
      clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        if (!active || finisherReady) {
          return;
        }

        time -= 1;

        if (time <= 0) {
          time = 0;
          update();

          const winner =
            bobHealth >= flyHealth
              ? "bob"
              : "fly";

          if (
            winner === "bob" &&
            bobRounds + 1 >= 2
          ) {
            enterFinisherState();
          } else {
            endRound(winner);
          }

          return;
        }

        update();
      }, 1000);
    }

    function resetFighters() {
      bob.className = "fighter bob";
      flytrap.className = "fighter flytrap";

      bob.style.opacity = "1";
      bob.style.transform = "";

      flytrap.style.opacity = "1";
      flytrap.style.transform = "";
    }

    function startRound() {
      clearInterval(timerInterval);

      bobHealth = 100;
      flyHealth = 100;

      bobPower = 0;
      flyPower = 0;

      time = 60;

      active = false;
      locked = true;

      bobBlocking = false;
      dodging = false;

      finisherReady = false;
      finisherRunning = false;

      directionSequence = [];
      lastDirection = "";

      announcement.classList.remove(
        "finish",
        "show"
      );

      finisherDarkness.classList.remove("show");
      victoryScreen.classList.remove("show");

      resetFighters();

      restartButton.classList.remove("show");

      update();

      announce("ROUND " + currentRound);

      window.setTimeout(() => {
        announce("FIGHT!");
      }, 900);

      window.setTimeout(() => {
        active = true;
        locked = false;

        update();
        startTimer();

        setMessage("Bob’s turn.");
      }, 1750);
    }

    function endRound(winner) {
      if (!active) {
        return;
      }

      active = false;
      locked = true;

      clearInterval(timerInterval);

      if (winner === "bob") {
        bobRounds += 1;

        flytrap.classList.add("defeated");

        announce("BOB WINS");

        setMessage(
          "Round won. Flytrap will return with fewer manners."
        );
      } else {
        flyRounds += 1;

        bob.classList.add("defeated");

        announce("FLYTRAP WINS");

        setMessage(
          "Bob has been temporarily composted."
        );
      }

      update();

      window.setTimeout(() => {
        if (flyRounds >= 2) {
          restartButton.classList.add("show");

          announce("GAME OVER");

          setMessage(
            "Insert another quarter to fight again."
          );
        } else {
          currentRound += 1;
          startRound();
        }
      }, 2100);
    }

    function restart() {
      bobRounds = 0;
      flyRounds = 0;

      currentRound = 1;

      victoryScreen.classList.remove("show");

      resetFighters();
      startRound();
    }

    moveButtons.forEach((button) => {
      button.addEventListener("click", () => {
        playerMove(button.dataset.move);
      });
    });

    specialButton.addEventListener(
      "click",
      performRazorAloe
    );

    restartButton.addEventListener(
      "click",
      restart
    );

    startButton.addEventListener(
      "click",
      () => {
        startScreen.classList.add("hidden");
        window.setTimeout(startRound, 350);
      }
    );

    window.addEventListener("message", event => {
      const data = event.data;

      if (
        !data ||
        data.game !== "mortal-komplant"
      ) {
        return;
      }

      if (data.type === "move") {
        playerMove(data.move);
      }

      if (data.type === "joystick") {
        joystick(data.direction);
      }

      if (data.type === "start") {
        if (
          !startScreen.classList.contains("hidden")
        ) {
          startButton.click();
        } else if (
          restartButton.classList.contains("show")
        ) {
          restart();
        }
      }
    });

    window.arcadeInput = {
      move: playerMove,
      joystick,

      start() {
        if (
          !startScreen.classList.contains("hidden")
        ) {
          startButton.click();
        } else if (
          restartButton.classList.contains("show")
        ) {
          restart();
        }
      }
    };

    update();
  </script>

</body>
</html>
