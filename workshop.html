<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Studio LaDuke Workshop</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    body {
      min-height: 100svh;
      font-family: Georgia, serif;
    }

    .workshop {
      position: fixed;
      inset: 0;

      background-image:
        url("E674C7F8-34A1-435B-96E5-B39170A6D49E.png");

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .back-home {
      position: fixed;
      left: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      z-index: 20;

      padding: 12px 17px;

      color: #f6dfaf;
      background: rgba(14, 12, 10, 0.82);

      border: 1px solid rgba(224, 181, 102, 0.75);
      border-radius: 8px;

      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.04em;

      box-shadow:
        0 0 16px rgba(220, 169, 75, 0.25),
        0 4px 14px rgba(0, 0, 0, 0.5);

      -webkit-tap-highlight-color: transparent;
    }

    .back-home:active {
      transform: scale(0.97);
    }

    @media (max-width: 650px) {
      .workshop {
        /*
          The source image is wide, so the phone shows
          the center of the room without empty black space.
        */
        background-position: 48% center;
      }

      .back-home {
        left: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom));
        padding: 11px 14px;
        font-size: 0.82rem;
      }
    }
  </style>
</head>

<body>
  <main
    class="workshop"
    aria-label="Studio LaDuke creative workshop"
  ></main>

  <a class="back-home" href="index.html">
    ← Front Room
  </a>
</body>
</html>
