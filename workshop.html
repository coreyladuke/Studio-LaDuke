<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >
  <title>Studio LaDuke Workshop</title>

  <style>
    :root {
      --gold: #d5a752;
      --cream: #f5dfb2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050504;
    }

    body {
      min-height: 100svh;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      overscroll-behavior: none;
    }

    button,
    a {
      color: inherit;
      font: inherit;
    }

    button {
      appearance: none;
    }

    .background-fill {
      position: fixed;
      inset: -35px;
      z-index: 0;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.4),
          rgba(0, 0, 0, 0.64)
        ),
        url("7B84A8A4-56B8-4572-ABA7-FA9FFD983B3F.png")
        center / cover no-repeat;

      filter: blur(22px) brightness(0.46);
      transform: scale(1.09);
    }

    .scene-viewport {
      position: fixed;
      inset: 0;
      z-index: 1;

      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }

    .scene-viewport.dragging {
      cursor: grabbing;
    }

    .workshop {
      position: absolute;
      left: 50%;
      top: 50%;

      width: min(100vw, calc(100svh * 1170 / 844));
      height: min(100svh, calc(100vw * 844 / 1170));

      aspect-ratio: 1170 / 844;
      overflow: hidden;

      background:
        url("7B84A8A4-56B8-4572-ABA7-FA9FFD983B3F.png")
        center / 100% 100% no-repeat;

      box-shadow:
        0 0 55px rgba(0, 0, 0, 0.92);

      transform:
        translate(-50%, -50%)
        translateX(var(--room-x, 0px));

      will-change: transform;
      user-select: none;
    }

    @media (max-width: 700px) and (orientation: portrait) {
      .workshop {
        width: calc(100svh * 1170 / 844);
        height: 100svh;
        max-width: none;
        max-height: none;
      }
    }

    @media (max-height: 600px) and (orientation: landscape) {
      .workshop {
        width: 100vw;
        height: calc(100vw * 844 / 1170);
      }
    }

    /* REAL ARTWORK */

    /* ARTWORK — mapped to the actual blank frame interiors in the room image */
    /* ARTWORK — black mats plus real perspective mapping for the angled wall. */
    .art-frame {
      position: absolute;
      z-index: 8;
      display: block;
      overflow: hidden;
      padding: 0;
      border: 0;
      border-radius: 1px;
      background: #080706;
      cursor: pointer;
      isolation: isolate;
      transform-origin: center;
      box-shadow:
        inset 0 0 8px rgba(0,0,0,.52),
        0 2px 7px rgba(0,0,0,.18);
    }

    .art-frame::before { content: none; }

    .art-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(118deg,rgba(255,232,184,.055),transparent 28%,transparent 74%,rgba(0,0,0,.17));
      box-shadow: inset 0 0 7px rgba(0,0,0,.30);
    }

    .art-frame img {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      padding: clamp(2px,.18vw,4px);
      background: #080706;
      pointer-events: none;
      filter: brightness(.97) contrast(1.04) saturate(1.03);
      transform-origin: 0 0;
      transition: filter 160ms ease;
      backface-visibility: hidden;
    }

    .art-frame:hover img,
    .art-frame:focus-visible img {
      filter: brightness(1.035) contrast(1.055) saturate(1.07);
    }

    .art-frame:focus-visible {
      outline: 2px solid rgba(255,213,119,.88);
      outline-offset: 3px;
    }

    /* The three flatter/front-facing frames already looked good. */
    .frame-1 { left:5.45%; top:8.45%; width:7.65%; height:9.35%; transform:rotate(-.18deg); }
    .frame-2 { left:19.55%; top:11.85%; width:9.95%; height:6.35%; transform:rotate(.12deg); }
    .frame-3 { left:50.45%; top:11.25%; width:8.70%; height:15.80%; transform:rotate(-.10deg); }

    /*
      Right wall: these boxes are the exact bounding boxes of the photographed
      frame interiors.  The IMG element inside each box is projectively warped
      in JS, so the artwork itself follows the wall perspective instead of
      merely being clipped into an angled shape.
    */
    .frame-4 {
      left:74.5299%; top:12.4408%; width:6.0684%; height:13.1517%;
      clip-path:polygon(0% 16.22%,100% 0%,100% 98.20%,0% 100%);
    }
    .frame-5 {
      left:83.0769%; top:18.6019%; width:3.0769%; height:13.8626%;
      clip-path:polygon(0% 3.42%,100% 0%,100% 100%,0% 98.29%);
    }
    .frame-6 {
      left:88.0342%; top:17.5355%; width:3.6752%; height:15.4028%;
      clip-path:polygon(0% 4.62%,100% 0%,100% 100%,0% 98.46%);
    }
    .frame-7 {
      left:93.8462%; top:16.3507%; width:4.5299%; height:17.1801%;
      clip-path:polygon(1.89% 4.14%,100% 0%,98.11% 100%,0% 97.93%);
    }
    .frame-8 {
      left:85.8974%; top:35.9005%; width:5.2991%; height:8.6493%;
      clip-path:polygon(0% 0%,100% 9.59%,100% 100%,0% 80.82%);
    }
    .frame-9 {
      left:92.9060%; top:37.0853%; width:5.3846%; height:9.7156%;
      clip-path:polygon(0% 0%,100% 8.54%,100% 100%,0% 82.93%);
    }

    /* Easel canvas, also projectively warped rather than just rotated. */
    .frame-10 {
      left:66.6667%; top:27.4882%; width:9.8291%; height:19.7867%;
      clip-path:polygon(9.57% 0%,100% 0%,83.48% 100%,0% 92.22%);
      background:#080706;
    }

    /* HOTSPOTS */

    .hotspot {
      position: absolute;
      z-index: 12;

      display: block;

      border: 0;
      background: transparent;
      cursor: pointer;
      text-decoration: none;
    }

    .hotspot::after {
      content: "";

      position: absolute;
      inset: 4%;

      border: 2px solid transparent;
      border-radius: 8px;

      transition:
        border-color 160ms ease,
        background 160ms ease,
        box-shadow 160ms ease;
    }

    .hotspot:hover::after,
    .hotspot:focus-visible::after {
      border-color:
        rgba(189, 255, 103, 0.7);

      background:
        radial-gradient(
          circle at center,
          rgba(124, 255, 77, 0.1),
          transparent 65%
        );

      box-shadow:
        0 0 18px rgba(95, 255, 65, 0.28);
    }

    /* ATTIC PULL — the doorway into Maverick's Fort. */
    .fort-entry {
      position: absolute;
      left: 41.1%;
      top: 0;
      z-index: 36;

      width: 8.2%;
      height: 23%;

      display: block;
      color: #f6dfab;
      text-decoration: none;
      cursor: pointer;
    }

    .fort-hatch {
      position: absolute;
      left: -25%;
      top: -1%;
      width: 150%;
      height: 20%;

      border: 1px solid rgba(224, 184, 111, 0.52);
      border-top: 0;
      border-radius: 0 0 7px 7px;

      background:
        linear-gradient(
          to bottom,
          rgba(31, 21, 15, 0.96),
          rgba(83, 53, 31, 0.96)
        );

      box-shadow:
        inset 0 -4px 8px rgba(0, 0, 0, 0.48),
        0 4px 11px rgba(0, 0, 0, 0.5);

      transition:
        box-shadow 180ms ease,
        filter 180ms ease;
    }

    .fort-rope {
      position: absolute;
      left: 50%;
      top: 15%;

      width: 2px;
      height: 49%;

      background:
        linear-gradient(
          to right,
          #5e4327,
          #d1a15b 48%,
          #5a3d23
        );

      box-shadow:
        0 0 4px rgba(255, 205, 105, 0.34);

      transform-origin: top center;
      transition: transform 180ms ease;
    }

    .fort-rope::before {
      content: "";

      position: absolute;
      left: 50%;
      top: -4px;

      width: 7px;
      height: 7px;

      border: 2px solid #977045;
      border-radius: 50%;
      background: #24170f;

      transform: translateX(-50%);
    }

    .fort-handle {
      position: absolute;
      left: 50%;
      top: 59%;

      min-width: 70px;
      padding: 5px 8px;

      color: #fff1c9;
      background:
        linear-gradient(
          to bottom,
          #80552e,
          #4c2d18
        );

      border: 1px solid rgba(248, 208, 127, 0.7);
      border-radius: 5px;

      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.58),
        0 0 10px rgba(255, 193, 75, 0.14);

      text-align: center;
      white-space: nowrap;
      font-family: Arial, sans-serif;
      font-size: clamp(8px, 0.72vw, 11px);
      font-weight: 900;
      letter-spacing: 0.08em;
      line-height: 1.1;

      transform: translateX(-50%) rotate(-2deg);
      transform-origin: top center;
      animation: fortHandleSway 3.2s ease-in-out infinite;
      transition:
        background 180ms ease,
        box-shadow 180ms ease;
    }

    .fort-entry:hover .fort-hatch,
    .fort-entry:focus-visible .fort-hatch {
      filter: brightness(1.18);
      box-shadow:
        inset 0 -4px 8px rgba(0, 0, 0, 0.4),
        0 5px 15px rgba(0, 0, 0, 0.52),
        0 0 17px rgba(255, 194, 79, 0.35);
    }

    .fort-entry:hover .fort-rope,
    .fort-entry:focus-visible .fort-rope {
      transform: scaleY(1.05);
    }

    .fort-entry:hover .fort-handle,
    .fort-entry:focus-visible .fort-handle {
      background:
        linear-gradient(
          to bottom,
          #a36a36,
          #5f371c
        );

      box-shadow:
        0 5px 12px rgba(0, 0, 0, 0.62),
        0 0 15px rgba(255, 202, 89, 0.42);
    }

    .fort-entry:focus-visible {
      outline: 2px solid rgba(255, 220, 142, 0.94);
      outline-offset: 3px;
      border-radius: 6px;
    }

    .fort-entry:active .fort-rope {
      transform: scaleY(1.12);
    }

    .fort-entry:active .fort-handle {
      animation: none;
      transform: translateX(-50%) translateY(8px) rotate(2deg);
    }

    @keyframes fortHandleSway {
      0%,
      100% {
        transform: translateX(-50%) rotate(-2deg);
      }

      50% {
        transform: translateX(-50%) rotate(2deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .fort-handle {
        animation: none;
      }
    }

    .arcade-hotspot {
      left: 59.65%;
      top: 26.4%;
      width: 8.3%;
      height: 25.8%;
    }

    .pool-hotspot {
      left: 0%;
      top: 46.5%;
      width: 31.8%;
      height: 28.5%;
    }

    .sewing-hotspot {
      left: 68.8%;
      top: 47.6%;
      width: 31.2%;
      height: 27.0%;
    }

    .dog-hotspot {
      left: 7.0%;
      top: 69.5%;
      width: 25.0%;
      height: 26.0%;
    }

    .forest-hotspot {
      left: 4.0%;
      top: 16.5%;
      width: 12.8%;
      height: 32.0%;
    }

    /* WALL STEREO */
    .stereo-hotspot {
      left: 18.2%;
      top: 17.5%;
      width: 12.4%;
      height: 10.0%;
    }

    .stereo-hotspot::before {
      content: "";
      position: absolute;
      inset: 4% 2%;
      z-index: -1;
      border-radius: 10px;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(
          ellipse at center,
          rgba(255, 190, 70, 0.34),
          rgba(255, 145, 35, 0.14) 48%,
          transparent 74%
        );
      filter: blur(7px);
      transition: opacity 220ms ease;
    }

    .stereo-hotspot.is-playing::before {
      opacity: 0.9;
      animation: stereoPulse 2.4s ease-in-out infinite;
    }

    @keyframes stereoPulse {
      0%,
      100% {
        opacity: 0.46;
        transform: scale(0.96);
      }

      50% {
        opacity: 0.98;
        transform: scale(1.04);
      }
    }

    /* Appears only after the wall stereo has been used. */
    .stereo-controls {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: calc(14px + env(safe-area-inset-right));
      bottom: auto;
      z-index: 165;
      width: min(330px, calc(100vw - 92px));
      min-height: 48px;
      padding: 6px 7px 6px 11px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #f4e3bf;
      background: rgba(14,11,8,.84);
      border: 1px solid rgba(225,183,100,.48);
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(0,0,0,.42);
      backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-7px);
      transition: opacity 180ms ease,transform 180ms ease,visibility 180ms ease;
    }
    .stereo-controls.show { opacity:1; visibility:visible; transform:translateY(0); }
    .stereo-now-playing {
      min-width:0; flex:1 1 auto; overflow:hidden; margin:0;
      white-space:nowrap; text-overflow:ellipsis;
      font-family:Arial,sans-serif; font-size:.72rem;
      color:rgba(246,226,190,.9);
    }
    .stereo-buttons { flex:0 0 auto; display:flex; align-items:center; gap:4px; }
    .stereo-control {
      width:36px; height:36px; min-height:36px; padding:0;
      display:grid; place-items:center;
      border:1px solid rgba(225,183,100,.30);
      border-radius:50%;
      color:#f5dfb2; background:rgba(255,255,255,.035);
      cursor:pointer; font-family:Arial,sans-serif; font-size:.85rem; line-height:1;
    }
    .stereo-control:hover,.stereo-control:focus-visible {
      background:rgba(213,167,82,.14);
      border-color:rgba(225,183,100,.68);
    }

    @media (max-width: 700px) and (orientation: portrait) {
      .stereo-controls {
        left: 50%;
        right: auto;
        bottom: calc(72px + env(safe-area-inset-bottom));
        transform: translate(-50%, 8px);
      }

      .stereo-controls.show {
        transform: translate(-50%, 0);
      }
    }

    /* A quiet arcade glow so the machine feels alive without
       turning the room into a neon sign. */
    .arcade-hotspot::before {
      content: "";
      position: absolute;
      inset: 10% 12%;
      z-index: -1;
      border-radius: 18%;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 50% 46%,
          rgba(166, 255, 92, 0.34) 0%,
          rgba(111, 239, 66, 0.18) 34%,
          rgba(69, 196, 52, 0.06) 58%,
          transparent 76%
        );
      filter: blur(8px);
      opacity: 0.62;
      transform: scale(0.94);
      animation: arcadePulse 3.1s ease-in-out infinite;
    }

    .arcade-hotspot:hover::before,
    .arcade-hotspot:focus-visible::before {
      opacity: 0.95;
    }

    @keyframes arcadePulse {
      0%,
      100% {
        opacity: 0.42;
        transform: scale(0.92);
      }

      50% {
        opacity: 0.78;
        transform: scale(1.035);
      }
    }

    /* FIN FETCH — side-view running sprite plus a pixel-aligned empty-bed patch. */
    .fin-bed-patch {
      position:absolute;
      left:7.6923%;
      top:71.0900%;
      width:25.2137%;
      height:27.8436%;
      z-index:26;
      display:block;
      opacity:0;
      pointer-events:none;
      border-radius:50%;
      background:
        radial-gradient(
          ellipse at 50% 54%,
          #211a16 0 50%,
          #342923 51% 65%,
          #181310 66% 72%,
          transparent 73%
        );
      filter:drop-shadow(0 7px 5px rgba(0,0,0,.36));
      transition:opacity 70ms linear;
    }
    .fin-bed-patch.show { opacity:1; }

    .fin-runner {
      position:absolute;
      left:15.4%;
      top:72.4%;
      width:12.8%;
      height:auto;
      z-index:31;
      pointer-events:none;
      opacity:0;
      overflow:visible;
      transform-origin:50% 75%;
      filter:drop-shadow(0 5px 5px rgba(0,0,0,.46));
    }

    .fin-runner.run {
      animation:finRunAcrossRoom 1050ms cubic-bezier(.18,.67,.2,1) forwards;
    }

    /* Legs deliberately cycle out of phase so he reads as RUNNING, not levitating. */
    .fin-runner.run .fin-leg-a,
    .fin-runner.run .fin-leg-c {
      animation:finLegA 105ms ease-in-out infinite alternate;
      transform-origin:50% 10%;
    }
    .fin-runner.run .fin-leg-b,
    .fin-runner.run .fin-leg-d {
      animation:finLegB 105ms ease-in-out infinite alternate;
      transform-origin:50% 10%;
    }
    .fin-runner.run .fin-tail {
      animation:finTail 95ms ease-in-out infinite alternate;
      transform-origin:160px 49px;
    }
    .fin-runner.run .fin-ear {
      animation:finEar 120ms ease-in-out infinite alternate;
      transform-origin:58px 28px;
    }

    @keyframes finLegA { from{transform:rotate(24deg)} to{transform:rotate(-30deg)} }
    @keyframes finLegB { from{transform:rotate(-28deg)} to{transform:rotate(26deg)} }
    @keyframes finTail { from{transform:rotate(-7deg)} to{transform:rotate(12deg)} }
    @keyframes finEar { from{transform:rotate(-4deg)} to{transform:rotate(12deg)} }

    @keyframes finRunAcrossRoom {
      0% {
        left:15.4%; top:72.4%;
        opacity:0;
        transform:translate(0,0) rotate(-7deg) scale(1.02);
      }
      7% { opacity:1; }
      26% {
        left:12.8%; top:66.2%;
        opacity:1;
        transform:rotate(-10deg) scale(.94);
      }
      53% {
        left:9.1%; top:55.0%;
        opacity:1;
        transform:rotate(-13deg) scale(.78);
      }
      78% {
        left:6.0%; top:42.2%;
        opacity:1;
        transform:rotate(-16deg) scale(.58);
      }
      100% {
        left:4.4%; top:31.0%;
        opacity:0;
        transform:rotate(-18deg) scale(.34);
      }
    }

    .thrown-ball {
      position:absolute;
      left:25.2%;
      top:83.0%;
      z-index:32;
      width:clamp(8px,.85vw,14px);
      aspect-ratio:1;
      border-radius:50%;
      pointer-events:none;
      opacity:0;
      background:
        radial-gradient(circle at 34% 30%,
          #f4ff92 0 18%,#c9df37 32%,#8fa520 72%,#65730f 100%);
      box-shadow:0 2px 5px rgba(0,0,0,.55),0 0 7px rgba(214,255,79,.25);
    }
    .thrown-ball.fly {
      animation:throwBall 820ms cubic-bezier(.2,.72,.25,1) forwards;
    }

    @keyframes throwBall {
      0% { left:25.2%; top:83%; opacity:0; transform:scale(.65) rotate(0deg); }
      8% { opacity:1; }
      44% { left:14.7%; top:51%; opacity:1; transform:scale(.92) rotate(300deg); }
      76% { left:8.1%; top:32%; opacity:1; transform:scale(.62) rotate(540deg); }
      100% { left:5.0%; top:24.5%; opacity:0; transform:scale(.35) rotate(760deg); }
    }

    /* ROOM DOTS */

    .room-indicator {
      position: fixed;
      left: 50%;
      bottom:
        calc(15px + env(safe-area-inset-bottom));
      z-index: 45;

      display: none;
      gap: 7px;

      transform: translateX(-50%);

      padding: 7px 10px;

      background: rgba(10, 8, 6, 0.72);
      border:
        1px solid rgba(225, 183, 100, 0.3);
      border-radius: 999px;

      pointer-events: none;
      backdrop-filter: blur(5px);
    }

    .room-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;
      background: rgba(245, 223, 178, 0.3);

      transition:
        background 130ms ease,
        transform 130ms ease;
    }

    .room-dot.active {
      background: #e1b85f;
      transform: scale(1.2);
    }

    @media (max-width: 700px) and (orientation: portrait) {
      .room-indicator {
        display: flex;
      }
    }

    /* TOAST */

    .toast {
      position: fixed;
      left: 50%;
      bottom:
        calc(55px + env(safe-area-inset-bottom));
      z-index: 150;

      transform:
        translateX(-50%)
        translateY(18px);

      width: max-content;
      max-width: calc(100vw - 40px);

      padding: 10px 15px;

      color: #f6e6c4;
      background: rgba(18, 14, 10, 0.94);

      border:
        1px solid rgba(225, 183, 100, 0.58);
      border-radius: 7px;

      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 0.82rem;

      opacity: 0;
      visibility: hidden;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.48);

      transition:
        opacity 180ms ease,
        transform 180ms ease,
        visibility 180ms ease;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;

      transform:
        translateX(-50%)
        translateY(0);
    }

    /* MENU */

    .menu-button {
      position: fixed;
      top:
        calc(13px + env(safe-area-inset-top));
      left:
        calc(13px + env(safe-area-inset-left));
      z-index: 90;

      width: 50px;
      height: 50px;

      display: grid;
      place-items: center;

      color: var(--cream);
      background: rgba(12, 10, 8, 0.88);

      border:
        1px solid rgba(224, 181, 102, 0.7);
      border-radius: 9px;

      cursor: pointer;

      box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.55);

      backdrop-filter: blur(8px);
    }

    .menu-lines,
    .menu-lines::before,
    .menu-lines::after {
      width: 23px;
      height: 2px;

      background: currentColor;
      border-radius: 99px;

      transition:
        transform 180ms ease,
        opacity 180ms ease;
    }

    .menu-lines {
      position: relative;
    }

    .menu-lines::before,
    .menu-lines::after {
      content: "";
      position: absolute;
      left: 0;
    }

    .menu-lines::before {
      top: -8px;
    }

    .menu-lines::after {
      top: 8px;

      background: transparent;

      transform: rotate(45deg);

      top: 0;
      transform: rotate(-45deg);

    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;

      background: rgba(0, 0, 0, 0.64);

      opacity: 0;
      visibility: hidden;

      backdrop-filter: blur(5px);

      transition:
        opacity 200ms ease,
        visibility 200ms ease;

    .menu-overlay.open {
      opacity: 1;
      visibility: visible;

    .menu-panel {
      position: fixed;
      top: 0;
      left: 0;

      bottom:
        calc(15px + env(safe-area-inset-bottom));

    function shuffle(items) {
      const copy = [...items];

      for (
        let index = copy.length - 1;
        index > 0;
        index -= 1
      ) {
        const randomIndex =
          Math.floor(
            Math.random() * (index + 1)
          );

        [copy[index], copy[randomIndex]] =
          [copy[randomIndex], copy[index]];
      }

      return copy;
    }

    function getImageShape(width, height) {
      const ratio = width / height;

      if (ratio > 1.18) {
        return "landscape";
      }

      if (ratio < 0.84) {
        return "portrait";
      }

      return "square";
    }

    function inspectArtwork(filename) {
      return new Promise(resolve => {
        const image = new Image();

        image.onload = () => {
          resolve({
            filename,
            width: image.naturalWidth,
            height: image.naturalHeight,
            shape: getImageShape(
              image.naturalWidth,
              image.naturalHeight
            )
          });
        };

        image.onerror = () => {
          resolve(null);
        };

        image.src = filename;
      });
    }

    async function loadArtworkData() {
      artworkData =
        (await Promise.all(
          artworkFiles.map(inspectArtwork)
        )).filter(Boolean);

      populateFrames();
      window.requestAnimationFrame(applyAllPerspectiveFrames);

    function findBestArtwork(
      desiredShape,
      available
    ) {
      const exactMatches =
        available.filter(
          item =>
            item.shape === desiredShape
        );

      if (exactMatches.length > 0) {
        return shuffle(exactMatches)[0];
      }

      const squareMatches =
        available.filter(
          item =>
            item.shape === "square"
        );

      if (squareMatches.length > 0) {
        return shuffle(squareMatches)[0];
      }

      return available.length ? shuffle(available)[0] : null;
    }

    function populateFrames() {
      let available =
        shuffle(artworkData);

      frames.forEach((frame, index) => {
        if (available.length === 0) {
          available =
            shuffle(artworkData);
        }

        const selected =
          findBestArtwork(
            frame.dataset.frameShape,
            available
          );

        const image =
          frame.querySelector("img");

        if (!selected) {
          frame.style.display = "none";
          return;
        }

        available =
          available.filter(
            item =>
              item.filename !== selected.filename
          );

        image.addEventListener(
          "load",
          () => applyPerspectiveToFrame(frame),
          { once: true }
        );

        image.src =
          selected.filename;

        image.alt =
          "Studio LaDuke artwork " +
          (index + 1);

        frame.dataset.filename =
          selected.filename;

        frame.onclick = event => {
          if (pointerTravel > 8) {
            event.preventDefault();
            return;
          }

          openViewer(
            selected.filename
          );
        };
      });
    }


    /*
      Projective image warp.  CSS clip-path alone only trims a rectangle;
      this matrix actually bends the artwork itself into the four photographed
      corners, which is what makes the angled right wall read correctly.
    */
    const perspectiveFrameQuads = {
      "frame-4": [[0,18],[71,0],[71,109],[0,111]],
      "frame-5": [[0,4],[36,0],[36,117],[0,115]],
      "frame-6": [[0,6],[43,0],[43,130],[0,128]],
      "frame-7": [[1,6],[53,0],[52,145],[0,142]],
      "frame-8": [[0,0],[62,7],[62,73],[0,59]],
      "frame-9": [[0,0],[63,7],[63,82],[0,68]],
      "frame-10": [[11,0],[115,0],[96,167],[0,154]]
    };

    const perspectiveFrameSourceSizes = {
      "frame-4": [71,111],
      "frame-5": [36,117],
      "frame-6": [43,130],
      "frame-7": [53,145],
      "frame-8": [62,73],
      "frame-9": [63,82],
      "frame-10": [115,167]
    };

    function solveLinearSystem(matrix, values) {
      const n = values.length;
      const a = matrix.map((row, i) => [...row, values[i]]);

      for (let col = 0; col < n; col += 1) {
        let pivot = col;
        for (let row = col + 1; row < n; row += 1) {
          if (Math.abs(a[row][col]) > Math.abs(a[pivot][col])) pivot = row;
        }
        if (Math.abs(a[pivot][col]) < 1e-10) return null;
        [a[col], a[pivot]] = [a[pivot], a[col]];

        const divisor = a[col][col];
        for (let j = col; j <= n; j += 1) a[col][j] /= divisor;

        for (let row = 0; row < n; row += 1) {
          if (row === col) continue;
          const factor = a[row][col];
          for (let j = col; j <= n; j += 1) a[row][j] -= factor * a[col][j];
        }
      }
      return a.map(row => row[n]);
    }

    function homographyForRectangle(width, height, points) {
      const source = [[0,0],[width,0],[width,height],[0,height]];
      const matrix = [];
      const values = [];

      for (let i = 0; i < 4; i += 1) {
        const [x,y] = source[i];
        const [u,v] = points[i];
        matrix.push([x,y,1,0,0,0,-u*x,-u*y]);
        values.push(u);
        matrix.push([0,0,0,x,y,1,-v*x,-v*y]);
        values.push(v);
      }
      return solveLinearSystem(matrix, values);
    }

    function applyPerspectiveToFrame(frame) {
      const className = Object.keys(perspectiveFrameQuads).find(name => frame.classList.contains(name));
      if (!className) return;

      const image = frame.querySelector("img");
      if (!image) return;

      const rect = frame.getBoundingClientRect();
      if (rect.width < 1 || rect.height < 1) return;

      const [sourceW, sourceH] = perspectiveFrameSourceSizes[className];
      const raw = perspectiveFrameQuads[className];
      const points = raw.map(([x,y]) => [x / sourceW * rect.width, y / sourceH * rect.height]);
      const h = homographyForRectangle(rect.width, rect.height, points);
      if (!h) return;

      const [a,b,c,d,e,f,g,k] = h;
      image.style.transform = `matrix3d(${a},${d},0,${g},${b},${e},0,${k},0,0,1,0,${c},${f},0,1)`;
    }

    function applyAllPerspectiveFrames() {
      frames.forEach(applyPerspectiveToFrame);
    }

    function calculateRoomBounds() {
      const roomRect =
        workshop.getBoundingClientRect();

      const overflow =
        Math.max(
          0,
          roomRect.width -
          window.innerWidth
        );

      minRoomX =
        -(overflow / 2);

      maxRoomX =
        overflow / 2;

      roomX =
        Math.max(
          minRoomX,
          Math.min(maxRoomX, roomX)
        );

      renderRoomPosition();
    }

    function renderRoomPosition() {
      workshop.style.setProperty(
        "--room-x",
        roomX + "px"
      );

      updateRoomIndicator();
    }

    function updateRoomIndicator() {
      const range =
        maxRoomX - minRoomX;

      let normalized = 0.5;

      if (range > 0) {
        normalized =
          (roomX - minRoomX) / range;
      }

      roomDotLeft.classList.toggle(
        "active",
        normalized > 0.68
      );

      roomDotCenter.classList.toggle(
        "active",
        normalized >= 0.32 &&
        normalized <= 0.68
      );

      roomDotRight.classList.toggle(
        "active",
        normalized < 0.32
      );
    }

    function beginRoomDrag(event) {
      if (
        viewer.classList.contains("open") ||
        menuPanel.classList.contains("open")
      ) {
        return;
      }

      /*
        Do not capture the pointer when the visitor is tapping an actual
        object. Pointer capture changes the click target to the room itself
        on some touch browsers, which made doors and buttons feel randomly
        unresponsive. Empty wall/floor space still pans normally.
      */
      if (
        event.target.closest(
          "a, button, input, select, textarea, [role='button']"
        )
      ) {
        pointerTravel = 0;
        return;
      }

      pointerActive = true;
      pointerId = event.pointerId;
      pointerStartX = event.clientX;
      roomStartX = roomX;
      pointerTravel = 0;

      sceneViewport.classList.add(
        "dragging"
      );

      sceneViewport.setPointerCapture(
        event.pointerId
      );
    }

    function moveRoom(event) {
      if (
        !pointerActive ||
        event.pointerId !== pointerId
      ) {
        return;
      }

      const distance =
        event.clientX - pointerStartX;

      pointerTravel =
        Math.max(
          pointerTravel,
          Math.abs(distance)
        );

      roomX =
        Math.max(
          minRoomX,
          Math.min(
            maxRoomX,
            roomStartX + distance
          )
        );

      renderRoomPosition();
    }

    function endRoomDrag(event) {
      if (
        !pointerActive ||
        (
          event &&
          event.pointerId !== pointerId
        )
      ) {
        return;
      }

      pointerActive = false;
      pointerId = null;

      sceneViewport.classList.remove(
        "dragging"
      );
    }

    function openViewer(filename) {
      activeArtworkIndex =
        artworkFiles.indexOf(filename);

      if (activeArtworkIndex < 0) {
        activeArtworkIndex = 0;
      }

      updateViewer();

      viewer.classList.add("open");
    }

    function closeViewer() {
      viewer.classList.remove("open");
    }

    function updateViewer() {
      const filename =
        artworkFiles[activeArtworkIndex];

      viewerImage.src =
        filename;

      viewerGallery.href =
        "gallery.html?art=" +
        encodeURIComponent(filename);
    }

    function showPreviousArtwork() {
      activeArtworkIndex =
        (
          activeArtworkIndex -
          1 +
          artworkFiles.length
        ) % artworkFiles.length;

      updateViewer();
    }

    function showNextArtwork() {
      activeArtworkIndex =
        (
          activeArtworkIndex +
          1
        ) % artworkFiles.length;

      updateViewer();
    }

    function openMenu() {
      menuButton.classList.add("open");
      menuPanel.classList.add("open");
      menuOverlay.classList.add("open");

      menuButton.setAttribute(
        "aria-expanded",
        "true"
      );
    }

    function closeMenu() {
      menuButton.classList.remove("open");
      menuPanel.classList.remove("open");
      menuOverlay.classList.remove("open");

      menuButton.setAttribute(
        "aria-expanded",
        "false"
      );
    }

    function toggleMenu() {
      if (
        menuPanel.classList.contains("open")
      ) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    function updateStereoDisplay() {
      const track = stereoPlaylist[stereoTrackIndex];

      stereoNowPlaying.textContent =
        track.title + " · " + track.artist;

      const playing = !workshopStereo.paused;

      stereoPlayPause.textContent =
        playing ? "Ⅱ" : "▶";

      stereoHotspot.classList.toggle(
        "is-playing",
        playing
      );
    }

    function loadStereoTrack(index, autoplay = false) {
      stereoTrackIndex =
        (
          index + stereoPlaylist.length
        ) % stereoPlaylist.length;

      const track = stereoPlaylist[stereoTrackIndex];

      workshopStereo.src = track.src;
      workshopStereo.load();
      updateStereoDisplay();

      if (autoplay) {
        const playAttempt = workshopStereo.play();

        if (playAttempt && typeof playAttempt.catch === "function") {
          playAttempt.catch(() => {
            updateStereoDisplay();
          });
        }
      }
    }

    function showStereoControls() {
      stereoControls.classList.add("show");
    }

    function toggleStereo() {
      showStereoControls();

      if (!stereoHasStarted) {
        stereoHasStarted = true;
        loadStereoTrack(stereoTrackIndex, true);
        showToast("The workshop stereo wakes up.");
        return;
      }

      if (workshopStereo.paused) {
        workshopStereo.play().catch(() => {});
      } else {
        workshopStereo.pause();
      }
    }

    function nextStereoTrack() {
      stereoHasStarted = true;
      showStereoControls();
      loadStereoTrack(stereoTrackIndex + 1, true);
    }

    function previousStereoTrack() {
      stereoHasStarted = true;
      showStereoControls();
      loadStereoTrack(stereoTrackIndex - 1, true);
    }

    function showToast(text) {
      window.clearTimeout(toastTimer);

      toast.textContent =
        text;

      toast.classList.add("show");

      toastTimer =
        window.setTimeout(() => {
          toast.classList.remove("show");
        }, 1800);
    }

    sceneViewport.addEventListener(
      "pointerdown",
      beginRoomDrag
    );

    sceneViewport.addEventListener(
      "pointermove",
      moveRoom
    );

    sceneViewport.addEventListener(
      "pointerup",
      endRoomDrag
    );

    sceneViewport.addEventListener(
      "pointercancel",
      endRoomDrag
    );

    sceneViewport.addEventListener(
      "lostpointercapture",
      () => endRoomDrag()
    );

    menuButton.addEventListener(
      "click",
      toggleMenu
    );

    menuOverlay.addEventListener(
      "click",
      closeMenu
    );

    viewerClose.addEventListener(
      "click",
      closeViewer
    );

    viewerPrevious.addEventListener(
      "click",
      showPreviousArtwork
    );

    viewerNext.addEventListener(
      "click",
      showNextArtwork
    );

    viewer.addEventListener(
      "click",
      event => {
        if (event.target === viewer) {
          closeViewer();
        }
      }
    );

    viewer.addEventListener(
      "touchstart",
      event => {
        viewerTouchStartX =
          event.changedTouches[0].screenX;
      },
      { passive: true }
    );

    viewer.addEventListener(
      "touchend",
      event => {
        const distance =
          event.changedTouches[0].screenX -
          viewerTouchStartX;

        if (Math.abs(distance) < 55) {
          return;
        }

        if (distance < 0) {
          showNextArtwork();
        } else {
          showPreviousArtwork();
        }
      },
      { passive: true }
    );

    document.addEventListener(
      "keydown",
      event => {
        if (event.key === "Escape") {
          if (
            viewer.classList.contains("open")
          ) {
            closeViewer();
          } else {
            closeMenu();
          }
        }

        if (
          event.key === "ArrowLeft" &&
          viewer.classList.contains("open")
        ) {
          showPreviousArtwork();
        }

        if (
          event.key === "ArrowRight" &&
          viewer.classList.contains("open")
        ) {
          showNextArtwork();
        }
      }
    );

    document
      .querySelectorAll(".menu-link")
      .forEach(link => {
        link.addEventListener(
          "click",
          closeMenu
        );
      });

    stereoHotspot.addEventListener(
      "click",
      () => {
        if (pointerTravel <= 8) {
          toggleStereo();
        }
      }
    );

    stereoPlayPause.addEventListener(
      "click",
      event => {
        event.stopPropagation();
        toggleStereo();
      }
    );

    stereoPrevious.addEventListener(
      "click",
      event => {
        event.stopPropagation();
        previousStereoTrack();
      }
    );

    stereoNext.addEventListener(
      "click",
      event => {
        event.stopPropagation();
        nextStereoTrack();
      }
    );

    workshopStereo.addEventListener(
      "play",
      updateStereoDisplay
    );

    workshopStereo.addEventListener(
      "pause",
      updateStereoDisplay
    );

    workshopStereo.addEventListener(
      "ended",
      nextStereoTrack
    );

    workshopStereo.addEventListener(
      "error",
      () => {
        showToast(
          "That track did not load. Trying the next one."
        );

        window.setTimeout(
          nextStereoTrack,
          550
        );
      }
    );

    document
      .getElementById("sewingHotspot")
      .addEventListener(
        "click",
        () => {
          if (pointerTravel <= 8) {
            showToast(
              "The upholstery room is coming soon."
            );
          }
        }
      );

    document
      .getElementById("dogHotspot")
      .addEventListener(
        "click",
        () => {
          if (pointerTravel <= 8) {
            if (finGone) {
              showToast("Fin is still outside conducting important tennis-ball business.");
              return;
            }

            finGone = true;

            thrownBall.classList.remove("fly");
            finRunner.classList.remove("run");
            void thrownBall.offsetWidth;
            void finRunner.offsetWidth;

            finBedPatch.classList.add("show");
            thrownBall.classList.add("fly");

            window.setTimeout(() => {
              finRunner.classList.add("run");
            }, 55);

            showToast("You throw the ball. Fin bolts after it.");

            document.getElementById("dogHotspot").style.pointerEvents = "none";
          }
        }
      );

    window.addEventListener(
      "resize",
      () => {
        calculateRoomBounds();
        window.requestAnimationFrame(applyAllPerspectiveFrames);
      }
    );

    window.addEventListener(
      "orientationchange",
      () => {
        window.setTimeout(
          () => {
            calculateRoomBounds();
            applyAllPerspectiveFrames();
          },
          250
        );
      }
    );

    loadArtworkData();
    loadStereoTrack(0, false);

    window.setTimeout(() => {
      try {
        if (!sessionStorage.getItem("workshopHintSeen")) {
          showToast(
            "Drag to look around. Tap what catches your eye."
          );
          sessionStorage.setItem(
            "workshopHintSeen",
            "1"
          );
        }
      } catch (error) {
        /* Storage can be blocked; the room still works fine. */
      }
    }, 850);

    window.setTimeout(() => {
      calculateRoomBounds();

      if (maxRoomX > 0) {
        roomX =
          Math.min(
            maxRoomX,
            maxRoomX * 0.2
          );

        renderRoomPosition();
      }
    }, 120);
  </script>

</body>
</html>
