<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >
  <title>Studio LaDuke Workshop</title>

  <style>
    :root {
      --gold: #d5a752;
      --cream: #f5dfb2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050504;
    }

    body {
      min-height: 100svh;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      overscroll-behavior: none;
    }

    button,
    a {
      color: inherit;
      font: inherit;
    }

    button {
      appearance: none;
    }

    .background-fill {
      position: fixed;
      inset: -35px;
      z-index: 0;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.4),
          rgba(0, 0, 0, 0.64)
        ),
        url("7B84A8A4-56B8-4572-ABA7-FA9FFD983B3F.png")
        center / cover no-repeat;

      filter: blur(22px) brightness(0.46);
      transform: scale(1.09);
    }

    .scene-viewport {
      position: fixed;
      inset: 0;
      z-index: 1;

      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }

    .scene-viewport.dragging {
      cursor: grabbing;
    }

    .workshop {
      position: absolute;
      left: 50%;
      top: 50%;

      width: min(100vw, calc(100svh * 1170 / 844));
      height: min(100svh, calc(100vw * 844 / 1170));

      aspect-ratio: 1170 / 844;
      overflow: hidden;

      background:
        url("7B84A8A4-56B8-4572-ABA7-FA9FFD983B3F.png")
        center / 100% 100% no-repeat;

      box-shadow:
        0 0 55px rgba(0, 0, 0, 0.92);

      transform:
        translate(-50%, -50%)
        translateX(var(--room-x, 0px));

      will-change: transform;
      user-select: none;
    }

    @media (max-width: 700px) and (orientation: portrait) {
      .workshop {
        width: calc(100svh * 1170 / 844);
        height: 100svh;
        max-width: none;
        max-height: none;
      }
    }

    @media (max-height: 600px) and (orientation: landscape) {
      .workshop {
        width: 100vw;
        height: calc(100vw * 844 / 1170);
      }
    }

    /* REAL ARTWORK */

    /* ARTWORK — mapped to the actual blank frame interiors in the room image */
    .art-frame {
      position: absolute;
      z-index: 8;
      display: block;
      overflow: hidden;
      padding: 0;
      border: 0;
      border-radius: 1px;
      background: #cbb895;
      cursor: pointer;
      isolation: isolate;
      transform-origin: center;
      box-shadow:
        inset 0 0 7px rgba(0,0,0,.28),
        0 2px 7px rgba(0,0,0,.18);
    }

    .art-frame::before { content: none; }

    .art-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(118deg,rgba(255,238,196,.08),transparent 30%,transparent 74%,rgba(0,0,0,.11));
      box-shadow: inset 0 0 5px rgba(0,0,0,.22);
    }

    .art-frame img {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      padding: 0;
      background: #cbb895;
      pointer-events: none;
      filter: brightness(.98) contrast(1.03) saturate(1.02);
      transition: filter 160ms ease, transform 160ms ease;
    }

    .art-frame:hover img,
    .art-frame:focus-visible img {
      filter: brightness(1.04) contrast(1.05) saturate(1.07);
      transform: scale(1.015);
    }

    .art-frame:focus-visible {
      outline: 2px solid rgba(255,213,119,.88);
      outline-offset: 3px;
    }

    /*
      Coordinates below are taken from the current 1170×844 workshop image,
      so the artwork sits inside the photographed frames instead of floating
      over the wall.
    */
    .frame-1 { left:5.45%; top:8.45%; width:7.65%; height:9.35%; transform:rotate(-.18deg); }
    .frame-2 { left:19.55%; top:11.85%; width:9.95%; height:6.35%; transform:rotate(.12deg); }
    .frame-3 { left:50.45%; top:11.25%; width:8.70%; height:15.80%; transform:rotate(-.10deg); }
    .frame-4 { left:74.45%; top:13.15%; width:6.95%; height:13.10%; transform:rotate(-.14deg); }

    .frame-5 { left:83.00%; top:17.85%; width:3.95%; height:15.00%; transform:rotate(-.20deg); }
    .frame-6 { left:87.70%; top:17.55%; width:4.80%; height:16.05%; transform:rotate(.10deg); }
    .frame-7 { left:94.00%; top:17.25%; width:4.65%; height:16.85%; transform:rotate(-.10deg); }

    .frame-8 { left:85.75%; top:36.15%; width:6.05%; height:10.00%; transform:rotate(.10deg); }
    .frame-9 { left:93.95%; top:35.85%; width:4.55%; height:11.10%; transform:rotate(-.10deg); }

    /* Easel canvas */
    .frame-10 {
      left:66.75%;
      top:26.65%;
      width:10.55%;
      height:21.15%;
      clip-path:polygon(5% 1%,100% 0%,94% 100%,0% 96%);
      transform:rotate(1.45deg);
      background:#cbb895;
    }

    .frame-10 img {
      transform:scale(1.02);
    }

    /* HOTSPOTS */

    .hotspot {
      position: absolute;
      z-index: 12;

      display: block;

      border: 0;
      background: transparent;
      cursor: pointer;
      text-decoration: none;
    }

    .hotspot::after {
      content: "";

      position: absolute;
      inset: 4%;

      border: 2px solid transparent;
      border-radius: 8px;

      transition:
        border-color 160ms ease,
        background 160ms ease,
        box-shadow 160ms ease;
    }

    .hotspot:hover::after,
    .hotspot:focus-visible::after {
      border-color:
        rgba(189, 255, 103, 0.7);

      background:
        radial-gradient(
          circle at center,
          rgba(124, 255, 77, 0.1),
          transparent 65%
        );

      box-shadow:
        0 0 18px rgba(95, 255, 65, 0.28);
    }

    .arcade-hotspot {
      left: 59.65%;
      top: 26.4%;
      width: 8.3%;
      height: 25.8%;
    }

    .pool-hotspot {
      left: 0%;
      top: 46.5%;
      width: 31.8%;
      height: 28.5%;
    }

    .sewing-hotspot {
      left: 68.8%;
      top: 47.6%;
      width: 31.2%;
      height: 27.0%;
    }

    .dog-hotspot {
      left: 7.0%;
      top: 69.5%;
      width: 25.0%;
      height: 26.0%;
    }

    .forest-hotspot {
      left: 4.0%;
      top: 16.5%;
      width: 12.8%;
      height: 32.0%;
    }

    /* WALL STEREO */
    .stereo-hotspot {
      left: 18.2%;
      top: 17.5%;
      width: 12.4%;
      height: 10.0%;
    }

    .stereo-hotspot::before {
      content: "";
      position: absolute;
      inset: 4% 2%;
      z-index: -1;
      border-radius: 10px;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(
          ellipse at center,
          rgba(255, 190, 70, 0.34),
          rgba(255, 145, 35, 0.14) 48%,
          transparent 74%
        );
      filter: blur(7px);
      transition: opacity 220ms ease;
    }

    .stereo-hotspot.is-playing::before {
      opacity: 0.9;
      animation: stereoPulse 2.4s ease-in-out infinite;
    }

    @keyframes stereoPulse {
      0%,
      100% {
        opacity: 0.46;
        transform: scale(0.96);
      }

      50% {
        opacity: 0.98;
        transform: scale(1.04);
      }
    }

    /* Appears only after the wall stereo has been used. */
    .stereo-controls {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: calc(14px + env(safe-area-inset-right));
      bottom: auto;
      z-index: 165;
      width: min(330px, calc(100vw - 92px));
      min-height: 48px;
      padding: 6px 7px 6px 11px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #f4e3bf;
      background: rgba(14,11,8,.84);
      border: 1px solid rgba(225,183,100,.48);
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(0,0,0,.42);
      backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-7px);
      transition: opacity 180ms ease,transform 180ms ease,visibility 180ms ease;
    }
    .stereo-controls.show { opacity:1; visibility:visible; transform:translateY(0); }
    .stereo-now-playing {
      min-width:0; flex:1 1 auto; overflow:hidden; margin:0;
      white-space:nowrap; text-overflow:ellipsis;
      font-family:Arial,sans-serif; font-size:.72rem;
      color:rgba(246,226,190,.9);
    }
    .stereo-buttons { flex:0 0 auto; display:flex; align-items:center; gap:4px; }
    .stereo-control {
      width:36px; height:36px; min-height:36px; padding:0;
      display:grid; place-items:center;
      border:1px solid rgba(225,183,100,.30);
      border-radius:50%;
      color:#f5dfb2; background:rgba(255,255,255,.035);
      cursor:pointer; font-family:Arial,sans-serif; font-size:.85rem; line-height:1;
    }
    .stereo-control:hover,.stereo-control:focus-visible {
      background:rgba(213,167,82,.14);
      border-color:rgba(225,183,100,.68);
    }

    @media (max-width: 700px) and (orientation: portrait) {
      .stereo-controls {
        left: 50%;
        right: auto;
        bottom: calc(72px + env(safe-area-inset-bottom));
        transform: translate(-50%, 8px);
      }

      .stereo-controls.show {
        transform: translate(-50%, 0);
      }
    }

    /* A quiet arcade glow so the machine feels alive without
       turning the room into a neon sign. */
    .arcade-hotspot::before {
      content: "";
      position: absolute;
      inset: 10% 12%;
      z-index: -1;
      border-radius: 18%;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 50% 46%,
          rgba(166, 255, 92, 0.34) 0%,
          rgba(111, 239, 66, 0.18) 34%,
          rgba(69, 196, 52, 0.06) 58%,
          transparent 76%
        );
      filter: blur(8px);
      opacity: 0.62;
      transform: scale(0.94);
      animation: arcadePulse 3.1s ease-in-out infinite;
    }

    .arcade-hotspot:hover::before,
    .arcade-hotspot:focus-visible::before {
      opacity: 0.95;
    }

    @keyframes arcadePulse {
      0%,
      100% {
        opacity: 0.42;
        transform: scale(0.92);
      }

      50% {
        opacity: 0.78;
        transform: scale(1.035);
      }
    }

    /* FIN FETCH — the original dog is baked into the background.
       A textured bed cover hides that baked-in dog while a cutout of Fin
       launches toward the open door. He stays gone until the page reloads. */
    .fin-bed-cover {
      position:absolute;
      left:11.0%;
      top:70.9%;
      width:20.2%;
      height:18.8%;
      z-index:26;
      pointer-events:none;
      opacity:0;
      border-radius:50%;
      background:
        radial-gradient(ellipse at 48% 44%,
          rgba(65,48,34,.98) 0 28%,
          rgba(79,57,40,.97) 31% 47%,
          rgba(48,34,26,.98) 52% 68%,
          rgba(24,19,16,.96) 74% 100%);
      box-shadow:
        inset 0 0 18px rgba(0,0,0,.6),
        0 5px 11px rgba(0,0,0,.18);
      filter:brightness(.76) saturate(.75);
      transform:rotate(-4deg) scale(.96,.72);
      transition:opacity 90ms linear;
    }
    .fin-bed-cover.show { opacity:1; }

    .fin-runner {
      position:absolute;
      left:14.10%;
      top:69.30%;
      width:14.10%;
      height:auto;
      z-index:29;
      pointer-events:none;
      opacity:0;
      transform-origin:55% 82%;
      filter:drop-shadow(0 5px 5px rgba(0,0,0,.45));
    }
    .fin-runner.run {
      animation:finRun 980ms cubic-bezier(.15,.7,.18,1) forwards;
    }

    @keyframes finRun {
      0% {
        left:14.1%; top:69.3%;
        opacity:1;
        transform:translate(0,0) rotate(0deg) scale(1);
      }
      18% {
        left:13.0%; top:64.5%;
        opacity:1;
        transform:rotate(-6deg) scale(.93,1.08);
      }
      46% {
        left:9.3%; top:51.5%;
        opacity:1;
        transform:rotate(-12deg) scale(.78,.88);
      }
      76% {
        left:6.1%; top:34.8%;
        opacity:1;
        transform:rotate(-16deg) scale(.54,.62);
      }
      100% {
        left:4.4%; top:25.4%;
        opacity:0;
        transform:rotate(-20deg) scale(.30,.38);
      }
    }

    .thrown-ball {
      position:absolute;
      left:25.2%;
      top:83.0%;
      z-index:30;
      width:clamp(8px,.85vw,14px);
      aspect-ratio:1;
      border-radius:50%;
      pointer-events:none;
      opacity:0;
      background:
        radial-gradient(circle at 34% 30%,
          #f4ff92 0 18%,#c9df37 32%,#8fa520 72%,#65730f 100%);
      box-shadow:0 2px 5px rgba(0,0,0,.55),0 0 7px rgba(214,255,79,.25);
    }
    .thrown-ball.fly {
      animation:throwBall 820ms cubic-bezier(.2,.72,.25,1) forwards;
    }

    @keyframes throwBall {
      0% { left:25.2%; top:83%; opacity:0; transform:scale(.65) rotate(0deg); }
      8% { opacity:1; }
      44% { left:14.7%; top:51%; opacity:1; transform:scale(.92) rotate(300deg); }
      76% { left:8.1%; top:32%; opacity:1; transform:scale(.62) rotate(540deg); }
      100% { left:5.0%; top:24.5%; opacity:0; transform:scale(.35) rotate(760deg); }
    }

    /* ROOM DOTS */

    .room-indicator {
      position: fixed;
      left: 50%;
      bottom:
        calc(15px + env(safe-area-inset-bottom));
      z-index: 45;

      display: none;
      gap: 7px;

      transform: translateX(-50%);

      padding: 7px 10px;

      background: rgba(10, 8, 6, 0.72);
      border:
        1px solid rgba(225, 183, 100, 0.3);
      border-radius: 999px;

      pointer-events: none;
      backdrop-filter: blur(5px);
    }

    .room-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;
      background: rgba(245, 223, 178, 0.3);

      transition:
        background 130ms ease,
        transform 130ms ease;
    }

    .room-dot.active {
      background: #e1b85f;
      transform: scale(1.2);
    }

    @media (max-width: 700px) and (orientation: portrait) {
      .room-indicator {
        display: flex;
      }
    }

    /* TOAST */

    .toast {
      position: fixed;
      left: 50%;
      bottom:
        calc(55px + env(safe-area-inset-bottom));
      z-index: 150;

      transform:
        translateX(-50%)
        translateY(18px);

      width: max-content;
      max-width: calc(100vw - 40px);

      padding: 10px 15px;

      color: #f6e6c4;
      background: rgba(18, 14, 10, 0.94);

      border:
        1px solid rgba(225, 183, 100, 0.58);
      border-radius: 7px;

      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 0.82rem;

      opacity: 0;
      visibility: hidden;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.48);

      transition:
        opacity 180ms ease,
        transform 180ms ease,
        visibility 180ms ease;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;

      transform:
        translateX(-50%)
        translateY(0);
    }

    /* MENU */

    .menu-button {
      position: fixed;
      top:
        calc(13px + env(safe-area-inset-top));
      left:
        calc(13px + env(safe-area-inset-left));
      z-index: 90;

      width: 50px;
      height: 50px;

      display: grid;
      place-items: center;

      color: var(--cream);
      background: rgba(12, 10, 8, 0.88);

      border:
        1px solid rgba(224, 181, 102, 0.7);
      border-radius: 9px;

      cursor: pointer;

      box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.55);

      backdrop-filter: blur(8px);
    }

    .menu-lines,
    .menu-lines::before,
    .menu-lines::after {
      width: 23px;
      height: 2px;

      background: currentColor;
      border-radius: 99px;

      transition:
        transform 180ms ease,
        opacity 180ms ease;
    }

    .menu-lines {
      position: relative;
    }

    .menu-lines::before,
    .menu-lines::after {
      content: "";
      position: absolute;
      left: 0;
    }

    .menu-lines::before {
      top: -8px;
    }

    .menu-lines::after {
      top: 8px;
    }

    .menu-button.open .menu-lines {
      background: transparent;
    }

    .menu-button.open .menu-lines::before {
      top: 0;
      transform: rotate(45deg);
    }

    .menu-button.open .menu-lines::after {
      top: 0;
      transform: rotate(-45deg);
    }

    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;

      background: rgba(0, 0, 0, 0.64);

      opacity: 0;
      visibility: hidden;

      backdrop-filter: blur(5px);

      transition:
        opacity 200ms ease,
        visibility 200ms ease;
    }

    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .menu-panel {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 80;

      width: min(84vw, 420px);

      padding:
        calc(88px + env(safe-area-inset-top))
        27px
        calc(28px + env(safe-area-inset-bottom));

      overflow-y: auto;

      background:
        linear-gradient(
          150deg,
          rgba(86, 45, 25, 0.99),
          rgba(34, 19, 13, 0.995)
        );

      border-right:
        1px solid rgba(220, 173, 91, 0.6);

      box-shadow:
        18px 0 45px rgba(0, 0, 0, 0.68);

      transform: translateX(-104%);

      transition: transform 240ms ease;
    }

    .menu-panel.open {
      transform: translateX(0);
    }

    .menu-title {
      margin-bottom: 8px;
      color: #f5dca6;
      font-size: clamp(1.8rem, 7vw, 2.6rem);
    }

    .menu-subtitle {
      margin-bottom: 26px;
      color: rgba(245, 225, 190, 0.7);
      line-height: 1.5;
      font-size: 0.91rem;
    }

    .menu-links {
      display: grid;
      gap: 11px;
    }

    .menu-link {
      display: block;

      padding: 14px 16px;

      color: #f5e4c4;
      background: rgba(255, 255, 255, 0.035);

      border:
        1px solid rgba(239, 202, 142, 0.22);
      border-radius: 7px;

      text-decoration: none;
      font-size: 1.02rem;
    }

    .gallery-link {
      color: #ffd887;

      border-color:
        rgba(231, 181, 84, 0.48);

      background:
        linear-gradient(
          90deg,
          rgba(125, 78, 27, 0.26),
          rgba(69, 38, 17, 0.16)
        );
    }

    .gallery-link::before {
      content: "🖼️";
      margin-right: 9px;
    }

    .arcade-link {
      color: #ceff8c;

      border-color:
        rgba(145, 213, 75, 0.42);

      background:
        linear-gradient(
          90deg,
          rgba(65, 120, 31, 0.2),
          rgba(28, 54, 15, 0.13)
        );
    }

    .arcade-link::before {
      content: "🎮";
      margin-right: 9px;
    }

    .menu-footer {
      margin-top: 38px;
      color: rgba(244, 224, 188, 0.5);
      font-size: 0.79rem;
      line-height: 1.5;
    }

    /* VIEWER */

    .viewer {
      position: fixed;
      inset: 0;
      z-index: 200;

      display: grid;
      place-items: center;

      padding:
        calc(18px + env(safe-area-inset-top))
        calc(15px + env(safe-area-inset-right))
        calc(70px + env(safe-area-inset-bottom))
        calc(15px + env(safe-area-inset-left));

      background: rgba(3, 3, 3, 0.97);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 200ms ease,
        visibility 200ms ease;
    }

    .viewer.open {
      opacity: 1;
      visibility: visible;
    }

    .viewer-image {
      display: block;

      max-width: 88vw;
      max-height: 78svh;

      object-fit: contain;
      border-radius: 3px;

      box-shadow:
        0 20px 70px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(255, 226, 167, 0.18);
    }

    .viewer-close,
    .viewer-gallery {
      position: fixed;
      bottom:
        calc(15px + env(safe-area-inset-bottom));
      z-index: 210;

      padding: 10px 13px;

      color: #f3ddb1;
      background: rgba(30, 20, 13, 0.95);

      border:
        1px solid rgba(224, 181, 102, 0.7);
      border-radius: 7px;

      font-size: 0.78rem;
    }

    .viewer-close {
      left:
        calc(13px + env(safe-area-inset-left));
      cursor: pointer;
    }

    .viewer-gallery {
      right:
        calc(13px + env(safe-area-inset-right));
      text-decoration: none;
    }

    .viewer-arrow {
      position: fixed;
      top: 50%;
      z-index: 210;

      transform: translateY(-50%);

      width: 43px;
      height: 68px;

      color: #f5dca6;
      background: rgba(22, 16, 12, 0.75);

      border:
        1px solid rgba(225, 183, 100, 0.43);
      border-radius: 8px;

      cursor: pointer;

      font-family: Arial, sans-serif;
      font-size: 1.9rem;

      backdrop-filter: blur(5px);
    }

    .viewer-previous {
      left:
        max(5px, env(safe-area-inset-left));
    }

    .viewer-next {
      right:
        max(5px, env(safe-area-inset-right));
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <div

        src: "audio/vjgalaxy-garage-indie-rock-rock-instrumental-570901.mp3"
      }
    ];

    const artworkFiles = [
      "IMG_3211.jpeg",
      "9EAA20AB-901D-41E1-AC98-64455D1A291D.png",
      "8E115567-F28C-456A-8E51-6EB4BA67B0A3.png",
      "5009BA2B-780C-4A6C-A6AA-4B5CDD3174C6.png",
      "03DE2160-F40A-4D77-BA2F-030FAC8C7AE7.png",
      "650B0A6A-1B85-4665-82D7-95FF79C8761E.png",
      "D649A1E7-F73A-4529-8F41-05A5524C4C8E.png",
      "7528563F-9204-4651-A65A-2A7450DCE740.png",
      "193005A4-396A-42B8-895F-3D32037BB744.png",
      "650E29C5-1949-4A2D-9B0C-9F2B31BB3934.png",
      "3ABA2FB4-184C-4FB1-8D85-4118FA503931.png",
      "4F9C4F6E-34A2-494D-847B-AB3DDA3E75AA.png",
      "52095D7B-9D55-4D6C-A87C-DA519D179B9A.png",
      "IMG_0082.jpeg",
      "IMG_0014.jpeg",
      "9F7F0E8D-FD9F-43F4-863E-308974B7AD58.jpeg"
    ];

    const sceneViewport =
      document.getElementById("sceneViewport");

    const workshop =
      document.getElementById("workshop");

    const frames = Array.from(
      document.querySelectorAll(".art-frame")
    );

    const menuButton =
      document.getElementById("menuButton");

    const menuPanel =
      document.getElementById("menuPanel");

    const menuOverlay =
      document.getElementById("menuOverlay");

    const viewer =
      document.getElementById("viewer");

    const viewerImage =
      document.getElementById("viewerImage");

    const viewerPrevious =
      document.getElementById("viewerPrevious");

    const viewerNext =
      document.getElementById("viewerNext");

    const viewerClose =
      document.getElementById("viewerClose");

    const viewerGallery =
      document.getElementById("viewerGallery");

    const toast =
      document.getElementById("toast");

    const thrownBall =
      document.getElementById("thrownBall");

    const finRunner =
      document.getElementById("finRunner");

    const finBedCover =
      document.getElementById("finBedCover");

    let finGone = false;

    const stereoHotspot =
      document.getElementById("stereoHotspot");

    const workshopStereo =
      document.getElementById("workshopStereo");

    const stereoControls =
      document.getElementById("stereoControls");

    const stereoNowPlaying =
      document.getElementById("stereoNowPlaying");

    const stereoPrevious =
      document.getElementById("stereoPrevious");

    const stereoPlayPause =
      document.getElementById("stereoPlayPause");

    const stereoNext =
      document.getElementById("stereoNext");

    const roomDotLeft =
      document.getElementById("roomDotLeft");

    const roomDotCenter =
      document.getElementById("roomDotCenter");

    const roomDotRight =
      document.getElementById("roomDotRight");

    let artworkData = [];
    let activeArtworkIndex = 0;
    let toastTimer = null;

    let stereoTrackIndex = 0;
    let stereoHasStarted = false;

    workshopStereo.volume = 0.58;

    let roomX = 0;
    let minRoomX = 0;
    let maxRoomX = 0;

    let pointerActive = false;
    let pointerId = null;
    let pointerStartX = 0;
    let roomStartX = 0;
    let pointerTravel = 0;

    let viewerTouchStartX = 0;

    function shuffle(items) {
      const copy = [...items];

      for (
        let index = copy.length - 1;
        index > 0;
        index -= 1
      ) {
        const randomIndex =
          Math.floor(
            Math.random() * (index + 1)
          );

        [copy[index], copy[randomIndex]] =
          [copy[randomIndex], copy[index]];
      }

      return copy;
    }

    function getImageShape(width, height) {
      const ratio = width / height;

      if (ratio > 1.18) {
        return "landscape";
      }

      if (ratio < 0.84) {
        return "portrait";
      }

      return "square";
    }

    function inspectArtwork(filename) {
      return new Promise(resolve => {
        const image = new Image();

        image.onload = () => {
          resolve({
            filename,
            width: image.naturalWidth,
            height: image.naturalHeight,
            shape: getImageShape(
              image.naturalWidth,
              image.naturalHeight
            )
          });
        };

        image.onerror = () => {
          resolve(null);
        };

        image.src = filename;
      });
    }

    async function loadArtworkData() {
      artworkData =
        (await Promise.all(
          artworkFiles.map(inspectArtwork)
        )).filter(Boolean);

      populateFrames();
    }

    function findBestArtwork(
      desiredShape,
      available
    ) {
      const exactMatches =
        available.filter(
          item =>
            item.shape === desiredShape
        );

      if (exactMatches.length > 0) {
        return shuffle(exactMatches)[0];
      }

      const squareMatches =
        available.filter(
          item =>
            item.shape === "square"
        );

      if (squareMatches.length > 0) {
        return shuffle(squareMatches)[0];
      }

      return available.length ? shuffle(available)[0] : null;
    }

    function populateFrames() {
      let available =
        shuffle(artworkData);

      frames.forEach((frame, index) => {
        if (available.length === 0) {
          available =
            shuffle(artworkData);
        }

        const selected =
          findBestArtwork(
            frame.dataset.frameShape,
            available
          );

        available =
          available.filter(
            item =>
              item.filename !== selected.filename
          );

        const image =
          frame.querySelector("img");

        if (!selected) {
          frame.style.display = "none";
          return;
        }

        image.src =
          selected.filename;

        image.alt =
          "Studio LaDuke artwork " +
          (index + 1);

        frame.dataset.filename =
          selected.filename;

        frame.onclick = event => {
          if (pointerTravel > 8) {
            event.preventDefault();
            return;
          }

          openViewer(
            selected.filename
          );
        };
      });
    }

    function calculateRoomBounds() {
      const roomRect =
        workshop.getBoundingClientRect();

      const overflow =
        Math.max(
          0,
          roomRect.width -
          window.innerWidth
        );

      minRoomX =
        -(overflow / 2);

      maxRoomX =
        overflow / 2;

      roomX =
        Math.max(
          minRoomX,
          Math.min(maxRoomX, roomX)
        );

      renderRoomPosition();
    }

    function renderRoomPosition() {
      workshop.style.setProperty(
        "--room-x",
        roomX + "px"
      );

      updateRoomIndicator();
    }

    function updateRoomIndicator() {
      const range =
        maxRoomX - minRoomX;

      let normalized = 0.5;

      if (range > 0) {
        normalized =
          (roomX - minRoomX) / range;
      }

      roomDotLeft.classList.toggle(
        "active",
        normalized > 0.68
      );

      roomDotCenter.classList.toggle(
        "active",
        normalized >= 0.32 &&
        normalized <= 0.68
      );

      roomDotRight.classList.toggle(
        "active",
        normalized < 0.32
      );
    }

    function beginRoomDrag(event) {
      if (
        viewer.classList.contains("open") ||
        menuPanel.classList.contains("open")
      ) {
        return;
      }

      pointerActive = true;
      pointerId = event.pointerId;
      pointerStartX = event.clientX;
      roomStartX = roomX;
      pointerTravel = 0;

      sceneViewport.classList.add(
        "dragging"
      );

      sceneViewport.setPointerCapture(
        event.pointerId
      );
    }

    function moveRoom(event) {
      if (
        !pointerActive ||
        event.pointerId !== pointerId
      ) {
        return;
      }

      const distance =
        event.clientX - pointerStartX;

      pointerTravel =
        Math.max(
          pointerTravel,
          Math.abs(distance)
        );

      roomX =
        Math.max(
          minRoomX,
          Math.min(
            maxRoomX,
            roomStartX + distance
          )
        );

      renderRoomPosition();
    }

    function endRoomDrag(event) {
      if (
        !pointerActive ||
        (
          event &&
          event.pointerId !== pointerId
        )
      ) {
        return;
      }

      pointerActive = false;
      pointerId = null;

      sceneViewport.classList.remove(
        "dragging"
      );
    }

    function openViewer(filename) {
      activeArtworkIndex =
        artworkFiles.indexOf(filename);

      if (activeArtworkIndex < 0) {
        activeArtworkIndex = 0;
      }

      updateViewer();

      viewer.classList.add("open");
    }

    function closeViewer() {
      viewer.classList.remove("open");
    }

    function updateViewer() {
      const filename =
        artworkFiles[activeArtworkIndex];

      viewerImage.src =
        filename;

      viewerGallery.href =
        "gallery.html?art=" +
        encodeURIComponent(filename);
    }

    function showPreviousArtwork() {
      activeArtworkIndex =
        (
          activeArtworkIndex -
          1 +
          artworkFiles.length
        ) % artworkFiles.length;

      updateViewer();
    }

    function showNextArtwork() {
      activeArtworkIndex =
        (
          activeArtworkIndex +
          1
        ) % artworkFiles.length;

      updateViewer();
    }

    function openMenu() {
      menuButton.classList.add("open");
      menuPanel.classList.add("open");
      menuOverlay.classList.add("open");

      menuButton.setAttribute(
        "aria-expanded",
        "true"
      );
    }

    function closeMenu() {
      menuButton.classList.remove("open");
      menuPanel.classList.remove("open");
      menuOverlay.classList.remove("open");

      menuButton.setAttribute(
        "aria-expanded",
        "false"
      );
    }

    function toggleMenu() {
      if (
        menuPanel.classList.contains("open")
      ) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    function updateStereoDisplay() {
      const track = stereoPlaylist[stereoTrackIndex];

      stereoNowPlaying.textContent =
        track.title + " · " + track.artist;

      const playing = !workshopStereo.paused;

      stereoPlayPause.textContent =
        playing ? "Ⅱ" : "▶";

      stereoHotspot.classList.toggle(
        "is-playing",
        playing
      );
    }

    function loadStereoTrack(index, autoplay = false) {
      stereoTrackIndex =
        (
          index + stereoPlaylist.length
        ) % stereoPlaylist.length;

      const track = stereoPlaylist[stereoTrackIndex];

      workshopStereo.src = track.src;
      workshopStereo.load();
      updateStereoDisplay();

      if (autoplay) {
        const playAttempt = workshopStereo.play();

        if (playAttempt && typeof playAttempt.catch === "function") {
          playAttempt.catch(() => {
            updateStereoDisplay();
          });
        }
      }
    }

    function showStereoControls() {
      stereoControls.classList.add("show");
    }

    function toggleStereo() {
      showStereoControls();

      if (!stereoHasStarted) {
        stereoHasStarted = true;
        loadStereoTrack(stereoTrackIndex, true);
        showToast("The workshop stereo wakes up.");
        return;
      }

      if (workshopStereo.paused) {
        workshopStereo.play().catch(() => {});
      } else {
        workshopStereo.pause();
      }
    }

    function nextStereoTrack() {
      stereoHasStarted = true;
      showStereoControls();
      loadStereoTrack(stereoTrackIndex + 1, true);
    }

    function previousStereoTrack() {
      stereoHasStarted = true;
      showStereoControls();
      loadStereoTrack(stereoTrackIndex - 1, true);
    }

    function showToast(text) {
      window.clearTimeout(toastTimer);

      toast.textContent =
        text;

      toast.classList.add("show");

      toastTimer =
        window.setTimeout(() => {
          toast.classList.remove("show");
        }, 1800);
    }

    sceneViewport.addEventListener(
      "pointerdown",
      beginRoomDrag
    );

    sceneViewport.addEventListener(
      "pointermove",
      moveRoom
    );

    sceneViewport.addEventListener(
      "pointerup",
      endRoomDrag
    );

    sceneViewport.addEventListener(
      "pointercancel",
      endRoomDrag
    );

    sceneViewport.addEventListener(
      "lostpointercapture",
      () => endRoomDrag()
    );

    menuButton.addEventListener(
      "click",
      toggleMenu
    );

    menuOverlay.addEventListener(
      "click",
      closeMenu
    );

    viewerClose.addEventListener(
      "click",
      closeViewer
    );

    viewerPrevious.addEventListener(
      "click",
      showPreviousArtwork
    );

    viewerNext.addEventListener(
      "click",
      showNextArtwork
    );

    viewer.addEventListener(
      "click",
      event => {
        if (event.target === viewer) {
          closeViewer();
        }
      }
    );

    viewer.addEventListener(
      "touchstart",
      event => {
        viewerTouchStartX =
          event.changedTouches[0].screenX;
      },
      { passive: true }
    );

    viewer.addEventListener(
      "touchend",
      event => {
        const distance =
          event.changedTouches[0].screenX -
          viewerTouchStartX;

        if (Math.abs(distance) < 55) {
          return;
        }

        if (distance < 0) {
          showNextArtwork();
        } else {
          showPreviousArtwork();
        }
      },
      { passive: true }
    );

    document.addEventListener(
      "keydown",
      event => {
        if (event.key === "Escape") {
          if (
            viewer.classList.contains("open")
          ) {
            closeViewer();
          } else {
            closeMenu();
          }
        }

        if (
          event.key === "ArrowLeft" &&
          viewer.classList.contains("open")
        ) {
          showPreviousArtwork();
        }

        if (
          event.key === "ArrowRight" &&
          viewer.classList.contains("open")
        ) {
          showNextArtwork();
        }
      }
    );

    document
      .querySelectorAll(".menu-link")
      .forEach(link => {
        link.addEventListener(
          "click",
          closeMenu
        );
      });

    stereoHotspot.addEventListener(
      "click",
      () => {
        if (pointerTravel <= 8) {
          toggleStereo();
        }
      }
    );

    stereoPlayPause.addEventListener(
      "click",
      event => {
        event.stopPropagation();
        toggleStereo();
      }
    );

    stereoPrevious.addEventListener(
      "click",
      event => {
        event.stopPropagation();
        previousStereoTrack();
      }
    );

    stereoNext.addEventListener(
      "click",
      event => {
        event.stopPropagation();
        nextStereoTrack();
      }
    );

    workshopStereo.addEventListener(
      "play",
      updateStereoDisplay
    );

    workshopStereo.addEventListener(
      "pause",
      updateStereoDisplay
    );

    workshopStereo.addEventListener(
      "ended",
      nextStereoTrack
    );

    workshopStereo.addEventListener(
      "error",
      () => {
        showToast(
          "That track did not load. Trying the next one."
        );

        window.setTimeout(
          nextStereoTrack,
          550
        );
      }
    );

    document
      .getElementById("sewingHotspot")
      .addEventListener(
        "click",
        () => {
          if (pointerTravel <= 8) {
            showToast(
              "The upholstery room is coming soon."
            );
          }
        }
      );

    document
      .getElementById("dogHotspot")
      .addEventListener(
        "click",
        () => {
          if (pointerTravel <= 8) {
            if (finGone) {
              showToast("Fin is still outside conducting important tennis-ball business.");
              return;
            }

            finGone = true;

            thrownBall.classList.remove("fly");
            finRunner.classList.remove("run");
            void thrownBall.offsetWidth;
            void finRunner.offsetWidth;

            finBedCover.classList.add("show");
            thrownBall.classList.add("fly");
            finRunner.classList.add("run");

            showToast("You throw the ball. Fin is GONE.");

            document.getElementById("dogHotspot").style.pointerEvents = "none";
          }
        }
      );

    document
      .getElementById("forestHotspot")
      .addEventListener(
        "click",
        () => {
          if (pointerTravel <= 8) {
            showToast(
              "The forest path is not open yet."
            );
          }
        }
      );

    window.addEventListener(
      "resize",
      calculateRoomBounds
    );

    window.addEventListener(
      "orientationchange",
      () => {
        window.setTimeout(
          calculateRoomBounds,
          250
        );
      }
    );

    loadArtworkData();
    loadStereoTrack(0, false);

    window.setTimeout(() => {
      try {
        if (!sessionStorage.getItem("workshopHintSeen")) {
          showToast(
            "Drag to look around. Tap what catches your eye."
          );
          sessionStorage.setItem(
            "workshopHintSeen",
            "1"
          );
        }
      } catch (error) {
        /* Storage can be blocked; the room still works fine. */
      }
    }, 850);

    window.setTimeout(() => {
      calculateRoomBounds();

      if (maxRoomX > 0) {
        roomX =
          Math.min(
            maxRoomX,
            maxRoomX * 0.2
          );

        renderRoomPosition();
      }
    }, 120);
  </script>

</body>
</html>
