<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >
  <title>Studio LaDuke Workshop</title>

  <style>
    :root {
      --gold: #d5a752;
      --cream: #f5dfb2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050504;
    }

    body {
      min-height: 100svh;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      overscroll-behavior: none;
    }

    button,
    a {
      color: inherit;
      font: inherit;
    }

    button {
      appearance: none;
    }

    .background-fill {
      position: fixed;
      inset: -35px;
      z-index: 0;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.4),
          rgba(0, 0, 0, 0.64)
        ),
        url("7B84A8A4-56B8-4572-ABA7-FA9FFD983B3F.png")
        center / cover no-repeat;

      filter: blur(22px) brightness(0.46);
      transform: scale(1.09);
    }

    .scene-viewport {
      position: fixed;
      inset: 0;
      z-index: 1;

      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }

    .scene-viewport.dragging {
      cursor: grabbing;
    }

    .workshop {
      position: absolute;
      left: 50%;
      top: 50%;

      width: min(100vw, calc(100svh * 1.5));
      height: min(100svh, calc(100vw / 1.5));

      aspect-ratio: 3 / 2;
      overflow: hidden;

      background:
        url("7B84A8A4-56B8-4572-ABA7-FA9FFD983B3F.png")
        center / 100% 100% no-repeat;

      box-shadow:
        0 0 55px rgba(0, 0, 0, 0.92);

      transform:
        translate(-50%, -50%)
        translateX(var(--room-x, 0px));

      will-change: transform;
      user-select: none;
    }

    @media (max-width: 700px) and (orientation: portrait) {
      .workshop {
        width: 150svh;
        height: 100svh;
        max-width: none;
        max-height: none;
      }
    }

    @media (max-height: 600px) and (orientation: landscape) {
      .workshop {
        width: 100vw;
        height: calc(100vw / 1.5);
      }
    }

    /* REAL ARTWORK — mapped to the photographed frame interiors */

    .art-frame {
      position: absolute;
      z-index: 8;
      display: block;
      overflow: hidden;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #080706;
      cursor: pointer;
      isolation: isolate;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.42);
    }

    /* Use the frame that is already in the photograph instead of
       drawing a second fake frame on top of it. */
    .art-frame::before {
      content: none;
    }

    .art-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(
          118deg,
          rgba(255, 225, 170, 0.055),
          transparent 31%,
          transparent 72%,
          rgba(0, 0, 0, 0.13)
        );
      box-shadow: inset 0 0 7px rgba(0, 0, 0, 0.32);
    }

    .art-frame img {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      padding: clamp(2px, 0.22vw, 5px);
      background: #080706;
      pointer-events: none;
      filter:
        brightness(0.97)
        contrast(1.04)
        saturate(1.03);
      transition: filter 160ms ease;
    }

    .art-frame:hover img,
    .art-frame:focus-visible img {
      filter:
        brightness(1.04)
        contrast(1.06)
        saturate(1.08);
    }

    .art-frame:focus-visible {
      outline: 2px solid rgba(255, 213, 119, 0.86);
      outline-offset: 3px;
    }

    /*
      The current workshop photograph has three real display surfaces:
      two wall frames above the stereo and the easel canvas. These
      coordinates follow the actual corners in the photograph, including
      the tiny perspective angles, so the art sits inside the frames.
    */

    .frame-1 {
      left: 21.861%;
      top: 12.903%;
      width: 8.133%;
      height: 10.948%;
      clip-path: polygon(
        0% 0%,
        99.2% 4.46%,
        100% 100%,
        0% 98.21%
      );
    }

    .frame-2 {
      left: 33.312%;
      top: 13.490%;
      width: 7.807%;
      height: 10.655%;
      clip-path: polygon(
        0.83% 0%,
        100% 2.75%,
        100% 100%,
        0% 98.17%
      );
    }

    /* The old layout targeted frames from an earlier workshop image.
       Hide those instead of leaving art floating on the wall. */
    .frame-3,
    .frame-4,
    .frame-5,
    .frame-6,
    .frame-7,
    .frame-8 {
      display: none;
    }

    .frame-9 {
      left: 73.260%;
      top: 24.536%;
      width: 12.362%;
      height: 24.927%;
      clip-path: polygon(
        17.89% 5.10%,
        100% 0%,
        80% 100%,
        0% 91.76%
      );
    }

    /* Give the easel art the same visual tilt as the photographed canvas. */
    .frame-9 img {
      padding: clamp(4px, 0.34vw, 8px);
      transform: rotate(-4.1deg) scale(1.10);
      transform-origin: center;
    }

    .frame-9:hover img,
    .frame-9:focus-visible img {
      transform: rotate(-4.1deg) scale(1.10);
    }

    /* HOTSPOTS */

    .hotspot {
      position: absolute;
      z-index: 12;

      display: block;

      border: 0;
      background: transparent;
      cursor: pointer;
      text-decoration: none;
    }

    .hotspot::after {
      content: "";

      position: absolute;
      inset: 4%;

      border: 2px solid transparent;
      border-radius: 8px;

      transition:
        border-color 160ms ease,
        background 160ms ease,
        box-shadow 160ms ease;
    }

    .hotspot:hover::after,
    .hotspot:focus-visible::after {
      border-color:
        rgba(189, 255, 103, 0.7);

      background:
        radial-gradient(
          circle at center,
          rgba(124, 255, 77, 0.1),
          transparent 65%
        );

      box-shadow:
        0 0 18px rgba(95, 255, 65, 0.28);
    }

    .arcade-hotspot {
      left: 58.6%;
      top: 26%;
      width: 10.4%;
      height: 34%;
    }

    .pool-hotspot {
      left: 0;
      top: 45%;
      width: 30%;
      height: 31%;
    }

    .sewing-hotspot {
      left: 72%;
      top: 46%;
      width: 28%;
      height: 32%;
    }

    .dog-hotspot {
      left: 8.5%;
      top: 70%;
      width: 23%;
      height: 25%;
    }

    .forest-hotspot {
      left: 2.5%;
      top: 16%;
      width: 15%;
      height: 44%;
    }

    /* WALL STEREO */
    .stereo-hotspot {
      left: 21.7%;
      top: 17.2%;
      width: 14.2%;
      height: 11.8%;
    }

    .stereo-hotspot::before {
      content: "";
      position: absolute;
      inset: 4% 2%;
      z-index: -1;
      border-radius: 10px;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(
          ellipse at center,
          rgba(255, 190, 70, 0.34),
          rgba(255, 145, 35, 0.14) 48%,
          transparent 74%
        );
      filter: blur(7px);
      transition: opacity 220ms ease;
    }

    .stereo-hotspot.is-playing::before {
      opacity: 0.9;
      animation: stereoPulse 2.4s ease-in-out infinite;
    }

    @keyframes stereoPulse {
      0%,
      100% {
        opacity: 0.46;
        transform: scale(0.96);
      }

      50% {
        opacity: 0.98;
        transform: scale(1.04);
      }
    }

    /* Compact floating stereo controller. It stays out of Fin's face. */
    .stereo-controls {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: calc(14px + env(safe-area-inset-right));
      bottom: auto;
      z-index: 165;

      width: min(330px, calc(100vw - 92px));
      min-height: 48px;
      padding: 6px 7px 6px 11px;

      display: flex;
      align-items: center;
      gap: 8px;

      color: #f4e3bf;
      background: rgba(14, 11, 8, 0.84);
      border: 1px solid rgba(225, 183, 100, 0.48);
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(8px);

      opacity: 0;
      visibility: hidden;
      transform: translateY(-7px);
      transition:
        opacity 180ms ease,
        transform 180ms ease,
        visibility 180ms ease;
    }

    .stereo-controls.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .stereo-now-playing {
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
      margin: 0;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-family: Arial, sans-serif;
      font-size: 0.72rem;
      color: rgba(246, 226, 190, 0.9);
    }

    .stereo-buttons {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stereo-control {
      width: 36px;
      height: 36px;
      min-height: 36px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid rgba(225, 183, 100, 0.30);
      border-radius: 50%;
      color: #f5dfb2;
      background: rgba(255, 255, 255, 0.035);
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 0.85rem;
      line-height: 1;
    }

    .stereo-control:hover,
    .stereo-control:focus-visible {
      background: rgba(213, 167, 82, 0.14);
      border-color: rgba(225, 183, 100, 0.68);
    }

    @media (max-width: 700px) and (orientation: portrait) {
      .stereo-controls {
        top: calc(13px + env(safe-area-inset-top));
        right: calc(10px + env(safe-area-inset-right));
        width: min(300px, calc(100vw - 88px));
      }

      .stereo-now-playing {
        font-size: 0.68rem;
      }

      .stereo-control {
        width: 34px;
        height: 34px;
        min-height: 34px;
      }
    }

    /* A quiet arcade glow so the machine feels alive without
       turning the room into a neon sign. */
    .arcade-hotspot::before {
      content: "";
      position: absolute;
      inset: 10% 12%;
      z-index: -1;
      border-radius: 18%;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 50% 46%,
          rgba(166, 255, 92, 0.34) 0%,
          rgba(111, 239, 66, 0.18) 34%,
          rgba(69, 196, 52, 0.06) 58%,
          transparent 76%
        );
      filter: blur(8px);
      opacity: 0.62;
      transform: scale(0.94);
      animation: arcadePulse 3.1s ease-in-out infinite;
    }

    .arcade-hotspot:hover::before,
    .arcade-hotspot:focus-visible::before {
      opacity: 0.95;
    }

    @keyframes arcadePulse {
      0%,
      100% {
        opacity: 0.42;
        transform: scale(0.92);
      }

      50% {
        opacity: 0.78;
        transform: scale(1.035);
      }
    }

    /* Fin's tennis ball. The dog is baked into the room image,
       so this gives his hotspot a little physical payoff without
       covering the original artwork. */
    .thrown-ball {
      position: absolute;
      left: 22%;
      top: 80%;
      z-index: 28;
      width: clamp(7px, 0.95vw, 15px);
      aspect-ratio: 1;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(
          circle at 34% 30%,
          #f4ff92 0 18%,
          #c9df37 32%,
          #8fa520 72%,
          #65730f 100%
        );
      box-shadow:
        0 2px 5px rgba(0, 0, 0, 0.55),
        0 0 7px rgba(214, 255, 79, 0.25);
    }

    .thrown-ball.fly {
      animation: throwBall 900ms cubic-bezier(0.2, 0.72, 0.25, 1) forwards;
    }

    @keyframes throwBall {
      0% {
        left: 22%;
        top: 80%;
        opacity: 0;
        transform: scale(0.65) rotate(0deg);
      }

      8% {
        opacity: 1;
      }

      42% {
        left: 15%;
        top: 50%;
        opacity: 1;
        transform: scale(1.08) rotate(300deg);
      }

      72% {
        left: 9%;
        top: 37%;
        opacity: 1;
        transform: scale(0.82) rotate(540deg);
      }

      100% {
        left: 5.2%;
        top: 30%;
        opacity: 0;
        transform: scale(0.42) rotate(760deg);
      }
    }

    /* ROOM DOTS */

    .room-indicator {
      position: fixed;
      left: 50%;
      bottom:
        calc(15px + env(safe-area-inset-bottom));
      z-index: 45;

      display: none;
      gap: 7px;

      transform: translateX(-50%);

      padding: 7px 10px;

      background: rgba(10, 8, 6, 0.72);
      border:
        1px solid rgba(225, 183, 100, 0.3);
      border-radius: 999px;

      pointer-events: none;
      backdrop-filter: blur(5px);
    }

    .room-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;
      background: rgba(245, 223, 178, 0.3);

      transition:
        background 130ms ease,
        transform 130ms ease;
    }

    .room-dot.active {
      background: #e1b85f;
      transform: scale(1.2);
    }

    @media (max-width: 700px) and (orientation: portrait) {
      .room-indicator {
        display: flex;
      }
    }

    /* TOAST */

    .toast {
      position: fixed;
      left: 50%;
      bottom:
        calc(55px + env(safe-area-inset-bottom));
      z-index: 150;

      transform:
        translateX(-50%)
        translateY(18px);

      width: max-content;
      max-width: calc(100vw - 40px);

      padding: 10px 15px;

      color: #f6e6c4;
      background: rgba(18, 14, 10, 0.94);

      border:
        1px solid rgba(225, 183, 100, 0.58);
      border-radius: 7px;

      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 0.82rem;

      opacity: 0;
      visibility: hidden;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.48);

      transition:
        opacity 180ms ease,
        transform 180ms ease,
        visibility 180ms ease;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;

      transform:
        translateX(-50%)
        translateY(0);
    }

    /* MENU */

    .menu-button {
      position: fixed;
      top:
        calc(13px + env(safe-area-inset-top));
      left:
        calc(13px + env(safe-area-inset-left));
      z-index: 90;

      width: 50px;
      height: 50px;

      display: grid;
      place-items: center;

      color: var(--cream);
      background: rgba(12, 10, 8, 0.88);

      border:
        1px solid rgba(224, 181, 102, 0.7);
      border-radius: 9px;

      cursor: pointer;

      box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.55);

      backdrop-filter: blur(8px);
    }

    .menu-lines,
    .menu-lines::before,
    .menu-lines::after {
      width: 23px;
      height: 2px;

      background: currentColor;
      border-radius: 99px;

      transition:
        transform 180ms ease,
        opacity 180ms ease;
    }

    .menu-lines {
      position: relative;
    }

    .menu-lines::before,
    .menu-lines::after {
      content: "";
      position: absolute;
      left: 0;
    }

    .menu-lines::before {
      top: -8px;
    }

    .menu-lines::after {
      top: 8px;
    }

    .menu-button.open .menu-lines {
      background: transparent;
    }

    .menu-button.open .menu-lines::before {
      top: 0;
      transform: rotate(45deg);
    }

    .menu-button.open .menu-lines::after {
      top: 0;
      transform: rotate(-45deg);
    }

    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;

      background: rgba(0, 0, 0, 0.64);

      opacity: 0;
      visibility: hidden;

      backdrop-filter: blur(5px);

      transition:
        opacity 200ms ease,
        visibility 200ms ease;
    }

    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .menu-panel {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 80;

      width: min(84vw, 420px);

      padding:
        calc(88px + env(safe-area-inset-top))
        27px
        calc(28px + env(safe-area-inset-bottom));

      overflow-y: auto;

      background:
        linear-gradient(
          150deg,
          rgba(86, 45, 25, 0.99),
          rgba(34, 19, 13, 0.995)
        );

      border-right:
        1px solid rgba(220, 173, 91, 0.6);

      box-shadow:
        18px 0 45px rgba(0, 0, 0, 0.68);

      transform: translateX(-104%);

      transition: transform 240ms ease;
    }

    .menu-panel.open {
      transform: translateX(0);
    }

    .menu-title {
      margin-bottom: 8px;
      color: #f5dca6;
      font-size: clamp(1.8rem, 7vw, 2.6rem);
    }

    .menu-subtitle {
      margin-bottom: 26px;
      color: rgba(245, 225, 190, 0.7);
      line-height: 1.5;
      font-size: 0.91rem;
    }

    .menu-links {
      display: grid;
      gap: 11px;
    }

    .menu-link {
      display: block;

      padding: 14px 16px;

      color: #f5e4c4;
      background: rgba(255, 255, 255, 0.035);

      border:
        1px solid rgba(239, 202, 142, 0.22);
      border-radius: 7px;

      text-decoration: none;
      font-size: 1.02rem;
    }

    .gallery-link {
      color: #ffd887;

      border-color:
        rgba(231, 181, 84, 0.48);

      background:
        linear-gradient(
          90deg,
          rgba(125, 78, 27, 0.26),
          rgba(69, 38, 17, 0.16)
        );
    }

    .gallery-link::before {
      content: "🖼️";
      margin-right: 9px;
    }

    .arcade-link {
      color: #ceff8c;

      border-color:
        rgba(145, 213, 75, 0.42);

      background:
        linear-gradient(
          90deg,
          rgba(65, 120, 31, 0.2),
          rgba(28, 54, 15, 0.13)
        );
    }

    .arcade-link::before {
      content: "🎮";
      margin-right: 9px;
    }

    .menu-footer {
      margin-top: 38px;
      color: rgba(244, 224, 188, 0.5);
      font-size: 0.79rem;
      line-height: 1.5;
    }

    /* VIEWER */

    .viewer {
      position: fixed;
      inset: 0;
      z-index: 200;

      display: grid;
      place-items: center;

      padding:
        calc(18px + env(safe-area-inset-top))
        calc(15px + env(safe-area-inset-right))
        calc(70px + env(safe-area-inset-bottom))
        calc(15px + env(safe-area-inset-left));

      background: rgba(3, 3, 3, 0.97);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 200ms ease,
        visibility 200ms ease;
    }

    .viewer.open {
      opacity: 1;
      visibility: visible;
    }

    .viewer-image {
      display: block;

      max-width: 88vw;
      max-height: 78svh;

      object-fit: contain;
      border-radius: 3px;

      box-shadow:
        0 20px 70px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(255, 226, 167, 0.18);
    }

    .viewer-close,
    .viewer-gallery {
      position: fixed;
      bottom:
        calc(15px + env(safe-area-inset-bottom));
      z-index: 210;

      padding: 10px 13px;

      color: #f3ddb1;
      background: rgba(30, 20, 13, 0.95);

      border:
        1px solid rgba(224, 181, 102, 0.7);
      border-radius: 7px;

      font-size: 0.78rem;
    }

    .viewer-close {
      left:
        calc(13px + env(safe-area-inset-left));
      cursor: pointer;
    }

    .viewer-gallery {
      right:
        calc(13px + env(safe-area-inset-right));
      text-decoration: none;
    }

    .viewer-arrow {
      position: fixed;
      top: 50%;
      z-index: 210;

      transform: translateY(-50%);

      width: 43px;
      height: 68px;

      color: #f5dca6;
      background: rgba(22, 16, 12, 0.75);

      border:
        1px solid rgba(225, 183, 100, 0.43);
      border-radius: 8px;

      cursor: pointer;

      font-family: Arial, sans-serif;
      font-size: 1.9rem;

      backdrop-filter: blur(5px);
    }

    .viewer-previous {
      left:
        max(5px, env(safe-area-inset-left));
    }

    .viewer-next {
      right:
        max(5px, env(safe-area-inset-right));
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <div
    class="background-fill"
    aria-hidden="true"
  ></div>

  <div
    class="scene-viewport"
    id="sceneViewport"
  >

    <main
      class="workshop"
      id="workshop"
      aria-label="Studio LaDuke creative workshop"
    >

      <button
        class="art-frame frame-1"
        data-frame-shape="landscape"
        type="button"
      >
        <img alt="Studio LaDuke artwork">
      </button>

      <button
        class="art-frame frame-2"
        data-frame-shape="landscape"
        type="button"
      >
        <img alt="Studio LaDuke artwork">
      </button>

      <button
        class="art-frame frame-3"
        data-frame-shape="portrait"
        type="button"
      >
        <img alt="Studio LaDuke artwork">
      </button>

      <button
        class="art-frame frame-4"
        data-frame-shape="portrait"
        type="button"
      >
        <img alt="Studio LaDuke artwork">
      </button>

      <button
        class="art-frame frame-5"
        data-frame-shape="portrait"
        type="button"
      >
        <img alt="Studio LaDuke artwork">
      </button>

      <button
        class="art-frame frame-6"
        data-frame-shape="portrait"
        type="button"
      >
        <img alt="Studio LaDuke artwork">
      </button>

      <button

  <button

  <audio
    id="workshopStereo"
    preload="metadata"
  ></audio>

  <script>
    "use strict";

    const stereoPlaylist = [
      {
        title: "No Filter",
        artist: "AlexGrohl",
        src: "audio/alexgrohl-no-filter-garage-rock-449647.mp3"
      },
      {
        title: "Catchy Garage Rock",
        artist: "MagpieMusic",
        src: "audio/magpiemusic-catchy-garage-rock-342334.mp3"
      },
      {
        title: "Garage Rock",
        artist: "OctoSound",
        src: "audio/octosound-garage-rock-563899.mp3"
      },
      {
        title: "Dirty Neon Nights",
        artist: "OpenMindAudio",
        src: "audio/openmindaudio-background-music-garage-rock-dirty-neon-nights-503855.mp3"
      },
      {
        title: "Punk Rock Heatwave",
        artist: "VibeMode",
        src: "audio/vibemode-punk-rock-heatwave-545931.mp3"
      },
      {
        title: "Garage Indie Rock",
        artist: "VJGalaxy",
        src: "audio/vjgalaxy-garage-indie-rock-background-music-570902.mp3"
      },
      {
        title: "Garage Indie Rock Instrumental",
        artist: "VJGalaxy",
        src: "audio/vjgalaxy-garage-indie-rock-rock-instrumental-570901.mp3"
      }
    ];

    const artworkFiles = [
      "IMG_3211.jpeg",
      "9EAA20AB-901D-41E1-AC98-64455D1A291D.png",
      "8E115567-F28C-456A-8E51-6EB4BA67B0A3.png",
      "5009BA2B-780C-4A6C-A6AA-4B5CDD3174C6.png",
      "03DE2160-F40A-4D77-BA2F-030FAC8C7AE7.png",
      "650B0A6A-1B85-4665-82D7-95FF79C8761E.png",
      "D649A1E7-F73A-4529-8F41-05A5524C4C8E.png",
      "7528563F-9204-4651-A65A-2A7450DCE740.png",
      "193005A4-396A-42B8-895F-3D32037BB744.png",
      "650E29C5-1949-4A2D-9B0C-9F2B31BB3934.png",
      "3ABA2FB4-184C-4FB1-8D85-4118FA503931.png",
      "4F9C4F6E-34A2-494D-847B-AB3DDA3E75AA.png",
      "52095D7B-9D55-4D6C-A87C-DA519D179B9A.png",
      "IMG_0082.jpeg",
      "IMG_0014.jpeg",
      "9F7F0E8D-FD9F-43F4-863E-308974B7AD58.jpeg"
    ];

    const sceneViewport =
      document.getElementById("sceneViewport");

    const workshop =
      document.getElementById("workshop");

    const frames = Array.from(
      document.querySelectorAll(".art-frame")
    );

    const menuButton =
      document.getElementById("menuButton");

    const menuPanel =
      document.getElementById("menuPanel");

    const menuOverlay =
      document.getElementById("menuOverlay");

    const viewer =
      document.getElementById("viewer");

    const viewerImage =
      document.getElementById("viewerImage");

    const viewerPrevious =
      document.getElementById("viewerPrevious");

    const viewerNext =
      document.getElementById("viewerNext");

    const viewerClose =
      document.getElementById("viewerClose");

    const viewerGallery =
      document.getElementById("viewerGallery");

    const toast =
      document.getElementById("toast");

    const thrownBall =
      document.getElementById("thrownBall");

    const stereoHotspot =
      document.getElementById("stereoHotspot");

    const workshopStereo =
      document.getElementById("workshopStereo");

    const stereoControls =
      document.getElementById("stereoControls");

    const stereoNowPlaying =
      document.getElementById("stereoNowPlaying");

    const stereoPrevious =
      document.getElementById("stereoPrevious");

    const stereoPlayPause =
      document.getElementById("stereoPlayPause");

    const stereoNext =
      document.getElementById("stereoNext");

    const roomDotLeft =
      document.getElementById("roomDotLeft");

    const roomDotCenter =
      document.getElementById("roomDotCenter");

    const roomDotRight =
      document.getElementById("roomDotRight");

    let artworkData = [];
    let activeArtworkIndex = 0;
    let toastTimer = null;

    let stereoTrackIndex = 0;
    let stereoHasStarted = false;

    workshopStereo.volume = 0.58;

    let roomX = 0;
    let minRoomX = 0;
    let maxRoomX = 0;

    let pointerActive = false;
    let pointerId = null;
    let pointerStartX = 0;
    let roomStartX = 0;
    let pointerTravel = 0;

    let viewerTouchStartX = 0;

    function shuffle(items) {
      const copy = [...items];

      for (
        let index = copy.length - 1;
        index > 0;
        index -= 1
      ) {
        const randomIndex =
          Math.floor(
            Math.random() * (index + 1)
          );

        [copy[index], copy[randomIndex]] =
          [copy[randomIndex], copy[index]];
      }

      return copy;
    }

    function getImageShape(width, height) {
      const ratio = width / height;

      if (ratio > 1.18) {
        return "landscape";
      }

      if (ratio < 0.84) {
        return "portrait";
      }

      return "square";
    }

    function inspectArtwork(filename) {
      return new Promise(resolve => {
        const image = new Image();

        image.onload = () => {
          resolve({
            filename,
            width: image.naturalWidth,
            height: image.naturalHeight,
            shape: getImageShape(
              image.naturalWidth,
              image.naturalHeight
            )
          });
        };

        image.onerror = () => {
          resolve({
            filename,
            width: 1,
            height: 1,
            shape: "square"
          });
        };

        image.src = filename;
      });
    }

    async function loadArtworkData() {
      artworkData =
        await Promise.all(
          artworkFiles.map(inspectArtwork)
        );

      populateFrames();
    }

    function findBestArtwork(
      desiredShape,
      available
    ) {
      const exactMatches =
        available.filter(
          item =>
            item.shape === desiredShape
        );

      if (exactMatches.length > 0) {
        return shuffle(exactMatches)[0];
      }

      const squareMatches =
        available.filter(
          item =>
            item.shape === "square"
        );

      if (squareMatches.length > 0) {
        return shuffle(squareMatches)[0];
      }

      return shuffle(available)[0];
    }

    function populateFrames() {
      let available =
        shuffle(artworkData);

      frames.forEach((frame, index) => {
        if (available.length === 0) {
          available =
            shuffle(artworkData);
        }

        const selected =
          findBestArtwork(
            frame.dataset.frameShape,
            available
          );

        available =
          available.filter(
            item =>
              item.filename !== selected.filename
          );

        const image =
          frame.querySelector("img");

        image.src =
          selected.filename;

        image.alt =
          "Studio LaDuke artwork " +
          (index + 1);

        frame.dataset.filename =
          selected.filename;

        frame.onclick = event => {
          if (pointerTravel > 8) {
            event.preventDefault();
            return;
          }

          openViewer(
            selected.filename
          );
        };
      });
    }

    function calculateRoomBounds() {
      const roomRect =
        workshop.getBoundingClientRect();

      const overflow =
        Math.max(
          0,
          roomRect.width -
          window.innerWidth
        );

      minRoomX =
        -(overflow / 2);

      maxRoomX =
        overflow / 2;

      roomX =
        Math.max(
          minRoomX,
          Math.min(maxRoomX, roomX)
        );

      renderRoomPosition();
    }

    function renderRoomPosition() {
      workshop.style.setProperty(
        "--room-x",
        roomX + "px"
      );

      updateRoomIndicator();
    }

    function updateRoomIndicator() {
      const range =
        maxRoomX - minRoomX;

      let normalized = 0.5;

      if (range > 0) {
        normalized =
          (roomX - minRoomX) / range;
      }

      roomDotLeft.classList.toggle(
        "active",
        normalized > 0.68
      );

      roomDotCenter.classList.toggle(
        "active",
        normalized >= 0.32 &&
        normalized <= 0.68
      );

      roomDotRight.classList.toggle(
        "active",
        normalized < 0.32
      );
    }

    function beginRoomDrag(event) {
      if (
        viewer.classList.contains("open") ||
        menuPanel.classList.contains("open")
      ) {
        return;
      }

      pointerActive = true;
      pointerId = event.pointerId;
      pointerStartX = event.clientX;
      roomStartX = roomX;
      pointerTravel = 0;

      sceneViewport.classList.add(
        "dragging"
      );

      sceneViewport.setPointerCapture(
        event.pointerId
      );
    }

    function moveRoom(event) {
      if (
        !pointerActive ||
        event.pointerId !== pointerId
      ) {
        return;
      }

      const distance =
        event.clientX - pointerStartX;

      pointerTravel =
        Math.max(
          pointerTravel,
          Math.abs(distance)
        );

      roomX =
        Math.max(
          minRoomX,
          Math.min(
            maxRoomX,
            roomStartX + distance
          )
        );

      renderRoomPosition();
    }

    function endRoomDrag(event) {
      if (
        !pointerActive ||
        (
          event &&
          event.pointerId !== pointerId
        )
      ) {
        return;
      }

      pointerActive = false;
      pointerId = null;

      sceneViewport.classList.remove(
        "dragging"
      );
    }

    function openViewer(filename) {
      activeArtworkIndex =
        artworkFiles.indexOf(filename);

      if (activeArtworkIndex < 0) {
        activeArtworkIndex = 0;
      }

      updateViewer();

      viewer.classList.add("open");
    }

    function closeViewer() {
      viewer.classList.remove("open");
    }

    function updateViewer() {
      const filename =
        artworkFiles[activeArtworkIndex];

      viewerImage.src =
        filename;

      viewerGallery.href =
        "gallery.html?art=" +
        encodeURIComponent(filename);
    }

    function showPreviousArtwork() {
      activeArtworkIndex =
        (
          activeArtworkIndex -
          1 +
          artworkFiles.length
        ) % artworkFiles.length;

      updateViewer();
    }

    function showNextArtwork() {
      activeArtworkIndex =
        (
          activeArtworkIndex +
          1
        ) % artworkFiles.length;

      updateViewer();
    }

    function openMenu() {
      menuButton.classList.add("open");
      menuPanel.classList.add("open");
      menuOverlay.classList.add("open");

      menuButton.setAttribute(
        "aria-expanded",
        "true"
      );
    }

    function closeMenu() {
      menuButton.classList.remove("open");
      menuPanel.classList.remove("open");
      menuOverlay.classList.remove("open");

      menuButton.setAttribute(
        "aria-expanded",
        "false"
      );
    }

    function toggleMenu() {
      if (
        menuPanel.classList.contains("open")
      ) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    function updateStereoDisplay() {
      const track = stereoPlaylist[stereoTrackIndex];

      stereoNowPlaying.textContent =
        track.title + " · " + track.artist;

      const playing = !workshopStereo.paused;

      stereoPlayPause.textContent =
        playing ? "❚❚" : "▶";

      stereoHotspot.classList.toggle(
        "is-playing",
        playing
      );
    }

    function loadStereoTrack(index, autoplay = false) {
      stereoTrackIndex =
        (
          index + stereoPlaylist.length
        ) % stereoPlaylist.length;

      const track = stereoPlaylist[stereoTrackIndex];

      workshopStereo.src = track.src;
      workshopStereo.load();
      updateStereoDisplay();

      if (autoplay) {
        const playAttempt = workshopStereo.play();

        if (playAttempt && typeof playAttempt.catch === "function") {
          playAttempt.catch(() => {
            updateStereoDisplay();
          });
        }
      }
    }

    function showStereoControls() {
      stereoControls.classList.add("show");
    }

    function toggleStereo() {
      showStereoControls();

      if (!stereoHasStarted) {
        stereoHasStarted = true;
        loadStereoTrack(stereoTrackIndex, true);
        showToast("The workshop stereo wakes up.");
        return;
      }

      if (workshopStereo.paused) {
        workshopStereo.play().catch(() => {});
      } else {
        workshopStereo.pause();
      }
    }

    function nextStereoTrack() {
      stereoHasStarted = true;
      showStereoControls();
      loadStereoTrack(stereoTrackIndex + 1, true);
    }

    function previousStereoTrack() {
      stereoHasStarted = true;
      showStereoControls();
      loadStereoTrack(stereoTrackIndex - 1, true);
    }

    function showToast(text) {
      window.clearTimeout(toastTimer);

      toast.textContent =
        text;

      toast.classList.add("show");

      toastTimer =
        window.setTimeout(() => {
          toast.classList.remove("show");
        }, 1800);
    }

    sceneViewport.addEventListener(
      "pointerdown",
      beginRoomDrag
    );

    sceneViewport.addEventListener(
      "pointermove",
      moveRoom
    );

    sceneViewport.addEventListener(
      "pointerup",
      endRoomDrag
    );

    sceneViewport.addEventListener(
      "pointercancel",
      endRoomDrag
    );

    sceneViewport.addEventListener(
      "lostpointercapture",
      () => endRoomDrag()
    );

    menuButton.addEventListener(
      "click",
      toggleMenu
    );

    menuOverlay.addEventListener(
      "click",
      closeMenu
    );

    viewerClose.addEventListener(
      "click",
      closeViewer
    );

    viewerPrevious.addEventListener(
      "click",
      showPreviousArtwork
    );

    viewerNext.addEventListener(
      "click",
      showNextArtwork
    );

    viewer.addEventListener(
      "click",
      event => {
        if (event.target === viewer) {
          closeViewer();
        }
      }
    );

    viewer.addEventListener(
      "touchstart",
      event => {
        viewerTouchStartX =
          event.changedTouches[0].screenX;
      },
      { passive: true }
    );

    viewer.addEventListener(
      "touchend",
      event => {
        const distance =
          event.changedTouches[0].screenX -
          viewerTouchStartX;

        if (Math.abs(distance) < 55) {
          return;
        }

        if (distance < 0) {
          showNextArtwork();
        } else {
          showPreviousArtwork();
        }
      },
      { passive: true }
    );

    document.addEventListener(
      "keydown",
      event => {
        if (event.key === "Escape") {
          if (
            viewer.classList.contains("open")
          ) {
            closeViewer();
          } else {
            closeMenu();
          }
        }

        if (
          event.key === "ArrowLeft" &&
          viewer.classList.contains("open")
        ) {
          showPreviousArtwork();
        }

        if (
          event.key === "ArrowRight" &&
          viewer.classList.contains("open")
        ) {
          showNextArtwork();
        }
      }
    );

    document
      .querySelectorAll(".menu-link")
      .forEach(link => {
        link.addEventListener(
          "click",
          closeMenu
        );
      });

    stereoHotspot.addEventListener(
      "click",
      () => {
        if (pointerTravel <= 8) {
          toggleStereo();
        }
      }
    );

    stereoPlayPause.addEventListener(
      "click",
      event => {
        event.stopPropagation();
        toggleStereo();
      }
    );

    stereoPrevious.addEventListener(
      "click",
      event => {
        event.stopPropagation();
        previousStereoTrack();
      }
    );

    stereoNext.addEventListener(
      "click",
      event => {
        event.stopPropagation();
        nextStereoTrack();
      }
    );

    workshopStereo.addEventListener(
      "play",
      updateStereoDisplay
    );

    workshopStereo.addEventListener(
      "pause",
      updateStereoDisplay
    );

    workshopStereo.addEventListener(
      "ended",
      nextStereoTrack
    );

    workshopStereo.addEventListener(
      "error",
      () => {
        showToast(
          "That track did not load. Trying the next one."
        );

        window.setTimeout(
          nextStereoTrack,
          550
        );
      }
    );

    document
      .getElementById("sewingHotspot")
      .addEventListener(
        "click",
        () => {
          if (pointerTravel <= 8) {
            showToast(
              "The upholstery room is coming soon."
            );
          }
        }
      );

    document
      .getElementById("dogHotspot")
      .addEventListener(
        "click",
        () => {
          if (pointerTravel <= 8) {
            thrownBall.classList.remove("fly");

            /* Force a reflow so repeated taps replay the throw. */
            void thrownBall.offsetWidth;

            thrownBall.classList.add("fly");

            showToast(
              "You throw the ball. Fin launches after it."
            );
          }
        }
      );

    document
      .getElementById("forestHotspot")
      .addEventListener(
        "click",
        () => {
          if (pointerTravel <= 8) {
            showToast(
              "The forest path is not open yet."
            );
          }
        }
      );

    window.addEventListener(
      "resize",
      calculateRoomBounds
    );

    window.addEventListener(
      "orientationchange",
      () => {
        window.setTimeout(
          calculateRoomBounds,
          250
        );
      }
    );

    loadArtworkData();
    loadStereoTrack(0, false);

    window.setTimeout(() => {
      try {
        if (!sessionStorage.getItem("workshopHintSeen")) {
          showToast(
            "Drag to look around. Tap what catches your eye."
          );
          sessionStorage.setItem(
            "workshopHintSeen",
            "1"
          );
        }
      } catch (error) {
        /* Storage can be blocked; the room still works fine. */
      }
    }, 850);

    window.setTimeout(() => {
      calculateRoomBounds();

      if (maxRoomX > 0) {
        roomX =
          Math.min(
            maxRoomX,
            maxRoomX * 0.2
          );

        renderRoomPosition();
      }
    }, 120);
  </script>
