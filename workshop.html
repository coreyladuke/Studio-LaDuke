<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >
  <title>Studio LaDuke Workshop</title>

  <style>
  <link rel="stylesheet" href="style.css">
  </style>
</head>

<body>

  <div
    class="background-fill"
    aria-hidden="true"
  ></div>

  <div
    class="scene-viewport"
    id="sceneViewport"
  >

    <main
      class="workshop"
      id="workshop"
      aria-label="Studio LaDuke creative workshop"
    >

      <button
        class="art-frame frame-1"
        data-frame-shape="landscape"
        type="button"
      >
        <img alt="Studio LaDuke artwork">
      </button>

      <button
        class="art-frame frame-2"
        data-frame-shape="landscape"
        type="button"
      >
        <img alt="Studio LaDuke artwork">
      </button>

      <button
        class="art-frame frame-3"
        data-frame-shape="portrait"
        type="button"
      >
        <img alt="Studio LaDuke artwork">
      </button>

      <button
        class="art-frame frame-4"
        data-frame-shape="portrait"
        type="button"
      >
        <img alt="Studio LaDuke artwork">
      </button>

      <button
        class="art-frame frame-5"
        data-frame-shape="portrait"
        type="button"
      >
        <img alt="Studio LaDuke artwork">
      </button>

      <button
        class="art-frame frame-6"
        data-frame-shape="portrait"
        type="button"
      >
        <img alt="Studio LaDuke artwork">
      </button>

      <button
        class="art-frame frame-7"
        data-frame-shape="portrait"
        type="button"
      >
        <img alt="Studio LaDuke artwork">
      </button>

      <button
        class="art-frame frame-8"
        data-frame-shape="portrait"
        type="button"
      >
        <img alt="Studio LaDuke artwork">
      </button>

      <button
        class="art-frame frame-9"
        data-frame-shape="portrait"
        type="button"
      >
        <img alt="Studio LaDuke artwork">
      </button>

      <a
        class="hotspot arcade-hotspot"
        href="mcbrides.html"
        aria-label="Enter McBride’s Arcade"
      ></a>

      <button
        class="hotspot pool-hotspot"
        id="poolHotspot"
        type="button"
        aria-label="Pool table"
      ></button>

      <button
        class="hotspot sewing-hotspot"
        id="sewingHotspot"
        type="button"
        aria-label="Sewing machine"
      ></button>

      <button
        class="hotspot dog-hotspot"
        id="dogHotspot"
        type="button"
        aria-label="Fin"
      ></button>

      <button
        class="hotspot forest-hotspot"
        id="forestHotspot"
        type="button"
        aria-label="Forest doorway"
      ></button>

    </main>

  </div>

  <div
    class="room-indicator"
    aria-hidden="true"
  >
    <span
      class="room-dot"
      id="roomDotLeft"
    ></span>

    <span
      class="room-dot active"
      id="roomDotCenter"
    ></span>

    <span
      class="room-dot"
      id="roomDotRight"
    ></span>
  </div>

  <button
    class="menu-button"
    id="menuButton"
    type="button"
    aria-label="Open navigation menu"
    aria-expanded="false"
  >
    <span class="menu-lines"></span>
  </button>

  <div
    class="menu-overlay"
    id="menuOverlay"
  ></div>

  <aside
    class="menu-panel"
    id="menuPanel"
    aria-label="Studio LaDuke navigation"
  >

    <h1 class="menu-title">
      Studio LaDuke
    </h1>

    <p class="menu-subtitle">
      Art, stories, music, and things still becoming.
    </p>

    <nav class="menu-links">

      <a class="menu-link" href="index.html">
        Front Room
      </a>

      <a class="menu-link" href="workshop.html">
        Workshop
      </a>

      <a
        class="menu-link gallery-link"
        href="gallery.html"
      >
        Gallery
      </a>

      <a
        class="menu-link arcade-link"
        href="mcbrides.html"
      >
        McBride’s Arcade
      </a>

      <a class="menu-link" href="books.html">
        Books
      </a>

      <a class="menu-link" href="bob.html">
        Bob’s Room
      </a>

      <a class="menu-link" href="about.html">
        About Corey
      </a>

    </nav>

    <div class="menu-footer">
      Made in Ketchikan, Alaska.<br>
      Pull up a chair.
    </div>

  </aside>

  <div
    class="viewer"
    id="viewer"
    role="dialog"
    aria-modal="true"
    aria-label="Artwork viewer"
  >

    <button
      class="viewer-arrow viewer-previous"
      id="viewerPrevious"
      type="button"
      aria-label="Previous artwork"
    >
      ‹
    </button>

    <img
      class="viewer-image"
      id="viewerImage"
      alt="Studio LaDuke artwork"
    >

    <button
      class="viewer-arrow viewer-next"
      id="viewerNext"
      type="button"
      aria-label="Next artwork"
    >
      ›
    </button>

    <button
      class="viewer-close"
      id="viewerClose"
      type="button"
    >
      ← Workshop
    </button>

    <a
      class="viewer-gallery"
      id="viewerGallery"
      href="gallery.html"
    >
      Full Gallery
    </a>

  </div>

  <div
    class="toast"
    id="toast"
    aria-live="polite"
  ></div>

  <script>
   <script src="script.js"></script>
  </script>

</body>
</html>
