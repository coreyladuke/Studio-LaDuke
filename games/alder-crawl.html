<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#121913">
  <title>Alder Crawl | Studio LaDuke</title>
  <style>
    * { box-sizing: border-box }
    html { color-scheme: dark; background: #111710; color: #eaf5c9 }
    body { display: grid; place-content: center; min-height: 100svh; margin: 0; padding: 12px; font: 16px system-ui,sans-serif; background: radial-gradient(ellipse at 50% 32%,#39513b,#111710 70%) }
    main { width: min(88vw,390px,calc((100svh - 146px) * .81)); min-width: min(250px,88vw); }
    header { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 5px 0; }
    a,button { color: inherit; font: inherit; text-underline-offset: 4px }
    a { min-height: 40px; display: grid; align-items: center; }
    .cabinet { position: relative; border: 10px solid #263923; border-radius: 21px; box-shadow: 0 15px 0 #18261a,0 22px 31px #000a, inset 0 0 18px #000; background: #0c170f; overflow: hidden }
    canvas { display: block; width: 100%; touch-action: none; cursor: crosshair }
    canvas:focus-visible { outline: 2px solid #edf1a8; outline-offset: -4px }
    .start { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; padding: 17px; text-align: center; background: #07140de6 }
    .start[hidden] { display: none }
    h1 { color: #e5ef9c; text-shadow: 2px 3px #6b8140; font: bold clamp(1.3rem,5vw,2.1rem) monospace; margin: 0; text-transform: uppercase }
    p { max-width: 240px; margin: 15px 0; line-height: 1.45; font-size: .85rem; }
    button { min-height: 44px; background: #e5edb4; color: #162011; padding: 0 19px; border: 0; border-radius: 50px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <header><a href="../forest-path.html">← Back Forty</a><output id="score">Score 0</output></header>
    <div class="cabinet">
      <canvas id="screen" width="320" height="400" tabindex="0" aria-label="Alder Crawl game. Drag to move and fire, or use the arrow keys and Space."></canvas>
      <section class="start" id="start">
        <h1>Alder Crawl</h1>
        <p id="instructions">Keep the bugs out of the ferns. Drag to move and fire. On a keyboard, use the arrows and Space.</p>
        <button id="play" type="button">Start game</button>
      </section>
    </div>
  </main>
  <script>
    const canvas=document.getElementById("screen");
    const ctx=canvas.getContext("2d");
    const overlay=document.getElementById("start");
    const message=document.getElementById("instructions");
    const play=document.getElementById("play");
    const score=document.getElementById("score");
    const keys=new Set();
    const width=canvas.width;
    const height=canvas.height;
    const launcherY=height-32;
    const ferns=Array.from({length:20},(_,i)=>({x:(i*83+27)%322,y:height-12-i%3*3}));
    let launcherX=width/2, bugs=[], shots=[], points=0, wave=0, playing=false;
    let pointer=null, direction=1, lastTime=0, timeToFire=0;
    const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));

    function addWave(){
      wave++;
      direction=1;
      bugs=Array.from({length:Math.min(wave+6,12)},(_,i)=>({x:39+(i%7)*35,y:39+Math.floor(i/7)*23}));
    }

    function endGame(){
      playing=false;
      keys.clear();
      pointer=null;
      message.textContent="The bugs found the ferns. You scored "+points+".";
      play.textContent="Play again";
      overlay.hidden=false;
      play.focus();
    }

    function draw(){
      ctx.fillStyle="#0e2116";
      ctx.fillRect(0,0,width,height);
      ctx.fillStyle="#183322";
      for(let y=10;y<height;y+=5) ctx.fillRect(0,y,width,1);
      ctx.fillStyle="#476a39";
      for(const fern of ferns){
        ctx.fillRect(fern.x,fern.y,2,14);
        ctx.fillRect(fern.x-5,fern.y+4,13,2);
        ctx.fillRect(fern.x-2,fern.y,7,2);
      }
      ctx.fillStyle="#d4ed95";
      ctx.fillRect(launcherX-8,launcherY,16,8);
      ctx.fillRect(launcherX-3,launcherY-7,6,9);
      ctx.fillStyle="#fff0b1";
      for(const shot of shots) ctx.fillRect(shot.x-1,shot.y,2,10);
      for(const bug of bugs){
        ctx.fillStyle="#a8d464";
        ctx.fillRect(bug.x-8,bug.y-5,16,10);
        ctx.fillStyle="#5b913f";
        ctx.fillRect(bug.x-11,bug.y-1,22,5);
        ctx.fillStyle="#f5b86a";
        ctx.fillRect(bug.x-4,bug.y-4,2,2);
        ctx.fillRect(bug.x+2,bug.y-4,2,2);
      }
    }

    function tick(time){
      const dt=Math.min((time-lastTime)/1000,.035);
      lastTime=time;
      if(playing){
        const steer=Number(keys.has("ArrowRight"))-Number(keys.has("ArrowLeft"));
        launcherX=clamp(launcherX+steer*210*dt,11,width-11);
        timeToFire-=dt;
        if((pointer!==null||keys.has(" "))&&timeToFire<=0){
          shots.push({x:launcherX,y:launcherY-12});
          timeToFire=.17;
        }

        const dx=(35+wave*8)*dt*direction;
        const turn=bugs.some(bug=>bug.x+dx<13||bug.x+dx>width-13);
        if(turn) direction*=-1;
        for(const bug of bugs){
          bug.x+=turn?-dx:dx;
          if(turn) bug.y+=16;
        }

        shots=shots.filter(shot=>{
          shot.y-=310*dt;
          const hit=bugs.findIndex(bug=>Math.abs(bug.x-shot.x)<10&&Math.abs(bug.y-shot.y)<9);
          if(hit<0) return shot.y>-10;
          bugs.splice(hit,1);
          points+=10;
          score.value="Score "+points;
          return false;
        });

        if(!bugs.length) addWave();
        if(bugs.some(bug=>bug.y>=launcherY-8)) endGame();
      }
      draw();
      requestAnimationFrame(tick);
    }

    function movePointer(event){
      const rect=canvas.getBoundingClientRect();
      launcherX=clamp(width*(event.clientX-rect.left)/rect.width,11,width-11);
    }
    canvas.addEventListener("pointerdown",event=>{
      if(!playing||pointer!==null) return;
      pointer=event.pointerId;
      canvas.setPointerCapture(pointer);
      movePointer(event);
    });
    canvas.addEventListener("pointermove",event=>{
      if(event.pointerId===pointer) movePointer(event);
    });
    canvas.addEventListener("lostpointercapture",event=>{
      if(event.pointerId===pointer) pointer=null;
    });
    canvas.addEventListener("keydown",event=>{
      if(!["ArrowLeft","ArrowRight"," "].includes(event.key)||!playing) return;
      event.preventDefault();
      keys.add(event.key);
    });
    window.addEventListener("keyup",event=>keys.delete(event.key));
    window.addEventListener("blur",()=>keys.clear());
    play.addEventListener("click",()=>{
      points=0;
      wave=0;
      shots=[];
      launcherX=width/2;
      timeToFire=0;
      playing=true;
      score.value="Score 0";
      addWave();
      overlay.hidden=true;
      canvas.focus();
    });
    requestAnimationFrame(tick);
  </script>
</body>
</html>
