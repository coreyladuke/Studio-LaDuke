<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#120d20">
  <title>Prism Pals | Maverick Games</title>
  <style>
    :root{color-scheme:dark;--cream:#fff1cf;--violet:#251732;--edge:#e7d5ff;--pink:#ff5fa1;--cyan:#70dcff;--gold:#ffe16b}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090713;color:var(--cream);font-family:"Trebuchet MS",system-ui,sans-serif}
    [hidden]{display:none!important}button,a{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #fff4a9;outline-offset:5px}
    .opening{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:#0d0917;isolation:isolate}
    .screen{position:relative;width:min(100vw,1280px);height:min(100vh,720px);overflow:hidden;background:#171028;box-shadow:0 25px 100px #000}
    #story{display:block;width:100%;height:100%;background:#171028}
    .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff1 4px);mix-blend-mode:soft-light;opacity:.28}
    .brand{position:absolute;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));font:900 clamp(11px,1.6vw,17px)/1 ui-monospace,monospace;letter-spacing:.24em;color:#fff4d0;text-shadow:0 2px 8px #000}
    .caption{position:absolute;left:50%;bottom:max(17px,env(safe-area-inset-bottom));width:min(78%,760px);min-height:3.2em;transform:translateX(-50%);display:grid;place-items:center;padding:.6em 1.8em;border:2px solid #f8e5bd;border-radius:50%;background:#171020e8;box-shadow:0 8px 25px #0009;color:#fff8df;text-align:center;font:700 clamp(14px,2.1vw,21px)/1.3 Georgia,serif;transition:opacity .25s}
    .controls{position:absolute;z-index:4;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:9px}
    .tag{display:grid;place-items:center;min-width:50px;min-height:46px;padding:.55em 1em;border:2px solid #d9d1ee;color:#fff;background:linear-gradient(160deg,#342240,#170f25);box-shadow:0 5px 0 #090510;text-decoration:none;font-weight:900;cursor:pointer;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
    .launch{position:absolute;z-index:5;right:max(22px,env(safe-area-inset-right));bottom:max(23px,env(safe-area-inset-bottom));width:clamp(108px,15vw,170px);aspect-ratio:1;border:0;color:#211329;background:radial-gradient(circle at 34% 28%,#fff6bb 0 11%,#ffe16b 32%,#ff8e42 62%,#a72d56 100%);filter:drop-shadow(0 9px 0 #39142f) drop-shadow(0 0 15px #ffcc66aa);font:1000 clamp(13px,1.8vw,20px)/1.05 ui-monospace,monospace;letter-spacing:.06em;cursor:pointer;clip-path:polygon(50% 0,61% 28%,88% 12%,73% 39%,100% 50%,72% 61%,88% 88%,61% 73%,50% 100%,39% 73%,12% 88%,27% 61%,0 50%,28% 39%,12% 12%,39% 28%);transform:scale(.88);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .35s}
    .opening.ready .launch{transform:scale(1);opacity:1;pointer-events:auto}.opening.ready .caption{padding-right:min(19vw,190px)}
    .loading{position:fixed;inset:0;z-index:7;display:grid;place-items:center;background:radial-gradient(circle,#33214c,#0a0712);font:900 clamp(15px,3vw,25px) ui-monospace,monospace;letter-spacing:.2em;color:#fff0c3}.loading:after{content:"";width:55px;height:55px;margin-left:18px;border:7px solid #ffffff22;border-top-color:#ffe16b;border-radius:50%;animation:spin .8s linear infinite}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#171326}.shelf{position:fixed;z-index:8;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left))}
    @keyframes spin{to{transform:rotate(1turn)}}
    @media(orientation:portrait){.screen{width:100vw;height:100vh}.brand{top:max(72px,calc(env(safe-area-inset-top) + 62px));left:18px}.controls{top:max(72px,calc(env(safe-area-inset-top) + 62px))}.caption{bottom:max(22px,env(safe-area-inset-bottom));width:92%;font-size:14px;min-height:4.3em;padding-inline:1.2em}.launch{width:108px;right:10px;bottom:max(18px,env(safe-area-inset-bottom))}.opening.ready .caption{padding-right:108px;text-align:left}}
    @media(prefers-reduced-motion:reduce){.scan{display:none}.launch{transition:none}.loading:after{animation:none}}
  </style>
</head>
<body>
  <section class="opening" id="opening" aria-label="Prism Pals animated story opening">
    <div class="screen"><canvas id="story" width="1280" height="720" aria-label="Pip and the Prism Pals chase the creature that stole the living spectrum"></canvas><div class="scan" aria-hidden="true"></div></div>
    <div class="brand">PRISM PALS · FIRST CONTACT</div>
    <nav class="controls" aria-label="Opening controls"><a class="tag" href="../directory.html#cartridges">Shelf</a><button class="tag" id="skip" type="button">Skip story</button></nav>
    <p class="caption" id="caption" aria-live="polite">Above the rain, Pip keeps the living spectrum in tune.</p>
    <button class="launch" id="play" type="button" aria-label="Start playing Prism Pals">START<br>THE CHASE</button>
  </section>
  <div class="loading" id="loading" hidden>LOADING THE SPECTRUM</div>
  <a class="tag shelf" id="shelf" href="../directory.html#cartridges" hidden>← Shelf</a>
  <iframe id="game" title="Prism Pals game" hidden allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
  <script src="prism-opening.js"></script>
</body>
</html>
