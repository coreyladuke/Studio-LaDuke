<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#211b30">
  <title>Prism Pals | Maverick Games</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: radial-gradient(ellipse at 44% 25%, #524165, #291e39 56%, #1b1425 100%);
      color: #f8eaf5;
      font: 1rem/1.45 Georgia, serif;
    }
    [hidden] { display: none !important; }
    a { color: inherit; text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid #ffe397; outline-offset: 4px; }
    main {
      display: grid;
      min-height: 100dvh;
      width: min(calc(100% - 2.2rem), 61rem);
      margin: auto;
      padding: 2rem 0;
      align-content: center;
      grid-template-columns: minmax(0, 1fr) minmax(16rem, .88fr);
      align-items: center;
      gap: clamp(1.1rem, 5vw, 3.2rem);
    }
    main img {
      display: block;
      width: 100%;
      max-width: 450px;
      height: auto;
      margin-inline: auto;
      transform: rotate(-4deg);
      filter: drop-shadow(0 15px 11px #0e0914c9);
    }
    h1 { margin: 0; font-size: clamp(2.35rem, 6vw, 4.4rem); line-height: 1; letter-spacing: -.045em; }
    p { max-width: 25rem; margin: .75rem 0 1.05rem; }
    nav { display: flex; flex-wrap: wrap; gap: .35rem 1.4rem; }
    nav a, .shelf { display: inline-flex; align-items: center; min-height: 44px; }
    .start { font-weight: 700; color: #ffdd96; }
    .shelf {
      position: fixed;
      z-index: 2;
      top: max(8px, env(safe-area-inset-top));
      left: max(8px, env(safe-area-inset-left));
      padding-inline: .65rem;
      background: #f1dfc8;
      color: #342215;
      box-shadow: 2px 3px #100a15;
    }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #211b30; }
    @media (max-width: 600px) {
      main { grid-template-columns: 1fr; align-content: start; padding-top: 1.6rem; }
      main img { width: min(70vw, 320px); }
    }
  </style>
</head>
<body>
  <main id="prism-intro">
    <img src="../assets/cartridge-prism.webp" alt="" width="497" height="489">
    <section aria-labelledby="prism-title">
      <h1 id="prism-title">Prism Pals</h1>
      <p>Help Pip bring the living spectrum back into tune.</p>
      <nav aria-label="Prism Pals">
        <a class="start" id="prism-start" href="https://prism-pals-playtest.vercel.app/">Start game</a>
        <a href="../directory.html#cartridges">Back to the shelf</a>
      </nav>
    </section>
  </main>
  <a class="shelf" id="prism-shelf" href="../directory.html#cartridges" hidden>← Back to the shelf</a>
  <iframe id="prism-game" title="Prism Pals game" hidden allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
  <script>
    const intro = document.getElementById("prism-intro");
    const start = document.getElementById("prism-start");
    const shelf = document.getElementById("prism-shelf");
    const game = document.getElementById("prism-game");

    function launchPrism() {
      game.src = start.href;
      intro.hidden = true;
      game.hidden = false;
      shelf.hidden = false;
      game.focus();
    }

    start.addEventListener("click", event => {
      if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      launchPrism();
    });

    if (new URLSearchParams(location.search).get("play") === "1") launchPrism();
  </script>
</body>
</html>
