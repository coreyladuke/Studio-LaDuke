<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#211b30">
  <title>Prism Pals | Maverick Games</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: linear-gradient(90deg,#17101845,#191320b8), #241c32 url("../assets/prism-workbench.webp") center / cover fixed;
      color: #f8eaf5;
      font: 1rem/1.45 Georgia, serif;
    }
    [hidden] { display: none !important; }
    a { color: inherit; text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid #ffe397; outline-offset: 4px; }
    main {
      display: grid;
      min-height: 100dvh;
      width: min(calc(100% - 2.2rem), 61rem);
      margin: auto;
      padding: 2rem 0;
      align-content: center;
      grid-template-columns: minmax(0, 1fr) minmax(16rem, .88fr);
      align-items: center;
      gap: clamp(1.1rem, 7vw, 5rem);
    }
    main img {
      display: block;
      width: 100%;
      max-width: 450px;
      height: auto;
      margin-inline: auto;
      transform: rotate(-7deg);
      filter: drop-shadow(3px 17px 10px #0b0711);
      transition:transform .2s ease;
    }
    .prism-cart:hover img, .prism-cart:focus-visible img { transform:translateY(-5px) rotate(-3deg) }
    .launch-copy { text-shadow:0 2px 8px #171017, 0 1px 2px #150e18 }
    h1 { margin: 0; font-size: clamp(2.75rem, 7.5vw, 6rem); line-height: 1; letter-spacing: -.045em; }
    p { max-width: 25rem; margin: .75rem 0 1.05rem; }
    nav { display: flex; flex-wrap: wrap; gap: .35rem 1.4rem; }
    nav a, .shelf { display: inline-flex; align-items: center; min-height: 44px; }
    .start { font-weight: 700; color: #ffdd96; }
    .shelf {
      position: fixed;
      z-index: 2;
      top: max(8px, env(safe-area-inset-top));
      left: max(8px, env(safe-area-inset-left));
      padding-inline: .55rem;
      background: #201829;
      color: #fff0d5;
      box-shadow: 0 2px 6px #100a15c9;
    }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #211b30; }
    @media (max-width: 600px) {
      body { background-attachment:scroll }
      main { grid-template-columns: 1fr; align-content: center; padding-block:1.6rem }
      main img { width: min(70vw, 320px); }
    }
    @media (prefers-reduced-motion: reduce) {
      main img { transition:none }
      .prism-cart:is(:hover,:focus-visible) img { transform:rotate(-7deg) }
    }
  </style>
</head>
<body>
  <main id="prism-intro">
    <a class="prism-cart" href="https://prism-pals-playtest.vercel.app/" aria-label="Insert the Prism Pals cartridge">
      <img src="../assets/cartridge-prism.webp" alt="" width="497" height="489">
    </a>
    <section class="launch-copy" aria-labelledby="prism-title">
      <h1 id="prism-title">Prism Pals</h1>
      <p>Help Pip bring the living spectrum back into tune.</p>
      <nav aria-label="Prism Pals">
        <a class="start" id="prism-start" href="https://prism-pals-playtest.vercel.app/">Start game</a>
        <a href="../directory.html#cartridges">Back to the shelf</a>
      </nav>
    </section>
  </main>
  <a class="shelf" id="prism-shelf" href="../directory.html#cartridges" hidden>← Back to the shelf</a>
  <iframe id="prism-game" title="Prism Pals game" hidden allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
  <script>
    const intro = document.getElementById("prism-intro");
    const start = document.getElementById("prism-start");
    const shelf = document.getElementById("prism-shelf");
    const game = document.getElementById("prism-game");

    function launchPrism() {
      game.src = start.href;
      intro.hidden = true;
      game.hidden = false;
      shelf.hidden = false;
      game.focus();
    }

    for (const control of [start, document.querySelector(".prism-cart")]) {
      control.addEventListener("click", event => {
        if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        launchPrism();
      });
    }

    if (new URLSearchParams(location.search).get("play") === "1") launchPrism();
  </script>
</body>
</html>
