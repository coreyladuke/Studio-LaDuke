<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#160f0a">
  <title>McBride’s Arcade | Studio LaDuke</title>
  <style>
    * { box-sizing: border-box }
    html { min-height: 100%; background: #160f0a; color: #f1d6a6 }
    body { min-height: 100svh; margin: 0; display: grid; grid-template-columns: minmax(0,1fr); align-content: center; font-family: Georgia, serif; }
    .arcade { width: min(100%, 1440px, calc((100svh - 70px) * 1.5)); min-width: 0; margin-inline: auto; }
    .sign { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; gap: 12px; }
    h1 { margin: 0; font-size: clamp(1.1rem, 2.6vw, 1.7rem); font-weight: normal; text-align: right; }
    .sign a { min-height: 44px; display: grid; align-items: center; color: inherit; text-underline-offset: 4px; }
    .walkway { overflow-x: auto; scrollbar-color: #8e603c #291810; scroll-snap-type: x proximity; }
    .room { position: relative; aspect-ratio: 3 / 2; min-width: 760px; isolation: isolate; }
    .room > img { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; }
    .cabinet {
      position: absolute;
      top: 18.3%;
      bottom: 7.9%;
      left: var(--left);
      width: 17.1%;
      color: var(--light);
      text-decoration: none;
      scroll-snap-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .cabinet-name {
      position: absolute;
      top: 1.3%;
      left: 8%;
      right: 8%;
      height: 10.5%;
      display: grid;
      place-items: center;
      text-align: center;
      text-transform: uppercase;
      font: 800 clamp(14px, 1.55vw, 22px)/1 system-ui, sans-serif;
      letter-spacing: .05em;
      text-shadow: 0 0 13px currentColor, 0 2px #1e1711;
    }
    .cabinet::after {
      content: "";
      position: absolute;
      inset: 20% 16% 61%;
      border-radius: 13%;
      background: radial-gradient(ellipse, color-mix(in srgb, var(--light) 50%, transparent), transparent 78%);
      mix-blend-mode: screen;
      opacity: .26;
      transition: opacity .25s ease;
      pointer-events: none;
    }
    .cabinet:is(:hover, :focus-visible, :active)::after { opacity: 1 }
    .cabinet:focus-visible { outline: 2px solid currentColor; outline-offset: -3px; }
    .walk-note { display: none; margin: 0; text-align: center; padding: 12px; font: 14px system-ui, sans-serif; }
    @media (max-width: 800px), (max-height: 620px) {
      .arcade { width: 100% }
      .walk-note { display: block }
    }
    @media (max-width: 600px) {
      .arcade { display: flex; flex-direction: column }
      .walk-note { order: 1; padding: 4px 12px 11px }
      .walkway { order: 2 }
    }
    @media (max-height: 530px) and (orientation: landscape) {
      body { align-content: start }
      .arcade { width: 100% }
      .sign { padding-block: 0 }
    }
    @media (prefers-reduced-motion: reduce) { .cabinet::after { transition: none } }
  </style>
</head>
<body>
  <main class="arcade">
    <header class="sign">
      <a href="workshop.html">← Workshop</a>
      <h1>McBride’s Arcade</h1>
    </header>
    <nav class="walkway" aria-label="Playable arcade cabinets">
      <div class="room">
        <img src="assets/mcbrides-cabinet-row.webp" alt="" width="1536" height="1024" draggable="false">
        <a class="cabinet" style="--left:5.25%;--light:#ffd18e" href="komplant-cabinet.html"><span class="cabinet-name">Mortal KomPlant</span></a>
        <a class="cabinet" style="--left:23.4%;--light:#ffe89c" href="mavericks-fort.html?gamePreview=1"><span class="cabinet-name">Super Maverick’s World</span></a>
        <a class="cabinet" style="--left:41.3%;--light:#cbedc2" href="games/heimr.html"><span class="cabinet-name">HEIMR</span></a>
        <a class="cabinet" style="--left:59.35%;--light:#f3ccff" href="games/prism.html"><span class="cabinet-name">Prism Pals</span></a>
        <a class="cabinet" style="--left:77.4%;--light:#c0f5f2" href="pool.html?from=arcade"><span class="cabinet-name">Mav &amp; Dad’s Pool</span></a>
      </div>
    </nav>
    <p class="walk-note">Swipe along the cabinets</p>
  </main>
</body>
</html>
