<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Inside Studio LaDuke</title><link rel="stylesheet" href="assets/house-visit.css"></head>
<body><main aria-label="Studio LaDuke dimensional house">
<canvas id="world" tabindex="0" aria-label="Room view. Drag to look. Use W A S D to walk, arrow keys to look, and Enter to inspect."></canvas>
<div id="fallback" hidden><img src="assets/front-room-wide.webp" alt="Approved photographic view of Front Hall"><a href="house.html?room=foyer">Enter the photographic walk</a></div>
<header class="visit-heading"><a href="index.html">Studio LaDuke</a><h1 id="room-title">Front Hall</h1><p>Dimensional preview</p></header>
<nav class="visit-links" aria-label="House views"><a href="house.html?room=foyer">Photographic walk</a><a href="house-layout.html">House map</a><button id="rain" aria-pressed="false">Rain sound</button></nav>
<div id="look-target" aria-hidden="true"><span></span></div><button id="interact" hidden></button>
<div class="visit-movement" aria-label="Movement">
<button id="left-look" aria-label="Turn left">‹</button><button id="advance">Walk</button><button id="right-look" aria-label="Turn right">›</button><button id="recede">Back</button>
</div>
<details id="objects"><summary>Nearby objects</summary><div id="nearby"></div></details>
<p id="visit-status" role="status" aria-live="polite"></p>
<p class="visit-help">Drag to look · Hold Walk to move · Tap an object to inspect</p>
<dialog id="visit-inspect"><form method="dialog"><button aria-label="Close inspection">×</button></form><h2 id="inspect-title"></h2><div id="inspect-content"></div></dialog>
<audio id="ambient-rain" src="audio/front-room-rain.mp3" loop preload="none"></audio>
</main><script type="module" src="assets/house-visit.mjs"></script></body></html>
