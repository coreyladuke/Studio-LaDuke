<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#21160f">
  <meta name="description" content="The Studio LaDuke library in Ketchikan, Alaska. Open Corey LaDuke’s memoir, Everybody Deserves to Go Home.">
  <title>Books | Studio LaDuke</title>
  <style>
    * { box-sizing:border-box }
    body { margin:0; min-height:100dvh; background:#21160f; color:#f4e9d4; font:1rem/1.55 Georgia,serif }
    a { color:inherit; text-underline-offset:.25em }
    a:focus-visible, button:focus-visible { outline:3px solid #facc7a; outline-offset:5px }
    .topbar { display:flex; justify-content:space-between; flex-wrap:wrap; gap:.25rem 1rem; padding:.45rem clamp(1rem, 5vw, 4rem); background:#20130e; border-bottom:1px solid #8e6c4999 }
    .topbar a, .topbar button, footer a { display:inline-flex; align-items:center; min-height:44px }
    .topbar button { border:0; padding:0; background:none; color:#f2d09a; font:inherit; text-decoration:underline; text-underline-offset:.25em; cursor:pointer }
    .desk {
      position:relative;
      isolation:isolate;
      display:grid;
      grid-template-columns:minmax(0, 1.05fr) minmax(0, 1fr);
      align-items:center;
      gap:clamp(2rem, 7vw, 7rem);
      padding:clamp(2rem, 8vw, 8rem) clamp(1rem, 8vw, 8rem);
      min-height:min(740px, 82svh);
      background:linear-gradient(270deg,#160e07e8 4%,#20140dc7 31%,transparent 76%), #322219 url("assets/writing-desk.webp") center / cover;
    }
    .desk::before { content:""; position:absolute; z-index:-1; inset:0; background:#100f1bc4; opacity:0; transition:opacity .35s }
    .lights-off .desk::before { opacity:1 }
    .book-stage { display:grid; justify-items:center; gap:1rem; perspective:1200px }
    .book {
      position:relative;
      width:min(100%, 230px);
      aspect-ratio:620 / 945;
      padding:0;
      border:0;
      border-radius:2px 7px 6px 2px;
      background:#ddcaa4;
      box-shadow:6px 5px #ab9470, 11px 12px #1b211f, 15px 25px 28px #100803e3;
      color:#2b201a;
      font:inherit;
      cursor:pointer;
      transform:rotate(-7deg) rotateX(8deg);
    }
    .cover, .inside { position:absolute; inset:0; border-radius:inherit }
    .cover {
      display:grid;
      transform-origin:left center;
      transition:transform .52s ease;
      background:#132f40;
      box-shadow:inset 8px 0 7px #0005;
      backface-visibility:hidden;
    }
    .cover img { width:100%; height:100%; display:block; border-radius:inherit }
    .inside {
      display:grid;
      align-content:center;
      gap:.9rem;
      padding:1.25rem;
      background:linear-gradient(90deg,#a79071 0%,#e5d1a9 8%,#f2e1bc 97%,#cbb389);
      text-align:center;
    }
    .inside strong { font-size:1.25rem; line-height:1.2 }
    .book[aria-expanded="true"] .cover { transform:rotateY(-105deg) }
    .tap-note { text-shadow:0 2px 4px #000, 0 0 8px #000 }
    h1 { max-width:12ch; margin:.2rem 0 .7rem; font-size:clamp(2.85rem, 5.6vw, 5.5rem); font-weight:500; line-height:.95; letter-spacing:-.045em }
    .book-copy > p { margin:0 0 .5rem; max-width:33ch }
    .book-copy .byline { font-size:1.12rem; color:#ffdb9f }
    .book-copy a { display:inline-flex; align-items:center; min-height:44px; margin-top:.3rem }
    footer { display:flex; justify-content:space-between; flex-wrap:wrap; gap:0 1rem; padding:.65rem clamp(1rem, 5vw, 4rem); background:#20130e; border-top:1px solid #8e6c4999 }
    footer nav { display:flex; flex-wrap:wrap; gap:0 1.1rem }
    @media(max-width:700px) {
      .desk { grid-template-columns:1fr; gap:1.75rem; padding:1.7rem 1.15rem 2rem; background-position:46% center }
      .book-copy { grid-row:1 }
      .book { width:clamp(128px, 46vw, 205px) }
    }
    @media(prefers-reduced-motion:reduce) { .desk::before, .cover { transition:none } }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="index.html">Studio LaDuke</a>
    <button type="button" id="lamp-button" aria-pressed="true">Desk lamp on</button>
  </header>
  <main class="desk" aria-labelledby="book-title">
    <div class="book-stage">
      <button class="book" id="memoir" type="button" aria-label="Open or close Everybody Deserves to Go Home" aria-expanded="false" aria-controls="inside-cover">
        <span class="inside" id="inside-cover" aria-hidden="true">
          <strong>Everybody Deserves to Go Home</strong>
          <span>A memoir in progress</span>
          <span>Corey LaDuke<br>Ketchikan, Alaska</span>
        </span>
        <span class="cover"><img src="assets/everybody-home-cover.webp" alt="" width="620" height="945"></span>
      </button>
      <span id="tap-note" class="tap-note">Tap the cover to open it</span>
    </div>
    <section class="book-copy">
      <p>The library</p>
      <h1 id="book-title">Everybody Deserves to Go Home</h1>
      <p class="byline">A memoir by Corey LaDuke</p>
      <p>In progress.</p>
      <a href="projects.html#books">Other books in the works</a>
    </section>
  </main>
  <footer>
    <nav aria-label="Studio navigation">
      <a href="directory.html">Directory</a>
      <a href="workshop.html">Workshop</a>
      <a href="about.html">About Corey</a>
    </nav>
  </footer>
  <script>
    const memoir = document.getElementById("memoir");
    const inside = document.getElementById("inside-cover");
    const note = document.getElementById("tap-note");
    const lamp = document.getElementById("lamp-button");

    memoir.addEventListener("click", () => {
      const isOpen = memoir.getAttribute("aria-expanded") === "false";
      memoir.setAttribute("aria-expanded", isOpen);
      inside.setAttribute("aria-hidden", !isOpen);
      note.textContent = isOpen ? "Tap again to close the cover" : "Tap the cover to open it";
    });
    lamp.addEventListener("click", () => {
      const isOff = document.body.classList.toggle("lights-off");
      lamp.setAttribute("aria-pressed", !isOff);
      lamp.textContent = isOff ? "Desk lamp off" : "Desk lamp on";
    });
  </script>
</body>
</html>
