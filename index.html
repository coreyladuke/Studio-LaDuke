<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Studio LaDuke</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    body {
      min-height: 100svh;

      /* Wide front room for desktop */
      background-image:
        url("54EFFD92-C1F7-4A3E-BADE-CE8296F147E3.png");

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    /*
      Invisible clickable area positioned only over
      the COME IN button baked into the image.
    */
    .enter {
      position: fixed;
      left: 50%;
      top: 61%;
      z-index: 20;

      width: 190px;
      height: 68px;

      transform: translate(-50%, -50%);

      display: block;
      border-radius: 10px;

      -webkit-tap-highlight-color: transparent;
    }

    .enter:hover,
    .enter:focus-visible {
      outline: 2px solid rgba(245, 205, 125, 0.75);
      outline-offset: 3px;
      background: rgba(255, 210, 120, 0.08);
    }

    /* Vertical front room for phones */
    @media (max-width: 650px) {
      body {
        background-image:
          url("6ED5F01B-E9C3-40BD-8B1A-5F55CC572F51.png");

        background-size: cover;
        background-position: center top;
      }

      .enter {
        top: 58%;
        width: 170px;
        height: 62px;
      }
    }
  </style>
</head>

<body>
  <a
    class="enter"
    href="workshop.html"
    aria-label="Come into Studio LaDuke"
  ></a>
</body>
</html>
