<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Studio LaDuke</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    body {
      min-height: 100svh;
      font-family: Georgia, "Times New Roman", serif;
    }

    /* Keep the artwork and its clickable areas in the same coordinate system. */

    .front-room {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 1;

      width: max(100vw, calc(100svh * 1.5));
      height: max(100svh, calc(100vw / 1.5));

      background:
        url("assets/front-room-wide.webp")
        center / 100% 100% no-repeat;

      transform: translate(-50%, -50%);
    }

    button,
    a {
      font: inherit;
    }

    /* COME IN hotspot over the button inside the artwork */

    .enter {
      position: absolute;
      left: 47.45%;
      top: 70%;
      z-index: 20;

      width: 12.5%;
      height: 6%;

      transform: translate(-50%, -50%);

      display: grid;
      place-items: center;
      border: 4px solid #2c190e;
      border-radius: 2px;
      overflow: hidden;
      background:
        linear-gradient(90deg,transparent 0 47%,#2a160a 48% 52%,transparent 53%),
        repeating-linear-gradient(90deg,#5a321a 0 17%,#704322 18% 32%,#4d2a16 33% 49%);
      box-shadow: inset 0 0 0 2px #9a6632, inset 0 0 18px #120905, 0 8px 12px #000a;
      color: transparent;

      -webkit-tap-highlight-color: transparent;
    }

    .enter::before {
      content: "STUDIO";
      position: absolute;
      left: 12%;
      top: 18%;
      padding: .22em .45em;
      color: #26190e;
      background: #bc9a5f;
      border: 1px solid #4d351b;
      box-shadow: 0 2px 2px #0008;
      font: 700 clamp(5px, .62vw, 10px)/1 Georgia, serif;
      letter-spacing: .08em;
      transform: rotate(-1deg);
    }

    .enter::after {
      content: "";
      position: absolute;
      right: 12%;
      top: 42%;
      width: 12%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffe5a1, #9b681f 48%, #352008 75%);
      box-shadow: 0 2px 3px #000b, 0 0 5px #ffd87355;
    }

    .enter:hover,
    .enter:focus-visible {
      outline: 2px solid rgba(245, 205, 125, 0.8);
      outline-offset: 3px;
      filter: brightness(1.18);
      transform: translate(-50%, -50%) perspective(100px) rotateY(-4deg);
    }

    /* Front-room interactions */

    .room-dimmer,
    .lamp-glow,
    .rain-layer {
      position: absolute;
      pointer-events: none;
    }

    .room-dimmer {
      inset: 0;
      z-index: 5;
      background: rgba(3, 4, 7, 0.48);
      opacity: 0;
      transition: opacity 420ms ease;
    }

    .lamp-glow {
      left: -2%;
      top: 10%;
      z-index: 6;
      width: 14%;
      height: 37%;
      border-radius: 50%;
      background:
        radial-gradient(
          ellipse at 42% 44%,
          rgba(255, 218, 139, 0.32),
          rgba(255, 174, 59, 0.11) 38%,
          transparent 72%
        );
      filter: blur(7px);
      opacity: 0.72;
      transition: opacity 350ms ease;
    }

    .front-room.lamp-off .room-dimmer {
      opacity: 0.28;
    }

    .front-room.lamp-off .lamp-glow {
      opacity: 0;
    }

    .mounted-art-wall { position:absolute; inset:0; z-index:4; pointer-events:none }
    .mounted-art {
      position:absolute;
      overflow:hidden;
      display:grid;
      place-items:center;
      pointer-events:auto;
      transform-origin:0 0;
      background:#c8ab86;
      isolation:isolate;
    }

    .mounted-art.mount-tall { display:none }
    @media (max-width: 650px) {
      .mounted-art.mount-wide { display:none }
      .mounted-art.mount-tall { display:grid }
    }

    .mounted-art img {
      display:block;
      width:100%;
      height:100%;
      max-height:100%;
      min-height:0;
      object-fit:contain;
      filter:brightness(.79) contrast(.94) saturate(.88);
    }

    .mounted-art::after {
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:linear-gradient(119deg,#fff5da35,transparent 29%,transparent 69%,#48301c3d);
      box-shadow:inset 1px 2px 5px #2313069c;
    }

    .mounted-art:hover img, .mounted-art:focus-visible img { filter:brightness(.92) contrast(.96) saturate(.94) }
    .mounted-art:focus-visible { outline:3px solid #f2bf72; outline-offset:2px }
    .mounted-art.lamp { clip-path:polygon(0 0,36% 0,25% 22%,30% 34%,100% 53%,100% 100%,0 100%) }
    .mounted-art.pencils { clip-path:polygon(0 0,100% 0,100% 82%,80% 79%,62% 100%,4% 100%,4% 66%,0 64%) }
    .mounted-art.tablet { background:#bdb6a9; border-radius:7px }
    .mounted-art.tablet::after { background:linear-gradient(109deg,#161d28a1,transparent 65%,#e6dbc945) }
    .mounted-art.cover-on-shelf {
      left:2.8%;
      top:49%;
      width:7.2%;
      height:16%;
      z-index:4;
      pointer-events:none;
      background:#211b13;
      transform:skew(8deg,-9deg);
    }
    .cover-on-shelf img { object-fit:fill; filter:brightness(.79) saturate(.93) }

    .rain-layer { inset:0; z-index:7; opacity:0; transition:opacity .5s ease; pointer-events:none }
    .front-room.raining .rain-layer { opacity:1 }
    .wet-pane {
      position:absolute;
      overflow:hidden;
      background:
        radial-gradient(ellipse at 22% 20%,#dad9cf24,transparent 55%),
        linear-gradient(155deg,#516d7627,#17222b4a);
      backdrop-filter:brightness(.68) saturate(.62);
      -webkit-backdrop-filter:brightness(.68) saturate(.62);
      mask-image: linear-gradient(#000 0 90%, transparent);
    }
    .wet-pane .bead {
      position:absolute;
      width:var(--size);
      height:calc(var(--size) * 1.22);
      border-radius:47% 53% 61% 39%;
      opacity:var(--alpha);
      background:radial-gradient(ellipse at 32% 23%, #fff8d9b0, transparent 41%), #151d263c;
      box-shadow:0 .6px 1px #07191ba3;
    }
    .wet-pane .rivulet {
      position:absolute;
      width:1px;
      opacity:.38;
      border-radius:85% 85% 55% 55%;
      background:linear-gradient(transparent,#202f3b50,#eaf3f967);
      box-shadow:1px 0 #edf9f737, -1px 0 #14232a27;
    }
    .front-room.raining .wet-pane .rivulet { animation:glass-rain var(--speed) ease-in-out var(--delay) infinite }
    @keyframes glass-rain {
      0%,100% { opacity:.15; transform:translateY(-8px) }
      65% { opacity:.62 }
      85% { opacity:.19; transform:translateY(30px) }
    }
    .rain-sound {
      position:absolute;
      top:8%; left:57%; z-index:17;
      min-height:44px; padding:0 12px;
      border:1px solid #d5b782; border-radius:6px;
      color:#fff0d1; background:#22251f;
      font:700 .8rem system-ui,sans-serif;
      cursor:pointer;
    }
    .rain-sound:focus-visible { outline:2px solid #ffe4a4; outline-offset:3px }

    .room-hotspot,
    .picture-nav {
      position: absolute;
      z-index: 15;
      display: block;
      padding: 0;
      border: 0;
      border-radius: 10px;
      color: transparent;
      background: transparent;
      cursor: pointer;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .room-hotspot::after,
    .picture-nav::after {
      content: "";
      position: absolute;
      inset: 4%;
      border: 1px solid transparent;
      border-radius: inherit;
      transition:
        border-color 160ms ease,
        background 160ms ease,
        box-shadow 160ms ease;
    }

    .room-hotspot:hover::after,
    .room-hotspot:focus-visible::after,
    .picture-nav:hover::after,
    .picture-nav:focus-visible::after {
      border-color: rgba(245, 205, 125, 0.72);
      background: rgba(255, 210, 120, 0.07);
      box-shadow: 0 0 18px rgba(236, 180, 77, 0.25);
    }

    .lamp-hotspot {
      left: 0;
      top: 13.8%;
      width: 8.2%;
      height: 28.5%;
    }

    .guitar-hotspot {
      left: 18.1%;
      top: 34.2%;
      width: 14.1%;
      height: 43.5%;
      border-radius: 46%;
    }

    .bob-hotspot {
      left: 29.1%;
      top: 29.7%;
      z-index: 16;
      width: 11.4%;
      height: 17.2%;
      border-radius: 45%;
    }

    .book-hotspot {
      left: 2.5%;
      top: 47.2%;
      width: 9.3%;
      height: 18.1%;
    }

    .window-hotspot {
      left: 29.1%;
      top: 4.8%;
      width: 41.4%;
      height: 42.3%;
    }

    .window-trail {
      position: absolute;
      top: 8%;
      left: 50%;
      z-index: 17;
      display: grid;
      place-items: center;
      min-height: 44px;
      padding: 0 13px;
      transform: translateX(-50%);
      border: 1px solid #d5b782;
      border-radius: 6px;
      color: #fff0d1;
      background: #1d251e;
      font: 700 0.83rem system-ui, sans-serif;
      text-decoration: none;
    }

    .window-trail[hidden] { display: none; }
    .window-trail:hover, .window-trail:focus-visible {
      outline: 2px solid #ffe4a4;
      outline-offset: 3px;
    }

    .brain-secret {
      left: 45.7%;
      top: 57.2%;
      z-index: 18;
      width: 3%;
      height: 5%;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 350ms ease, filter 350ms ease;
    }

    .brain-secret[hidden] { display: none; }

    .brain-secret::before {
      content: "✦";
      position: absolute;
      inset: -22%;
      display: grid;
      place-items: center;
      color: #ffd47a;
      background: radial-gradient(circle, rgba(255, 199, 88, 0.26), transparent 68%);
      border-radius: 50%;
      font-size: clamp(15px, 1.8vw, 28px);
      text-shadow: 0 0 7px #ffbc42, 0 0 16px rgba(255, 183, 53, 0.78);
    }

    .front-room.lamp-off .brain-secret {
      opacity: 1;
      pointer-events: auto;
      filter: drop-shadow(0 0 8px #ffc85c);
      animation: secretPulse 1.8s ease-in-out infinite;
    }

    @keyframes secretPulse {
      0%, 100% { transform: scale(0.9); }
      50% { transform: scale(1.2); }
    }

    .nav-studio { left: 10.8%; top: 93.2%; width: 9.2%; height: 6.8%; }
    .nav-library { left: 21.6%; top: 93.2%; width: 9.5%; height: 6.8%; }
    .nav-music { left: 32.4%; top: 93.2%; width: 11%; height: 6.8%; }
    .nav-workshop { left: 46.4%; top: 93.2%; width: 11%; height: 6.8%; }
    .nav-gallery { left: 58.4%; top: 93.2%; width: 10.4%; height: 6.8%; }
    .nav-bob { left: 70%; top: 93.2%; width: 13%; height: 6.8%; }

    .front-toast {
      position: fixed;
      left: 50%;
      bottom: calc(84px + env(safe-area-inset-bottom));
      z-index: 75;
      width: max-content;
      max-width: calc(100vw - 34px);
      padding: 11px 15px;
      color: #f7e5bf;
      background: rgba(17, 13, 9, 0.93);
      border: 1px solid rgba(230, 188, 108, 0.62);
      border-radius: 999px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      font-family: Arial, sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 15px);
      transition: opacity 180ms ease, transform 180ms ease, visibility 180ms ease;
      pointer-events: none;
    }

    .front-toast.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    /* Real hamburger button */

    .menu-button {
      position: fixed;
      top: calc(15px + env(safe-area-inset-top));
      left: calc(15px + env(safe-area-inset-left));
      z-index: 60;

      width: 54px;
      height: 54px;

      display: grid;
      place-items: center;

      color: #f3d59a;
      background: rgba(16, 13, 10, 0.82);

      border: 1px solid rgba(230, 188, 108, 0.8);
      border-radius: 8px;

      box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.5),
        0 0 14px rgba(221, 167, 70, 0.18);

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .menu-button:active {
      transform: scale(0.96);
    }

    .menu-lines,
    .menu-lines::before,
    .menu-lines::after {
      display: block;
      width: 25px;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
      transition:
        transform 220ms ease,
        opacity 180ms ease;
    }

    .menu-lines {
      position: relative;
    }

    .menu-lines::before,
    .menu-lines::after {
      content: "";
      position: absolute;
      left: 0;
    }

    .menu-lines::before {
      top: -8px;
    }

    .menu-lines::after {
      top: 8px;
    }

    .menu-button.open .menu-lines {
      background: transparent;
    }

    .menu-button.open .menu-lines::before {
      top: 0;
      transform: rotate(45deg);
    }

    .menu-button.open .menu-lines::after {
      top: 0;
      transform: rotate(-45deg);
    }

    /* Dark screen behind open menu */

    .menu-shade {
      position: fixed;
      inset: 0;
      z-index: 40;

      background: rgba(0, 0, 0, 0.48);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 220ms ease,
        visibility 220ms ease;

      backdrop-filter: blur(2px);
    }

    .menu-shade.open {
      opacity: 1;
      visibility: visible;
    }

    /* Sliding navigation panel */

    .menu-panel {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 50;

      width: min(310px, 84vw);
      overflow-y: auto;
      padding:
        calc(88px + env(safe-area-inset-top))
        24px
        calc(26px + env(safe-area-inset-bottom));

      color: #f5ead7;

      background:
        linear-gradient(
          145deg,
          rgba(85, 48, 27, 0.98),
          rgba(28, 20, 15, 0.99)
        );

      border-right: 1px solid rgba(225, 182, 108, 0.45);

      box-shadow: 18px 0 45px rgba(0, 0, 0, 0.55);

      transform: translateX(-105%);
      transition: transform 260ms ease;
    }

    .menu-panel.open {
      transform: translateX(0);
    }

    .menu-title {
      margin-bottom: 6px;

      color: #f3d391;
      font-size: 1.5rem;
      letter-spacing: 0.05em;
    }

    .menu-subtitle {
      margin-bottom: 28px;

      color: rgba(245, 234, 215, 0.65);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .menu-links {
      display: grid;
      gap: 10px;
    }

    .menu-link {
      display: block;
      padding: 13px 14px;

      color: #f5ead7;
      background: rgba(255, 255, 255, 0.035);

      border: 1px solid rgba(238, 207, 157, 0.18);
      border-radius: 6px;

      text-decoration: none;
      letter-spacing: 0.035em;

      transition:
        background 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
    }

    .menu-link:hover,
    .menu-link:focus-visible {
      background: rgba(226, 177, 96, 0.14);
      border-color: rgba(238, 207, 157, 0.48);
      transform: translateX(3px);
    }

    .menu-link.current {
      color: #f1d08b;
      border-color: rgba(231, 181, 96, 0.55);
    }

    .menu-footer {
      margin-top: 24px;

      color: rgba(245, 234, 215, 0.48);
      font-size: 0.78rem;
      line-height: 1.5;
    }

    /* Vertical front room for phones */

    @media (max-width: 650px) {
      .front-room {
        width: max(100vw, calc(100svh * 0.48884));
        height: max(100svh, calc(100vw / 0.48884));

        background-image:
          url("assets/front-room-phone.webp");
      }

      .enter {
        left: 50%;
        top: 57.4%;
        width: 31.1%;
        height: 6.2%;
        border-width: 3px;
      }
      .enter::before { font-size: 8px; }

      .lamp-glow {
        left: -3%;
        top: 12.5%;
        width: 12%;
        height: 17%;
      }

      .window-hotspot {
        left: 29.4%;
        top: 5.5%;
        width: 46.5%;
        height: 27.1%;
      }

      .rain-sound { left:63%; top:8% }
      .window-trail { left:43%; top:8% }

      .lamp-hotspot {
        left: 0;
        top: 14%;
        width: 7.5%;
        height: 14.5%;
      }

      .guitar-hotspot {
        left: 13.4%;
        top: 23.2%;
        width: 20%;
        height: 27.5%;
      }

      .bob-hotspot {
        left: 26.5%;
        top: 22.2%;
        width: 22%;
        height: 9.4%;
      }

      .book-hotspot {
        left: 4.8%;
        top: 16.8%;
        width: 15%;
        height: 8.8%;
      }

      .brain-secret {
        left: 47.3%;
        top: 47.6%;
        width: 5.5%;
        height: 5%;
      }

      .nav-studio,
      .nav-library,
      .nav-music,
      .nav-workshop,
      .nav-gallery,
      .nav-bob {
        top: 88.25%;
        width: 16.6667%;
        height: 11.75%;
      }

      .nav-studio { left: 0; }
      .nav-library { left: 16.6667%; }
      .nav-music { left: 33.3334%; }
      .nav-workshop { left: 50%; }
      .nav-gallery { left: 66.6667%; }
      .nav-bob { left: 83.3334%; }

      .front-toast {
        bottom: calc(13.6% + env(safe-area-inset-bottom));
        border-radius: 9px;
      }

      .menu-button {
        left: max(8px, env(safe-area-inset-left));
        width: 50px;
        height: 50px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .menu-panel,
      .menu-shade,
      .menu-lines,
      .menu-lines::before,
      .menu-lines::after,
      .menu-link,
      .room-dimmer,
      .lamp-glow,
      .rain-layer,
      .room-hotspot::after,
      .picture-nav::after,
      .brain-secret,
      .front-toast {
        transition: none;
      }

      .front-room.raining .wet-pane .rivulet,
      .front-room.lamp-off .brain-secret {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div class="front-room" aria-label="Studio LaDuke front room">
    <div class="room-dimmer" aria-hidden="true"></div>
    <div class="lamp-glow" aria-hidden="true"></div>
    <div class="rain-layer" aria-hidden="true"></div>
    <div class="mounted-art-wall" aria-label="Artwork in the front room">
      <a class="mounted-art mount-wide ktn-crab" style="left:73.094463%;top:5.859375%;width:9.446254%;height:12.988281%" href="gallery.html?from=front-room&amp;art=3ABA2FB4-184C-4FB1-8D85-4118FA503931.png"><img src="assets/front-art/ktn-crab.webp" alt="Ketchikan crab" decoding="async"></a>
      <a class="mounted-art mount-wide nightlight" style="left:86.644951%;top:4.980469%;width:9.837134%;height:14.062500%" href="gallery.html?from=front-room&amp;art=7528563F-9204-4651-A65A-2A7450DCE740.png"><img src="assets/front-art/nightlight.webp" alt="Nightlight" decoding="async"></a>
      <a class="mounted-art mount-wide hump-day" style="left:72.573290%;top:25.000000%;width:11.661238%;height:9.765625%" href="gallery.html?from=front-room&amp;art=9EAA20AB-901D-41E1-AC98-64455D1A291D.png"><img src="assets/front-art/hump-day.webp" alt="Hump Day" decoding="async"></a>
      <a class="mounted-art mount-wide detail lamp" style="left:87.947883%;top:25.390625%;width:5.342020%;height:10.839844%" href="gallery.html?from=front-room&amp;art=IMG_0082.jpeg"><img src="assets/front-art/detail.webp" alt="Painted work from the Studio LaDuke gallery" decoding="async"></a>
      <a class="mounted-art mount-wide salmon" style="left:72.117264%;top:40.039062%;width:6.840391%;height:7.421875%" href="gallery.html?from=front-room&amp;art=5009BA2B-780C-4A6C-A6AA-4B5CDD3174C6.png"><img src="assets/front-art/salmon.webp" alt="King salmon" decoding="async"></a>
      <a class="mounted-art mount-wide buoy pencils" style="left:83.061889%;top:41.894531%;width:6.970684%;height:7.324219%" href="gallery.html?from=front-room&amp;art=650B0A6A-1B85-4665-82D7-95FF79C8761E.png"><img src="assets/front-art/buoy.webp" alt="Oh Buoy" decoding="async"></a>
      <a class="mounted-art mount-wide tablet" style="left:84.495114%;top:63.281250%;width:7.622150%;height:5.566406%" href="gallery.html?from=front-room&amp;art=9258DAB5-6EFA-4099-8DC9-EAD700BDA166.png"><img src="assets/front-art/tablet.webp" alt="Circular black-and-white design" decoding="async"></a>
      <a class="mounted-art mount-tall ktn-crab" style="left:83.333333%;top:6.852368%;width:11.301370%;height:6.406685%" href="gallery.html?from=front-room&amp;art=3ABA2FB4-184C-4FB1-8D85-4118FA503931.png"><img src="assets/front-art/ktn-crab.webp" alt="Ketchikan crab" decoding="async"></a>
      <a class="mounted-art mount-tall hump-day" style="left:82.534247%;top:16.434540%;width:12.557078%;height:4.122563%" href="gallery.html?from=front-room&amp;art=9EAA20AB-901D-41E1-AC98-64455D1A291D.png"><img src="assets/front-art/hump-day.webp" alt="Hump Day" decoding="async"></a>
    </div>

    <a
      class="enter"
      href="workshop.html"
      aria-label="Come into Studio LaDuke"
    ></a>

    <button class="room-hotspot lamp-hotspot" id="lampHotspot" type="button" aria-label="Turn the desk lamp off or on"></button>
    <button class="room-hotspot guitar-hotspot" id="guitarHotspot" type="button" aria-label="Play the guitar"></button>
    <button class="room-hotspot bob-hotspot" id="bobHotspot" type="button" aria-label="Talk to Bob"></button>
    <div class="mounted-art mount-wide cover-on-shelf" aria-hidden="true">
      <img src="assets/everybody-home-cover.webp" alt="" width="620" height="945">
    </div>
    <a class="room-hotspot book-hotspot" href="books.html" aria-label="Open Everybody Deserves to Go Home"></a>
    <button class="room-hotspot window-hotspot" id="windowHotspot" type="button" aria-label="Change the weather outside" aria-pressed="false"></button>
    <button class="rain-sound" id="rainSound" type="button" hidden>Mute rain</button>
    <a class="window-trail" id="windowTrail" href="forest-path.html" hidden>Follow the trail</a>
    <a class="room-hotspot brain-secret" id="brainSecret" href="brain.html" aria-label="Enter the hidden room inside my head" hidden></a>

    <a class="picture-nav nav-studio" href="index.html" aria-label="Studio front room"></a>
    <a class="picture-nav nav-library" href="books.html" aria-label="Library"></a>
    <button class="picture-nav nav-music" id="musicNav" type="button" aria-label="Music room"></button>
    <a class="picture-nav nav-workshop" href="workshop.html" aria-label="Workshop"></a>
    <a class="picture-nav nav-gallery" href="gallery.html" aria-label="Gallery"></a>
    <a class="picture-nav nav-bob" href="bob.html" aria-label="Bob's Room"></a>
  </div>

  <audio id="rainAudio" src="audio/front-room-rain.mp3" preload="none" loop></audio>
  <div class="front-toast" id="frontToast" aria-live="polite"></div>

  <button
    class="menu-button"
    id="menuButton"
    type="button"
    aria-label="Open studio doors"
    aria-controls="menuPanel"
    aria-expanded="false"
  >
    <span class="menu-lines" aria-hidden="true"></span>
  </button>

  <div
    class="menu-shade"
    id="menuShade"
    aria-hidden="true"
  ></div>

  <nav
    class="menu-panel"
    id="menuPanel"
    aria-label="Studio LaDuke navigation"
    inert
  >
    <h2 class="menu-title">Studio LaDuke</h2>

    <p class="menu-subtitle">
      Art, stories, music, and things still becoming.
    </p>

    <div class="menu-links">
      <a class="menu-link current" href="index.html">
        Front Room
      </a>

      <a class="menu-link" href="workshop.html">
        Workshop
      </a>

      <a class="menu-link" href="forest-path.html">
        The Back Forty
      </a>

      <a class="menu-link" href="directory.html">
        Directory
      </a>

      <a class="menu-link" href="projects.html">
        Projects
      </a>

      <a class="menu-link" href="commissions/">
        Commission Mission Control
      </a>

      <a class="menu-link" href="books.html">
        Books
      </a>

      <a class="menu-link" href="bob.html">
        Bob’s Room
      </a>

      <a class="menu-link" href="brain.html">
        The Brain Room
      </a>

      <a class="menu-link" href="about.html">
        About Corey
      </a>
    </div>

    <div class="menu-footer">
      Made in Ketchikan, Alaska.<br>
      Pull up a chair.
    </div>
  </nav>

  <script>
    const menuButton = document.getElementById("menuButton");
    const menuPanel = document.getElementById("menuPanel");
    const menuShade = document.getElementById("menuShade");
    const frontRoom = document.querySelector(".front-room");
    const frontToast = document.getElementById("frontToast");
    const windowTrail = document.getElementById("windowTrail");
    const brainSecret = document.getElementById("brainSecret");
    const lampHotspot = document.getElementById("lampHotspot");
    const guitarHotspot = document.getElementById("guitarHotspot");
    const bobHotspot = document.getElementById("bobHotspot");
    const windowHotspot = document.getElementById("windowHotspot");
    const musicNav = document.getElementById("musicNav");

    let toastTimer;
    let audioContext;
    const rainAudio = document.getElementById("rainAudio");
    const rainSound = document.getElementById("rainSound");
    let bobReadyForDoor = false;
    let guitarChordIndex = 0;

    const bobRemarks = [
      "Bob says: Growth is mostly standing still with commitment.",
      "Bob says: Water me, but emotionally? Keep it reasonable.",
      "Bob says: I have one job and somehow I’m still behind.",
      "Bob says: The room looks better when you stop rushing through it.",
      "Bob says: Photosynthesis is just plants eating sunshine. You’re welcome."
    ];

    function showFrontToast(message, duration = 2300) {
      window.clearTimeout(toastTimer);
      frontToast.textContent = message;
      frontToast.classList.add("show");

      toastTimer = window.setTimeout(() => {
        frontToast.classList.remove("show");
      }, duration);
    }

    function getAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      return audioContext;
    }

    const guitarProgression = [
      { name: "G", notes: [196, 246.94, 293.66, 392] },
      { name: "D", notes: [146.83, 220, 293.66, 369.99] },
      { name: "Em", notes: [164.81, 196, 246.94, 329.63] },
      { name: "C", notes: [130.81, 196, 261.63, 329.63] }
    ];

    function playGuitarChord() {
      const audio = getAudioContext();
      const now = audio.currentTime;
      const chord = guitarProgression[guitarChordIndex];
      const frequencies = chord.notes;

      guitarChordIndex = (guitarChordIndex + 1) % guitarProgression.length;

      frequencies.forEach((frequency, index) => {
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();
        const start = now + index * 0.045;

        oscillator.type = "triangle";
        oscillator.frequency.setValueAtTime(frequency, start);
        oscillator.detune.setValueAtTime((Math.random() - 0.5) * 7, start);

        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.045, start + 0.018);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 1.15);

        oscillator.connect(gain);
        gain.connect(audio.destination);
        oscillator.start(start);
        oscillator.stop(start + 1.2);
      });

      showFrontToast(
        chord.name + " chord. Tap again for " +
        guitarProgression[guitarChordIndex].name + "."
      );
    }

    lampHotspot.addEventListener("click", () => {
      frontRoom.classList.toggle("lamp-off");
      const lampIsOff = frontRoom.classList.contains("lamp-off");
      brainSecret.hidden = !lampIsOff;

      showFrontToast(
        lampIsOff
          ? "Lamp off. Something gold just woke up."
          : "Lamp on. Back to making things."
      );
    });

    guitarHotspot.addEventListener("click", playGuitarChord);

    musicNav.addEventListener("click", () => {
      playGuitarChord();
      showFrontToast("The music room is tuning up. The guitar works right now.", 2800);
    });

    bobHotspot.addEventListener("click", () => {
      if (bobReadyForDoor) {
        window.location.href = "bob.html";
        return;
      }

      const remark = bobRemarks[Math.floor(Math.random() * bobRemarks.length)];
      showFrontToast(remark + " Tap Bob again to visit his room.", 3400);
      bobReadyForDoor = true;

      window.setTimeout(() => {
        bobReadyForDoor = false;
      }, 5000);
    });

    function playRain() {
      rainAudio.play().catch(() => {
        if (frontRoom.classList.contains("raining")) rainSound.textContent = "Play rain";
      });
    }

    rainSound.addEventListener("click", () => {
      if (rainAudio.paused) playRain();
      else rainAudio.pause();
    });
    rainAudio.addEventListener("play", () => { rainSound.textContent = "Mute rain"; });
    rainAudio.addEventListener("pause", () => { rainSound.textContent = "Play rain"; });

    windowHotspot.addEventListener("click", () => {
      const raining = frontRoom.classList.toggle("raining");
      windowHotspot.setAttribute("aria-pressed", String(raining));
      windowTrail.hidden = !raining;
      rainSound.hidden = !raining;
      if (raining) playRain();
      else rainAudio.pause();
    });

    window.setTimeout(() => {
      try {
        if (!sessionStorage.getItem("frontRoomSecretsHint")) {
          showFrontToast("The front room has secrets. Tap what looks interesting.", 3000);
          sessionStorage.setItem("frontRoomSecretsHint", "1");
        }
      } catch (error) {
        showFrontToast("The front room has secrets. Tap what looks interesting.", 3000);
      }
    }, 850);

    function openMenu() {
      menuButton.classList.add("open");
      menuPanel.classList.add("open");
      menuShade.classList.add("open");

      menuButton.setAttribute("aria-expanded", "true");
      menuButton.setAttribute("aria-label", "Close studio doors");
      menuPanel.inert = false;
      frontRoom.inert = true;
    }

    function closeMenu() {
      menuButton.classList.remove("open");
      menuPanel.classList.remove("open");
      menuShade.classList.remove("open");

      menuButton.setAttribute("aria-expanded", "false");
      menuButton.setAttribute("aria-label", "Open studio doors");
      menuPanel.inert = true;
      frontRoom.inert = false;
      menuButton.focus({ preventScroll: true });
    }

    function toggleMenu() {
      const isOpen = menuPanel.classList.contains("open");

      if (isOpen) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    menuButton.addEventListener("click", toggleMenu);
    menuShade.addEventListener("click", closeMenu);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && menuButton.getAttribute("aria-expanded") === "true") {
        closeMenu();
      }
    });

    window.addEventListener("pageshow", event => {
      if (event.persisted && menuButton.getAttribute("aria-expanded") === "true") closeMenu();
    });
  </script>

  <script src="assets/front-room.js" defer></script>
</body>
