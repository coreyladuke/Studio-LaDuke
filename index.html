<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Studio LaDuke</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    body {
      min-height: 100svh;

      /* Wide desktop landing room */
      background-image:
        url("54EFFD92-C1F7-4A3E-BADE-CE8296F147E3.png");

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    /* Makes the entire landing image clickable */
    .enter {
      position: fixed;
      inset: 0;
      display: block;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
    }

    /* Vertical landing room for phones */
    @media (max-width: 650px) {
      body {
        background-image:
          url("6ED5F01B-E9C3-40BD-8B1A-5F55CC572F51.png");

        background-size: cover;
        background-position: center top;
      }
    }
  </style>
</head>

<body>
  <a
    class="enter"
    href="workshop.html"
    aria-label="Enter Studio LaDuke"
  ></a>
</body>
</html>
