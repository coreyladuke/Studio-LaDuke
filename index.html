<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Studio LaDuke</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96">
  <meta name="theme-color" content="#121c19">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    body {
      min-height: 100svh;
      font-family: Georgia, "Times New Roman", serif;
    }

    /* Keep the artwork and its clickable areas in the same coordinate system. */

    .front-room {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 1;

      width: max(100vw, calc(100svh * 1.5));
      height: max(100svh, calc(100vw / 1.5));

      background:
        url("assets/front-room-wide.webp")
        center / 100% 100% no-repeat;

      transform: translate(-50%, -50%);
    }

    /* Restore the original floor or wall behind the interactive mark. */
    .front-room::before {
      content: "";
      position: absolute;
      left: 45.081433%;
      top: 56.640625%;
      width: 3.517915%;
      height: 5.273438%;
      background: url("assets/front-room-note-star-wide.webp") center / 100% 100% no-repeat;
      pointer-events: none;
    }

    .front-room {
      --star-x: 46.84%;
      --star-y: 59.28%;
    }

    .note-star {
      position: absolute;
      z-index: 18;
      left: var(--star-x);
      top: var(--star-y);
      width: clamp(44px, 5.3vw, 82px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      transform: translate(-50%, -50%);
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .note-star img {
      width: 74%;
      height: auto;
      filter: drop-shadow(0 2px 2px #160e08);
      pointer-events: none;
    }
    .note-star.spinning img { animation: note-star-spin .95s cubic-bezier(.16, .79, .27, 1) both; }
    @keyframes note-star-spin { to { transform: rotate(360deg); } }
    .note-star:focus-visible { outline: 2px dashed #f1dfb1; border-radius: 50%; }
    @media (prefers-reduced-motion: reduce) {
      .note-star.spinning img { animation: none; filter: drop-shadow(0 0 5px #edbf68); }
    }

    .turn-room {
      position: fixed;
      z-index: 25;
      right: max(14px, env(safe-area-inset-right));
      top: max(8px, env(safe-area-inset-top));
      min-height: 44px;
      padding: 0 3px;
      border: 0;
      background: transparent;
      color: #f7e5c1;
      text-decoration: underline;
      text-underline-offset: .3em;
      text-shadow: 0 1px 2px #170e09, 0 0 8px #140d06, 0 0 12px #140d06;
      font: 700 clamp(.9rem, 2.9vw, 1.03rem)/1 Georgia, serif;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .turn-room:focus-visible { outline: 2px dashed #f1dfb1; }

    .door-wall {
      position: fixed;
      inset: 0;
      z-index: 21;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 40%, #392519, #17100d);
    }
    .door-wall[hidden] { display: none; }
    .door-wall .door-plate {
      position: relative;
      width: min(100vw, 177.68dvh);
      height: min(100dvh, 56.28vw);
      background: url("assets/front-room-doors.webp") center / 100% 100% no-repeat;
    }
    .door-plate a {
      position: absolute;
      top: 24%;
      height: 52%;
      display: grid;
      place-items: end center;
      padding: 0 3px 6px;
      color: #ffecd1;
      font: 700 clamp(.66rem, 2.2vw, 1.18rem)/1.13 Georgia, serif;
      text-shadow: 0 1px 2px #140e07, 0 0 4px #140e07, 0 0 8px #140e07;
      text-decoration: underline;
      text-underline-offset: .2em;
      text-align: center;
      transition: background .15s ease;
    }
    .door-plate a:nth-child(1) { left: 10.5%; width: 14%; }
    .door-plate a:nth-child(2) { left: 41.8%; width: 16%; }
    .door-plate a:nth-child(3) { left: 75.4%; width: 14%; }
    .door-plate a:is(:hover,:focus-visible) {
      background: linear-gradient(0deg,#1a0e0944,transparent 40%);
    }
    .door-plate a:focus-visible { outline: 2px dashed #f1dfb1; outline-offset: 2px; }
    .front-scene .turn-room[aria-expanded="true"] { color: #ffeece; }

    .front-room .wet-pane::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #040a19;
      opacity: calc(var(--outside-darkness, .45) * .42);
    }
    .front-room[data-season="autumn"] .wet-pane::before { background: #11131f; }
    .front-room[data-season="autumn"] .wet-pane { filter: sepia(.16); }
    .front-room[data-season="winter"] .wet-pane::before { background: #102133; }
    .front-room .rain-layer { opacity: 0; }
    .front-room:not(.raining) .wet-pane :is(.bead,.rivulet) { display: none; }
    .front-room[data-weather="snow"] .wet-pane::after {
      content: ""; position: absolute; inset: 0;
      background-image: radial-gradient(circle, #eaf6efbe 0 1px, transparent 1.6px);
      background-size: 33px 49px;
    }

    button,
    a {
      font: inherit;
    }

    .enter {
      position: absolute;
      left: 47.45%;
      top: 70.2%;
      z-index: 20;
      display: grid;
      place-items: center;
      min-width: max(100px, 10%);
      min-height: 48px;
      color: #f6deb0;
      font-size: clamp(28px, 3.25vw, 55px);
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      text-shadow: 0 1px #a27d47, 0 2px #66452b, 0 3px 1px #4d321e, 5px 11px 15px #140b0799;
      transform: translate(calc(-50% + var(--entry-drift-x, 0px)), calc(-50% + var(--entry-drift-y, 0px)));
      -webkit-tap-highlight-color: transparent;
    }

    .enter span {
      display: block;
      transform: perspective(520px) translateZ(37px) rotateY(-11deg) rotateZ(-4deg);
    }

    .enter:hover,
    .enter:focus-visible {
      color: #fff2d3;
    }

    .enter:focus-visible {
      outline: none;
    }

    .enter:focus-visible span {
      text-decoration: underline;
      text-decoration-thickness: .08em;
      text-underline-offset: .18em;
    }

    @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
      .front-room {
        transform: translate(calc(-50% + var(--room-drift-x, 0%)), calc(-50% + var(--room-drift-y, 0%))) scale(1.01);
        transition: transform 420ms ease-out;
      }

      .enter { transition: transform 420ms ease-out, color 150ms ease; }
    }

    /* Front-room interactions */

    .room-dimmer,
    .lamp-glow,
    .rain-layer {
      position: absolute;
      pointer-events: none;
    }

    .room-dimmer {
      inset: 0;
      z-index: 5;
      background: rgba(3, 4, 7, 0.48);
      opacity: 0;
      transition: opacity 420ms ease;
    }

    .lamp-glow {
      left: -2%;
      top: 10%;
      z-index: 6;
      width: 14%;
      height: 37%;
      border-radius: 50%;
      background:
        radial-gradient(
          ellipse at 42% 44%,
          rgba(255, 218, 139, 0.32),
          rgba(255, 174, 59, 0.11) 38%,
          transparent 72%
        );
      filter: blur(7px);
      opacity: 0.72;
      transition: opacity 350ms ease;
    }

    .front-room.lamp-off .room-dimmer {
      opacity: 0.28;
    }

    .front-room.lamp-off .lamp-glow {
      opacity: 0;
    }

    .mounted-art-wall { position:absolute; inset:0; z-index:4; pointer-events:none }
    .mounted-art {
      position:absolute;
      overflow:hidden;
      display:grid;
      place-items:center;
      pointer-events:auto;
      transform-origin:0 0;
      background:#c8ab86;
      isolation:isolate;
    }

    .mounted-art.mount-tall { display:none }
    @media (max-width: 650px) {
      .mounted-art.mount-wide { display:none }
      .mounted-art.mount-tall { display:grid }
    }

    .mounted-art img {
      display:block;
      width:100%;
      height:100%;
      max-height:100%;
      min-height:0;
      object-fit:contain;
      filter:brightness(.79) contrast(.94) saturate(.88);
    }

    .mounted-art::after {
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:linear-gradient(119deg,#fff5da35,transparent 29%,transparent 69%,#48301c3d);
      box-shadow:inset 1px 2px 5px #2313069c;
    }

    .mounted-art:hover img, .mounted-art:focus-visible img { filter:brightness(.92) contrast(.96) saturate(.94) }
    .mounted-art:focus-visible { outline:3px solid #f2bf72; outline-offset:2px }
    .mounted-art.lamp { clip-path:polygon(0 0,36% 0,25% 22%,30% 34%,100% 53%,100% 100%,0 100%) }
    .mounted-art.pencils { clip-path:polygon(0 0,100% 0,100% 82%,80% 79%,62% 100%,4% 100%,4% 66%,0 64%) }
    .mounted-art.tablet { background:#bdb6a9; border-radius:7px }
    .mounted-art.tablet::after { background:linear-gradient(109deg,#161d28a1,transparent 65%,#e6dbc945) }
    .mounted-art.cover-on-shelf {
      left:2.8%;
      top:49%;
      width:7.2%;
      height:16%;
      z-index:4;
      pointer-events:none;
      background:#211b13;
      transform:skew(8deg,-9deg);
    }
    .cover-on-shelf img { object-fit:fill; filter:brightness(.79) saturate(.93) }

    .rain-layer { inset:0; z-index:7; opacity:0; transition:opacity .5s ease; pointer-events:none }
    .front-room.raining .rain-layer { opacity:1 }
    .wet-pane {
      position:absolute;
      overflow:hidden;
      background: transparent;
    }
    .front-room.raining .wet-pane { background: transparent; }
    .wet-pane .bead {
      position:absolute;
      width:var(--size);
      height:calc(var(--size) * 1.22);
      border-radius:47% 53% 61% 39%;
      opacity:var(--alpha);
      background:radial-gradient(ellipse at 32% 23%, #fff8d9b0, transparent 41%), #151d263c;
      box-shadow:0 .6px 1px #07191ba3;
    }
    .wet-pane .rivulet {
      position:absolute;
      width:1px;
      opacity:.38;
      border-radius:85% 85% 55% 55%;
      background:linear-gradient(transparent,#202f3b50,#eaf3f967);
      box-shadow:1px 0 #edf9f737, -1px 0 #14232a27;
    }
    .front-room.raining .wet-pane .rivulet { animation:glass-rain var(--speed) ease-in-out var(--delay) infinite }
    @keyframes glass-rain {
      0%,100% { opacity:.15; transform:translateY(-8px) }
      65% { opacity:.62 }
      85% { opacity:.19; transform:translateY(30px) }
    }
    .window-actions {
      position: absolute;
      left: 49.5%;
      top: 39%;
      z-index: 17;
      display: flex;
      justify-content: center;
      gap: 14px;
      width: max-content;
      max-width: 40%;
      transform: translateX(-50%);
    }

    .window-actions[hidden] { display: none; }
    .window-actions :is(a, button) {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 2px;
      border: 0;
      color: #fff1d1;
      background: transparent;
      text-decoration: underline;
      text-underline-offset: .25em;
      text-shadow: 0 1px 2px #1a1208, 0 0 5px #130e08, 0 0 11px #171309;
      font: 700 clamp(.75rem, 1.35vw, 1.05rem)/1 Georgia, serif;
      white-space: nowrap;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .window-actions :is(a, button):focus-visible {
      outline: 2px solid #eef1ec;
      outline-offset: 1px;
    }

    .front-room .guitar-hotspot.strumming::before {
      content: "";
      position: absolute;
      inset: 21% 28% 11%;
      background: radial-gradient(ellipse, #ffd99525, transparent 68%);
      pointer-events: none;
      animation: guitar-shimmer 640ms ease-out both;
    }
    @keyframes guitar-shimmer { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .front-room .guitar-hotspot.strumming::before { animation: none; }
    }

    .guitar-status {
      position: absolute;
      width: 1px;
      height: 1px;
      clip-path: inset(50%);
      overflow: hidden;
      white-space: nowrap;
    }

    .room-hotspot,
    .picture-nav {
      position: absolute;
      z-index: 15;
      display: block;
      padding: 0;
      border: 0;
      border-radius: 10px;
      color: transparent;
      background: transparent;
      cursor: pointer;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .room-hotspot::after,
    .picture-nav::after {
      content: "";
      position: absolute;
      inset: 4%;
      border: 1px solid transparent;
      border-radius: inherit;
      transition:
        border-color 160ms ease,
        background 160ms ease,
        box-shadow 160ms ease;
    }

    .room-hotspot:hover::after,
    .room-hotspot:focus-visible::after,
    .picture-nav:hover::after,
    .picture-nav:focus-visible::after {
      border-color: rgba(245, 205, 125, 0.72);
      background: rgba(255, 210, 120, 0.07);
      box-shadow: 0 0 18px rgba(236, 180, 77, 0.25);
    }

    .lamp-hotspot {
      left: 0;
      top: 13.8%;
      width: 8.2%;
      height: 28.5%;
    }

    .guitar-hotspot {
      left: 18.1%;
      top: 34.2%;
      width: 14.1%;
      height: 43.5%;
      border-radius: 46%;
    }

    .bob-hotspot {
      left: 29.1%;
      top: 29.7%;
      z-index: 16;
      width: 11.4%;
      height: 17.2%;
      border-radius: 45%;
    }

    .book-hotspot {
      left: 2.5%;
      top: 47.2%;
      width: 9.3%;
      height: 18.1%;
    }

    .window-hotspot {
      left: 29.1%;
      top: 4.8%;
      width: 41.4%;
      height: 42.3%;
    }

    .brain-secret {
      left: 45.7%;
      top: 66%;
      z-index: 19;
      width: 3%;
      height: 5%;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 350ms ease, filter 350ms ease;
    }

    .brain-secret[hidden] { display: none; }

    .brain-secret::before {
      content: "✦";
      position: absolute;
      inset: -22%;
      display: grid;
      place-items: center;
      color: #ffd47a;
      background: radial-gradient(circle, rgba(255, 199, 88, 0.26), transparent 68%);
      border-radius: 50%;
      font-size: clamp(15px, 1.8vw, 28px);
      text-shadow: 0 0 7px #ffbc42, 0 0 16px rgba(255, 183, 53, 0.78);
    }

    .front-room.lamp-off .brain-secret {
      opacity: 1;
      pointer-events: auto;
      filter: drop-shadow(0 0 8px #ffc85c);
      animation: secretPulse 1.8s ease-in-out infinite;
    }

    @keyframes secretPulse {
      0%, 100% { transform: scale(0.9); }
      50% { transform: scale(1.2); }
    }

    .nav-studio { left: 10.8%; top: 93.2%; width: 9.2%; height: 6.8%; }
    .nav-library { left: 21.6%; top: 93.2%; width: 9.5%; height: 6.8%; }
    .nav-music { left: 32.4%; top: 93.2%; width: 11%; height: 6.8%; }
    .nav-workshop { left: 46.4%; top: 93.2%; width: 11%; height: 6.8%; }
    .nav-gallery { left: 58.4%; top: 93.2%; width: 10.4%; height: 6.8%; }
    .nav-bob { left: 70%; top: 93.2%; width: 13%; height: 6.8%; }
    .bob-nav-mark {
      position: absolute;
      left: 32.9%;
      top: 44%;
      width: 17%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      transform: translate(-50%, -50%);
      color: #c8a675;
      background: radial-gradient(circle, #1a1a1a 62%, transparent 76%);
      pointer-events: none;
    }
    .bob-nav-mark svg { width: 79%; }

    .front-toast {
      position: fixed;
      left: 50%;
      bottom: calc(84px + env(safe-area-inset-bottom));
      z-index: 75;
      width: max-content;
      max-width: calc(100vw - 34px);
      padding: 11px 15px;
      color: #f7e5bf;
      background: rgba(17, 13, 9, 0.93);
      border: 1px solid rgba(230, 188, 108, 0.62);
      border-radius: 999px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      font-family: Arial, sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 15px);
      transition: opacity 180ms ease, transform 180ms ease, visibility 180ms ease;
      pointer-events: none;
    }

    .front-toast.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    /* Real hamburger button */

    .menu-button {
      position: fixed;
      top: calc(15px + env(safe-area-inset-top));
      left: calc(15px + env(safe-area-inset-left));
      z-index: 60;

      width: 54px;
      height: 54px;

      display: grid;
      place-items: center;

      color: #f3d59a;
      background: rgba(16, 13, 10, 0.82);

      border: 1px solid rgba(230, 188, 108, 0.8);
      border-radius: 8px;

      box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.5),
        0 0 14px rgba(221, 167, 70, 0.18);

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .menu-button:active {
      transform: scale(0.96);
    }

    .menu-lines,
    .menu-lines::before,
    .menu-lines::after {
      display: block;
      width: 25px;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
      transition:
        transform 220ms ease,
        opacity 180ms ease;
    }

    .menu-lines {
      position: relative;
    }

    .menu-lines::before,
    .menu-lines::after {
      content: "";
      position: absolute;
      left: 0;
    }

    .menu-lines::before {
      top: -8px;
    }

    .menu-lines::after {
      top: 8px;
    }

    .menu-button.open .menu-lines {
      background: transparent;
    }

    .menu-button.open .menu-lines::before {
      top: 0;
      transform: rotate(45deg);
    }

    .menu-button.open .menu-lines::after {
      top: 0;
      transform: rotate(-45deg);
    }

    /* Dark screen behind open menu */

    .menu-shade {
      position: fixed;
      inset: 0;
      z-index: 40;

      background: rgba(0, 0, 0, 0.48);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 220ms ease,
        visibility 220ms ease;

      backdrop-filter: blur(2px);
    }

    .menu-shade.open {
      opacity: 1;
      visibility: visible;
    }

    /* Sliding navigation panel */

    .menu-panel {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 50;

      width: min(310px, 84vw);
      overflow-y: auto;
      padding:
        calc(88px + env(safe-area-inset-top))
        24px
        calc(26px + env(safe-area-inset-bottom));

      color: #f5ead7;

      background:
        linear-gradient(
          145deg,
          rgba(85, 48, 27, 0.98),
          rgba(28, 20, 15, 0.99)
        );

      border-right: 1px solid rgba(225, 182, 108, 0.45);

      box-shadow: 18px 0 45px rgba(0, 0, 0, 0.55);

      transform: translateX(-105%);
      transition: transform 260ms ease;
    }

    .menu-panel.open {
      transform: translateX(0);
    }

    .menu-title {
      margin-bottom: 6px;

      color: #f3d391;
      font-size: 1.5rem;
      letter-spacing: 0.05em;
    }

    .menu-subtitle {
      margin-bottom: 28px;

      color: rgba(245, 234, 215, 0.65);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .menu-links {
      display: grid;
      gap: 10px;
    }

    .menu-link {
      display: block;
      padding: 13px 14px;

      color: #f5ead7;
      background: rgba(255, 255, 255, 0.035);

      border: 1px solid rgba(238, 207, 157, 0.18);
      border-radius: 6px;

      text-decoration: none;
      letter-spacing: 0.035em;

      transition:
        background 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
    }

    .menu-link:hover,
    .menu-link:focus-visible {
      background: rgba(226, 177, 96, 0.14);
      border-color: rgba(238, 207, 157, 0.48);
      transform: translateX(3px);
    }

    .menu-link.current {
      color: #f1d08b;
      border-color: rgba(231, 181, 96, 0.55);
    }

    .menu-footer {
      margin-top: 24px;

      color: rgba(245, 234, 215, 0.48);
      font-size: 0.78rem;
      line-height: 1.5;
    }

    /* Vertical front room for phones */

    @media (max-width: 650px) and (orientation: portrait) {
      .front-scene {
        --phone-usable-height: calc(100dvh - max(8px, env(safe-area-inset-bottom)));
      }

      .front-room {
        top: 0;
        bottom: 0;
        margin-block: auto;
        width: min(100vw, calc(var(--phone-usable-height) * .48884));
        height: min(var(--phone-usable-height), calc(100vw / .48884));
        transform: translateX(-50%);
        --star-x: 49.66%;
        --star-y: 49.41%;

        background-image:
          url("assets/front-room-phone.webp");
      }

      .front-room::after {
        content: "";
        position: absolute;
        left: 3.767123%;
        top: 2.116992%;
        width: 7.876712%;
        height: 2.674095%;
        background: url("assets/front-room-phone-wood.webp") center / 100% 100% no-repeat;
        pointer-events: none;
      }

      .front-room::before {
        left: 46.232877%;
        top: 47.743733%;
        width: 6.849315%;
        height: 3.342618%;
        background-image: url("assets/front-room-note-star-phone.webp");
      }

      .enter {
        left: 49.5%;
        top: 57.6%;
        font-size: clamp(29px, 8vw, 42px);

  <script type="module">
    import { studioConditions } from "./assets/studio-weather.mjs";

    const menuButton = document.getElementById("menuButton");
    const menuPanel = document.getElementById("menuPanel");
    const menuShade = document.getElementById("menuShade");
    const frontRoom = document.querySelector(".front-room");
    const frontToast = document.getElementById("frontToast");
    const brainSecret = document.getElementById("brainSecret");
    const lampHotspot = document.getElementById("lampHotspot");
    const guitarHotspot = document.getElementById("guitarHotspot");
    const bobHotspot = document.getElementById("bobHotspot");
    const windowHotspot = document.getElementById("windowHotspot");

    let toastTimer;
    let audioContext;
    const rainAudio = document.getElementById("rainAudio");
    let bobReadyForDoor = false;
    let guitarChordIndex = 0;
    let guitarTimer;

    const bobRemarks = [
      "Bob says: Growth is mostly standing still with commitment.",
      "Bob says: Water me, but emotionally? Keep it reasonable.",
      "Bob says: I have one job and somehow I’m still behind.",
      "Bob says: The room looks better when you stop rushing through it.",
      "Bob says: Photosynthesis is just plants eating sunshine. You’re welcome."
    ];

    function showFrontToast(message) {
      window.clearTimeout(toastTimer);
      frontToast.textContent = message;
      frontToast.classList.add("show");

      toastTimer = window.setTimeout(() => {
        frontToast.classList.remove("show");
      }, 6500);
    }

    function getAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      return audioContext;
    }

    const guitarProgression = [
      { name: "G", notes: [196, 246.94, 293.66, 392] },
      { name: "D", notes: [146.83, 220, 293.66, 369.99] },
      { name: "Em", notes: [164.81, 196, 246.94, 329.63] },
      { name: "C", notes: [130.81, 196, 261.63, 329.63] }
    ];

    function playGuitarChord() {
      const chord = guitarProgression[guitarChordIndex];
      guitarChordIndex = (guitarChordIndex + 1) % guitarProgression.length;
      document.getElementById("guitarStatus").textContent = chord.name + " chord";
      guitarHotspot.classList.remove("strumming");
      void guitarHotspot.offsetWidth;
      guitarHotspot.classList.add("strumming");
      clearTimeout(guitarTimer);
      guitarTimer = setTimeout(() => guitarHotspot.classList.remove("strumming"), 650);
      if (!(window.AudioContext || window.webkitAudioContext)) return;
      const audio = getAudioContext();
      const now = audio.currentTime;
      const frequencies = chord.notes;

      frequencies.forEach((frequency, index) => {
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();
        const start = now + index * 0.045;

        oscillator.type = "triangle";
        oscillator.frequency.setValueAtTime(frequency, start);
        oscillator.detune.setValueAtTime((Math.random() - 0.5) * 7, start);

        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.045, start + 0.018);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 1.15);

        oscillator.connect(gain);
        gain.connect(audio.destination);
        oscillator.start(start);
        oscillator.stop(start + 1.2);
      });

    }

    lampHotspot.addEventListener("click", () => {
      frontRoom.classList.toggle("lamp-off");
      const lampIsOff = frontRoom.classList.contains("lamp-off");
      brainSecret.hidden = !lampIsOff;

      showFrontToast(
        lampIsOff
          ? "Lamp off. Something gold just woke up."
          : "Lamp on. Back to making things."
      );
    });

    guitarHotspot.addEventListener("click", playGuitarChord);

    bobHotspot.addEventListener("click", () => {
      if (bobReadyForDoor) {
        window.location.href = "bob.html";
        return;
      }

      const remark = bobRemarks[Math.floor(Math.random() * bobRemarks.length)];
      showFrontToast(remark + " Tap Bob again to visit his room.");
      bobReadyForDoor = true;

      window.setTimeout(() => {
        bobReadyForDoor = false;
      }, 7000);
    });
     // The glass changes the weather. It never opens a floating menu.
     studioConditions(frontRoom);
     rainAudio.src = "audio/front-room-rain.mp3";
     rainAudio.volume = 0.16;
     let rainActive = false;
     let rainContext;
     function rainBehindGlass() {
       if (rainContext) return rainContext;
       const AudioContextClass = window.AudioContext || window.webkitAudioContext;
       if (!AudioContextClass) return null;
       rainContext = new AudioContextClass();
       const source = rainContext.createMediaElementSource(rainAudio);
       const glass = rainContext.createBiquadFilter();
       glass.type = "lowpass";
       glass.frequency.value = 1250;
       glass.Q.value = 0.55;
       source.connect(glass);
       glass.connect(rainContext.destination);
       return rainContext;
     }
     windowHotspot.addEventListener("click", async () => {
       rainActive = !rainActive;
       frontRoom.classList.toggle("raining", rainActive);
       windowHotspot.setAttribute("aria-pressed", String(rainActive));
       windowHotspot.setAttribute("aria-label", rainActive
         ? "Let the rain outside the window clear"
         : "Make rain fall outside the window");
       if (rainActive) {
         try {
           const context = rainBehindGlass();
           if (context && context.state === "suspended") await context.resume();
           await rainAudio.play();
         } catch (error) {
           // Rain on the glass stays available when sound is blocked.
         }
       } else {
         rainAudio.pause();
       }
     });
     window.addEventListener("pagehide", () => rainAudio.pause());

    const noteStar = document.getElementById("noteStar");
    let starTimer;
    noteStar.addEventListener("click", () => {
      noteStar.classList.remove("spinning");
      void noteStar.offsetWidth;
      noteStar.classList.add("spinning");
      clearTimeout(starTimer);
      starTimer = setTimeout(() => noteStar.classList.remove("spinning"), 960);
    });

    const turnRoom = document.getElementById("turnRoom");
    const doorWall = document.getElementById("doorWall");
    function turn(toDoors) {
      doorWall.hidden = !toDoors;
      frontRoom.inert = toDoors;
      turnRoom.setAttribute("aria-expanded", String(toDoors));
      turnRoom.textContent = toDoors ? "Face the window" : "Turn around";
      if (toDoors && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        doorWall.animate([{opacity:.4,transform:"perspective(1000px) rotateY(-7deg) scale(.98)"},{opacity:1,transform:"none"}],{duration:280,easing:"ease-out"});
      }
    }
    turnRoom.addEventListener("click", () => turn(doorWall.hidden));

    function openMenu() {
      menuButton.classList.add("open");
      menuPanel.classList.add("open");
      menuShade.classList.add("open");

      menuButton.setAttribute("aria-expanded", "true");
      menuButton.setAttribute("aria-label", "Close rooms");
      menuPanel.inert = false;
      frontRoom.inert = true;
      doorWall.inert = true;
      turnRoom.inert = true;
    }

    function closeMenu() {
      menuButton.classList.remove("open");
      menuPanel.classList.remove("open");
      menuShade.classList.remove("open");

      menuButton.setAttribute("aria-expanded", "false");
      menuButton.setAttribute("aria-label", "Open rooms");
      menuPanel.inert = true;
      frontRoom.inert = !doorWall.hidden;
      doorWall.inert = false;
      turnRoom.inert = false;
      menuButton.focus({ preventScroll: true });
    }

    function toggleMenu() {
      const isOpen = menuPanel.classList.contains("open");

      if (isOpen) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    menuButton.addEventListener("click", toggleMenu);
    menuShade.addEventListener("click", closeMenu);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && menuButton.getAttribute("aria-expanded") === "true") {
        closeMenu();
      } else if (event.key === "Escape" && !doorWall.hidden) {
        turn(false);
        turnRoom.focus();
      }
    });

    window.addEventListener("pageshow", event => {
      if (event.persisted && menuButton.getAttribute("aria-expanded") === "true") closeMenu();
    });
  </script>
