<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Studio LaDuke</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      background:
        linear-gradient(rgba(0, 0, 0, 0.16), rgba(0, 0, 0, 0.2)),
        url("54EFFD92-C1F7-4A3E-BADE-CE8296F147E3.png")
        center center / cover no-repeat;
      color: #f5f1e8;
      font-family: Georgia, serif;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      width: min(760px, 100%);
      padding: 34px 22px;
      background: rgba(0, 0, 0, 0.12);
      border-radius: 18px;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.9);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.5rem, 10vw, 5.8rem);
      letter-spacing: 0.05em;
      line-height: 0.95;
    }

    .intro {
      margin: 0 auto;
      max-width: 560px;
      font-size: clamp(1rem, 4vw, 1.25rem);
      line-height: 1.5;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      margin-top: 24px;
      padding: 14px 28px;
      border: 1px solid #c99a4b;
      border-radius: 8px;
      color: #f3d28f;
      background: rgba(30, 18, 8, 0.58);
      box-shadow:
        0 0 18px rgba(201, 154, 75, 0.35),
        inset 0 0 10px rgba(255, 220, 150, 0.08);
      text-decoration: none;
      letter-spacing: 0.08em;
      font-size: 1rem;
    }

    .button:active {
      transform: scale(0.98);
    }

    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 10px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.78rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    @media (max-width: 650px) {
      body {
        background-position: 58% center;
        padding: 18px;
      }

      .container {
        margin-top: 28vh;
        padding: 24px 16px;
        background: rgba(0, 0, 0, 0.18);
      }

      h1 {
        font-size: clamp(2.4rem, 12vw, 4rem);
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Studio LaDuke</h1>

    <div class="intro">
      Art, stories, music, and things still becoming.
    </div>

    <a class="button" href="workshop.html">
      COME IN
    </a>
  </main>

  <footer>
    Ketchikan, Alaska
  </footer>
</body>
</html>
